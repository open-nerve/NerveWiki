name: CI

on:
  # 只在分支上：推 tag 时发布的闸门只认 tag 指的提交在 main 上已有的那次运行（release.yml），不再跑一遍十九项（M12/P5/S1）
  push:
    branches: ["**"]
  pull_request:

# 其他分支上的新推送取消同一分支较早的运行。main 的每次运行各占一个组：同一组里只保留一个排队的运行，
# 共用一个组时，排队中的运行会被更晚的推送替换掉，只靠 cancel-in-progress 保不住每个提交的结果。
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.leg }})
    # 同仓库分支的 PR 已由 push 事件在同一个提交上跑过；pull_request 事件只为 fork 的 PR 运行
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    # 一个作业跑全部的 Go 测试在 M8/P3A 时超过了 25 分钟的时限：分成几份并行，各占一个 runner（Makefile 的
    # test-go-race、test-go-bootstrap-1、-2、-3、-4、-5、-6、-7 与 -8、test-go-costs-1、-2 与 -3、test-go-costs-lint、test-go-guards-core、test-go-guards-sources，几份之和是 make test-go；另有 test-go-short 一份，只跑单元测试，
    # 不在这个和里）。不带竞态检测的耗时守卫也因此不与竞态检测下的构建抢 CPU。
    # server 共十六份（含 short），连同 web、e2e 与 image 共十九项；M10/P2/S2 历史四份本机两轮的包耗时均值见 Makefile。
    # 33b4/4550 两分支 CI 40718770843/40730123058 的第一份 Test 均值 450.5 秒过线；第二份 418.5 秒。
    # 按 Makefile 的窄名称边界将 EveryResolutionCaseImports 移给第二份，预计为 432.8926/436.1074 秒。
    # 当时新配置本机四份各两轮包耗时均值 319.376/309.7455/261.4265/266.258 秒，完整覆盖已核；不提高超时。
    # 当时两次分支 CI 与最终两次 main Test 均值另验；不把本机包耗时当作 CI Test 步骤。
    # 以下 S1-0 候选说明保留当时口径；当前五份候选见下文。
    # M10/P3/S1-0 当前候选只将 SECOND 的 The(MCP|Contents) 改为 The(MCP[C-Z]|Contents)。
    # 四个 MCP B 前缀顶层从第二份移到第三份，详见 Makefile；FIRST/THIRD、工作流执行内容及超时不变。
    # 既有 470 名称的候选静态分配为 167/70/118/115；当前编译清单、完整四份双轮与 CI 验收待实测。
    # M10/P3/S1 五份待测候选：f64 的分支 CI 41068871923 attempt1 四份 Test 为 379/425/590/403 秒。
    # 第五份取 TheMCP/TheLint/TheWikiTools，第二、三份排除它，第一、第四份原成员不动；494 顶层分为 167/39/114/122/52。
    # 18b五份各两轮与精确分支CI41171083998 attempt1已验；当前495顶层167/39/114/123/52。
    # 该分支单样本不代指定merge/record两次main各份Test均值严格<450秒验收；原Go/job期限不变。
    # 一份失败不取消别的：各自的失败都看得到。时限约为各份在 CI 上实测的两倍（M8/P3A，作业 6:20、10:58、9:26）：
    # 组合根那一份里 go test 的 -timeout 15m 先到，打出卡住的测试
    strategy:
      fail-fast: false
      matrix:
        include:
          # 组合根之外的全部包（go list 列出，新加的包自动在内）。M9/P1 S3 时作业已到 8:17，时限照约两倍的规则从 15 分钟提到
          # 20 分钟：go test 的 -timeout 15m 先到，打出卡住的测试（同组合根那几份）
          - leg: race
            timeout: 20
          # 组合根的整个程序测试，竞态检测下最慢的一个包，按测试名分成八份（Makefile 的 FIRST、SECOND、THIRD、FIFTH、SIXTH、SEVENTH、EIGHTH 与第四份互补规则；
          # M8/P4A 审查 C 的 M-6：一份时测试一步已到 12 分钟，离 go test 的 15 分钟时限只剩约两成）。一份的测试一步两次运行的平均
          # 过了约 7:30 时照 M9/P2 设计 6.5 挪界线或再分一份：M9/P2 S1 时第二份 7:15 与 8:33、第一份 6:59 与 6:56，界线往后挪之后
          # 第二份照旧过线（7:54、7:45，中间一次两份都快的看作离群），撤回、再分一份（数在 Makefile 的注释里）
          # M10/P2/S2 同 c7cec1fa 两分支 CI 40616009992、40619625333：三份 Test 均值 398/555.5/446.5 秒，
          # 第二份超额 105.5 秒，邻片余量 52/3.5 秒，按原规则加第四份，保留第一份与原超时。
          # 两次工作流均因 guards 失败；成功的 bootstrap 样本只触发分份，不能替代新四份实测和最终两次 main 验收。
          - leg: bootstrap-1
            timeout: 25
          - leg: bootstrap-2
            timeout: 25
          # M9/P2 S1：第二份的测试一步过了 go test 的 15 分钟的一半，按测试名再分一份（Makefile 的 BOOTSTRAP_THIRD）
          - leg: bootstrap-3
            timeout: 25
          # M11/P3/S1（00-M11 第 278 条）：第四份在 7763 上两次 main 445/440 秒，最贴近线，四个后台撤销与停用的测试挪到第六份（数在 Makefile 的注释里），时限不变
          - leg: bootstrap-4
            timeout: 25
          - leg: bootstrap-5
            timeout: 25
          # M11/P3/S1（00-M11 第 278 条）：收下第四份的四个（7763 上估约多 41–54 秒，327 → 约 374–387 秒），时限不变
          - leg: bootstrap-6
            timeout: 25
          # M11/P1/S1：升级的整个程序测试（TestUpgrade…）单列一份（Makefile 的 BOOTSTRAP_SEVENTH，00-M11 第 186 条）
          # M11/P1：第六份在 EPYC 7763 上两次 main 均值 460 秒过线，TestIngestBefore 挪到第七份（数在 Makefile 的注释里）
          - leg: bootstrap-7
            timeout: 25
          # M11/P2/S2：升级的检查、闸门、提交与工具（TestUpgrade(Check|Gates|Submit|Tools)…）单列一份（Makefile 的 BOOTSTRAP_EIGHTH，00-M11 第 261 条）：
          # 不开时第七份在 7763 上约 375–420 秒，邻份没有余量
          # M11/P2/S2 第一轮修复（00-M11 第 272 条）：第二份在 7763 上 Test 一步 457 秒过线，它的 TestVirtualExport 挪来这一份（7763 上约 85 秒），时限不变
          # M11/P2 的分份（00-M11 第 276 条）：第三、第五份在 7763 上到了 450 秒的线，各挪一个最大的顶层来这一份（数在 Makefile 的注释里），时限不变
          # M11/P3/S1（00-M11 第 290 条）：审阅的较重的三个（TestUpgradeApproval、TestUpgradeReview、TestUpgradeReviewInterleavings）来这一份，P3 设计 7.5 估
          # 7763 上 289 → 约 350–375 秒，时限不变
          # M12/P1/S2（M12 决定 354）：第三、第五份在 7763 上约 415、409 秒，各挪一个来这一份（数在 Makefile 的注释里），时限不变
          - leg: bootstrap-8
            timeout: 25
          # 不带竞态检测的预算与界线的守卫、server/tools；静态检查与生成物的检查也只在这一份里跑一次。M9/P4 S1 加 grep 的守卫，
          # P4 之后作业估计 6.5–11 分钟，时限照约两倍的规则从 20 分钟提到 25 分钟（M9/P4 设计 6.5，第 11 节第 54 条）
          # M10/P4/S2：原 costs 的 32 条命令按 1–13 / 14–20 / 21–32 连续分三份。
          # 42093077490/a1 在第16条期间到作业25m被取消；原Go期限、样本与预算不变。
          # 静态与生成物检查仅第一份；实际新CI结果另验。
          # D143：costs-2 在 PreparedSource 后增加两条 LinksReached 物理守卫；现共34条（13/9/12）。
          # 原32条的argv、分组与各Go期限不变；新增两条各独立默认10m，实际新CI余量另验。
          # M10/P4/S2 审查：costs-1/2 实测作业 17.2/15.4 分钟，而 runner CPU 可差两倍，照约两倍的规则取 35。
          # M11/P1/S1：costs-2 末尾加删除护栏的读一条（本机约 2.5 秒）；现共35条（13/10/12），时限不变。
          # M11/P1/S2：costs-2 末尾加发起的守卫一条（本机约 26 秒，作业 15.7 分钟时加它约 1 分钟）；现共36条（13/11/12），时限不变。
          # M11/P1/S2 审查第一轮：守卫的库另种九本笔记本的行（第 240 条），本机约 36 秒（种子 10 秒）；时限不变。
          # M11/P1/S3：costs-3 末尾加回滚的三个守卫（本机约 4 分钟，其中先删 10 万页约 3 分钟）；作业估计 8–10 分钟加约 8 分钟，
          # 照约两倍的规则 costs-3 的时限从 25 分钟提到 35 分钟，同 costs-1、costs-2；现共39条（13/11/15）。
          # M11/P2/S1：costs-2 末尾加护栏的读一条（本机约 17 秒，其中种子约 13 秒）；现共40条（13/12/15），时限不变。
          # M11/P2/S1 修复（00-M11 第 267 条提前到 S1）：costs-2 在 EPYC 7763 上 main 的作业 22.2–24.4 分钟（42530568840 22.2、
          # 42752100006 23.2、42762546769 23.7），末几行在第 21.4–22.6 分钟才开始，S1 又在末尾加一行；照约两倍的规则，go test 的
          # 默认超时要先于作业时限到，costs-2 的时限从 35 分钟提到 45 分钟。
          # M11/P2/S2：costs-2 末尾加检查的守卫一条（5 万页，本机约 20 秒，其中种子约 12 秒）；costs-3 在回滚的读之后加闸门的读的计划一条
          # （本机约 22 秒，其中种子约 14 秒）；现共42条（13/13/16），时限不变。
          # M11/P2/S2 第一轮修复（00-M11 第 275 条）：costs-3 在 EPYC 7763 上 main 的作业 16.7–18.4 分钟（42718191474 16.7、
          # 42749131694 18.4、42834026668 16.8），-timeout 20m 那一行在第 12.7–14.4 分钟才开始；S2 在它之前加了闸门的读的计划一行
          # （9V74 上约 0.6 分钟，分支的 42882105107 里那一行在第 11.8 分钟开始），7763 上那一行约在第 13.5–15.2 分钟开始，卡住时它的
          # 20 分钟到第 33.5–35.2 分钟，最慢的已在作业的 35 分钟之后；照约两倍的规则，go test 的超时要先于作业时限到，costs-3 的时限
          # 从 35 分钟提到 40 分钟。不挪测试、不改界。
          # M11/P3/S1（00-M11 第 294 条）：costs-1 末尾加批准的守卫一条（本机约 2 分钟，7763 上估约 4–5 分钟，加第一次编译不带竞态的组合根约 1 分钟）；
          # S3 的三次运行 costs-1 的作业 14:31、15:06、15:41，之后估约 20–22 分钟（设计时估 23–26 分钟），runner 的 CPU 可差两倍，照约两倍的规则
          # 时限从 35 分钟提到 45 分钟（同第 267 条 costs-2 35 → 45）；这一行约在第 15–17 分钟开始，带 -timeout 15m 到第 30–32 分钟，Go 的超时先于
          # 作业时限到。现共43条（14/13/16）。
          # M12/P4/S7（P4/S7 设计 4.5，决定 660）：costs-2 在 M10 的 LinksReached 计划测试之后加宽读的两行，逐行的随机对照本机 54.2、54.1 秒，
          # 计划与物理工作量 24.3、23.0 秒（整行的墙钟，含编译，各两轮）；之前 M12/P4/S1 在 costs-3 加过语料一行，现共46条（14/15/17）。
          # costs-2 在 EPYC 7763 上 main 的作业 1,481–1,536 秒（6 次），已过约两倍的线；照约两倍的规则，时限取
          # 2 ×（1,536 秒 + 两行本机均值之和 77.8 秒 × 2.4）= 3,445 秒、向上取到 5 分钟的整数，从 45 分钟提到 60 分钟。
          # 两行在 7763 上各估约 130、57 秒，在 5 分钟之下，带 Go 默认的 10 分钟（M9/P2 设计 6.5）。
          # M12/P4/S7：costs-3 在末行（带竞态的 server/tools）之前加树写的守卫一行（本机 14.6、10.8 秒，整行的墙钟，均值 12.7 秒）；
          # costs-3 在 7763 上 main 的作业 1,055–1,133 秒（9 次），1,133 + 12.7 × 2.4 = 1,163 秒，在约两倍的线 1,200 秒之下，时限不变。
          # 现共47条（14/15/18）。
          - leg: costs-1
            timeout: 45
          - leg: costs-2
            timeout: 60
          - leg: costs-3
            timeout: 40
          # lint 的迁移、计划与十万页规则/编排成本独立一份；静态检查和生成检查只在 costs-1 运行。
          - leg: costs-lint
            timeout: 25
          # 不带竞态检测的组合根的预算与守卫：成本那一份在 M8/P4A 之前已到 15 分钟，加后台撤销的守卫时分出（M8/P4 设计 3.11）。
          # M9/P1 S2 时作业已到 11:05，时限照约两倍的规则从 20 分钟提到 25 分钟（S2 修正第二轮）；M9/P3 S1 修正第 6 轮时作业到 12:47，
          # 照同一个规则从 25 分钟提到 30 分钟（修正第 7 轮，复核 C 的 N3-f4）：卡住时 go test 的时限仍先到，最晚约 21 分钟
          # M10/P4/S1 的 986 文档 CI 41517408885 attempt1 到 30 分钟取消；18 条 Go recipe 已各打印 package ok，
          # 但 Test 步骤未成功。按完整原 recipe 分成前十二条与末六条来源操作，不提高作业或 Go 时限。
          # M11/P2/S1：加护栏在界上的单元一行（本机约 21 秒），时限不变。
          # M11/P2/S1 修复（00-M11 第 269 条）：guards-core 在 EPYC 7763 上作业 18.6–20.0 分钟（42741553383 20.0、42770402937 19.8），
          # 末行在第 18.1–19.5 分钟才开始，卡住时 Go 默认的 10 分钟只比 30 分钟早约半分钟；照约两倍的规则，go test 的默认超时要先于
          # 作业时限到，guards-core 的时限从 30 分钟提到 40 分钟。guards-sources 在 7763 上作业 16.7–16.9 分钟、末行在第 16.4–16.5
          # 分钟开始，时限不变。
          - leg: guards-core
            timeout: 40
          - leg: guards-sources
            timeout: 30
          # 只跑单元测试（Makefile 的 test-go-short：go test -short，不带竞态检测，不起数据库），README 告诉贡献者这样跑：别的份都不这样跑，
          # M9/P2 S1 的一个测试在 -short 下失败、没有谁看见（S1 修复第二轮，审查 C 的 C2-M1）。不在 make test-go 的各份之和里，也不进组合根的份：
          # 那几份的规则读它们的测试一步。按耗时判定的守卫在 -short 下跳过：这一份的各包同时跑，一个 2 秒的界线在这里到过 2.6 秒
          # （S1 修复第二轮的第二次运行），本机整个 53 与 38 秒，CI 上作业 2:38。时限 20 分钟，不是作业的两倍：这一行的 go test 不带
          # -timeout，Go 默认的每个测试二进制 10 分钟（在构建之后）要先到、打出卡住的测试，同别的各份；Go 的缓存是冷的时（例如 go.sum
          # 改了）构建慢得多、各个二进制开始得晚，15 分钟就可能先到（修复第三轮，审查 C）
          - leg: short
            timeout: 20
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # 按完整的提交 SHA 引用 actions（tag 可以被改指），注释中写明对应的版本
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 之后的步骤会运行第三方代码（pnpm install、golangci-lint 的安装脚本），不在 .git/config 里留下令牌
          persist-credentials: false
      # Go 的缓存只给竞态构建的九份（race、bootstrap-1 到 bootstrap-8），不带竞态的七份（short、costs-*、guards-*）不取也不存
      # （M12 决定 355）。setup-go 的键由 runner 的系统与架构、Go 的版本与下面两份 go.sum 的哈希组成，十六份同一个键；键归先跑完、
      # 先存下的那一份，存下就不再改。竞态与不带竞态的编译结果不共用：S2 之前 main 的键是 2026-10-17 的 bootstrap-1 存的（那时还没有
      # short），之后一个月没换，组合根在 EPYC 7763 上 Test 一步减包约 33 秒；S2 改了 Go 与 go.sum，七次运行里都是 short 最先跑完，
      # 由它存的话竞态的各份照旧从头编译，分支上 7763 上是 81–88 秒（M12/P1/S2 审查 B 的 I1）。七份取回竞态的缓存只少约 2 秒的模块
      # 下载；costs-3 末行带竞态的 server/tools 只有一个包。判断看是哪一份存的键（post 一步的 "Cache saved with the key"），不看大小
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: ${{ matrix.leg == 'race' || startsWith(matrix.leg, 'bootstrap-') }}
          # server/tools 是独立的 Go 模块（oapi-codegen），生成物检查要用它
          cache-dependency-path: |
            server/go.sum
            server/tools/go.sum
      - name: Go version
        working-directory: server
        run: go version
      # ubuntu-24.04 的 runner 池有几代 CPU，同一二进制的耗时可差两倍；计时失败先看落在哪一种（M10/P4/S2）
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo
      - name: Lint
        if: matrix.leg == 'costs-1'
        run: make lint-go
      # 三份工作流的写法：只在 runner 上跑，本机的 make lint 不含它（M12/P5/S1）
      - name: Lint workflows
        if: matrix.leg == 'costs-1'
        run: make lint-actions
      # 由 api/ 重新生成 Go 接口层，生成物必须已提交且没有差异
      - name: Generated code
        if: matrix.leg == 'costs-1'
        run: make gen-check-go
      # 集成测试用 testcontainers 启动 PostgreSQL：ubuntu runner 自带 Docker。
      # 输出另存一份：失败时下一步从中取出失败的测试
      - name: Test
        id: go-tests
        shell: bash
        # 不用回收器（Ryuk）：go test ./... 的各个包共用一个回收器的会话；一个包连它出错时 testcontainers 终止它、另起一个（reaper.go 的 retryLocked），
        # 新的那个在自己的客户端走光之后清掉整个会话的容器，连同没连上它、还在跑的包的数据库（M7/P6A 的 CI 两次在 bootstrap 中途失去数据库，疑为此）。
        # runner 用完即弃，容器不必回收；本机照旧由回收器删除
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        # 完整 SQL/参数/EXPLAIN 的单行可超过 1 MiB；直接送到 runner 的控制台会积压，直到作业超时。
        # tee 保存原字节，控制台只预览每行前 1 KiB，留出失败注解的上下文空间；pipefail 保留测试/管道失败。
        run: |
          make "test-go-${{ matrix.leg }}" 2>&1 | tee "$RUNNER_TEMP/test-go.log" | python3 .github/scripts/preview-test-log.py | tee "$RUNNER_TEMP/test-go-preview.log"
      - name: Upload the Go test log
        if: always() && steps.go-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-${{ matrix.leg }}
          path: |
            ${{ runner.temp }}/test-go.log
            ${{ runner.temp }}/test-go-preview.log
          if-no-files-found: error
      # 失败的测试写成注解：公开仓库的运行日志只有有权限的人读得到，注解经检查的接口人人可读。
      # 失败处之前的 16 行也取：带 -v 的测试（耗时的守卫）在 --- FAIL 之前就打出了 === RUN 与自己的 Logf、Errorf，
      # 只取其后的行时注解里看不出是哪一条断言失败、测得多少（M8，main 的 1f732c9）；总量仍由 head 与下面的字数封顶。
      # 容器、磁盘、内存与内核的 OOM 记录另写成警告（错误的注解一步至多十条）：数据库中途消失时看得出是谁
      - name: Annotate the failed tests
        if: failure()
        shell: bash
        run: |
          grep -E -B16 -A24 -- '--- FAIL|^panic: |^FAIL\s' "$RUNNER_TEMP/test-go-preview.log" | head -n 600 > "$RUNNER_TEMP/failures.txt" || true
          {
            echo "== containers"
            docker ps -a --format '{{.ID}} {{.Image}} {{.Status}}'
            for id in $(docker ps -aq --filter status=exited); do
              echo "== exited $id: $(docker inspect -f 'code={{.State.ExitCode}} oom={{.State.OOMKilled}} {{.State.Error}}' "$id")"
              docker logs --tail 12 "$id" 2>&1
            done
            echo "== disk"; df -h /
            echo "== memory"; free -m
            echo "== kernel"; sudo dmesg 2>/dev/null | grep -iE 'out of memory|killed process' | tail -n 10
          } > "$RUNNER_TEMP/environment.txt" 2>&1 || true
          python3 - "$RUNNER_TEMP/failures.txt" "$RUNNER_TEMP/environment.txt" <<'EOF'
          import sys
          for path, level, title, most in ((sys.argv[1], "error", "Go test failures", 36000), (sys.argv[2], "warning", "Test environment", 16000)):
              text = open(path, encoding="utf-8", errors="replace").read()[:most]
              for i in range(0, len(text), 4000):
                  chunk = text[i:i + 4000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::{level} title={title}, part {i // 4000 + 1}::{chunk}")
          EOF

  web:
    name: web
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      # pnpm 的包存储按锁文件缓存：锁文件变了就换一个缓存，旧的包不会越积越多
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: make lint-web
      # 重新打包 api/dist 并生成 TS 类型，生成物必须已提交且没有差异
      - name: Generated code
        run: make gen-check-web
      - name: Unused code
        run: make knip
      - name: Test
        run: make test-web
      - name: Build
        run: make build-web

  e2e:
    name: e2e
    # server（它的各份全部）、web 都通过之后才运行；if 与这两个任务相同
    needs: [server, web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    # 时限分开（旁支 m12-e2e-browsers-cache）：E2E 一步自己 18 分钟，是 00-M12 第 3 节第 11 条的那一个；装浏览器一步自己 30 分钟。
    # apt 的镜像慢的时候，装浏览器一步要将近 15 分钟到 20 分钟以上：2026-11-07 至 18 日 254 个作业（attempt）里 15 个，五个装完时已
    # 14:58–18:52，十个到作业原来的 20 分钟还没装完，连同 E2E 一起被取消（其余 239 个 35 秒到 4:14）。30 分钟的依据（推断）：11-18
    # 被截在半途的几次按已取到的量推算，最慢的一次（平均 87 kB/s）约 24.7–24.9 分钟装完，30 分钟留出余量；镜像比那天更慢时仍会不够。
    # 作业的时限要在两步各自的时限之后才到：前几步（中位 31 秒，至多 50 秒）、系统包的缓存、装浏览器 30 分钟、E2E 18 分钟、上传报告，
    # 取 55 分钟
    timeout-minutes: 55
    env:
      # 写进 bin/nervewiki 的版本号，与默认值不同，S3 由此确认 make build 的注入生效
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 提交信息取自 Go 工具链嵌入的 VCS 信息，需要 .git；令牌不留在 .git/config 里
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      # 全部故事跑 Chromium，部分也跑 Firefox、WebKit（e2e/playwright.config.ts）。浏览器从 Playwright 的 CDN 下载，慢的 runner 上
      # 也只要几秒，不缓存。--with-deps 用 apt 装约 125 MB 的系统包，镜像慢的时候要将近 15 分钟以上：这些 .deb 存进缓存，下次先放回 apt
      # 的目录，文件名（含版本）与大小同索引的就不再下载（apt 说 "Need to get 0 B"）。键随 runner 的系统、Playwright 的版本（它定要
      # 装哪些包）与 ISO 的周走：Ubuntu 的更新让存下的 .deb 渐渐过时，每周一个新键，先取回最近存的一份（restore-keys），只下载变了的，
      # 再存成新键；apt-get autoclean 去掉索引里已没有的旧版本，缓存不越存越大。
      # 信任：apt 对放回的 .deb 只比文件名与大小、不核哈希，之后以 root 装上。大家共用的那一份只有 main 上的运行写得进，能推 main 的人
      # 本来就能改这份工作流；别的分支与 fork 的 PR 存下的只有它自己读得到。这个作业的令牌只有 contents: read，不用任何 secret。
      # 怀疑缓存坏了时，删掉键以 playwright-debs- 开头的缓存（写操作，先问负责人）
      - name: Locate the Playwright system packages
        id: playwright-debs
        working-directory: e2e
        run: |
          version=$(pnpm exec playwright --version)
          prefix="playwright-debs-$ImageOS-${version#Version }-"
          {
            echo "prefix=$prefix"
            echo "key=$prefix$(date -u +%G-W%V)"
            echo "path=$HOME/.cache/playwright-debs"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright system packages
        id: playwright-debs-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.playwright-debs.outputs.path }}
          key: ${{ steps.playwright-debs.outputs.key }}
          restore-keys: ${{ steps.playwright-debs.outputs.prefix }}
      - name: Install the Playwright browsers
        working-directory: e2e
        timeout-minutes: 30
        env:
          DEBS: ${{ steps.playwright-debs.outputs.path }}
        run: |
          if compgen -G "$DEBS/*.deb" > /dev/null; then sudo cp "$DEBS"/*.deb /var/cache/apt/archives/; fi
          pnpm exec playwright install --with-deps chromium firefox webkit
          sudo apt-get autoclean -q
          rm -rf "$DEBS"
          mkdir -p "$DEBS"
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then cp /var/cache/apt/archives/*.deb "$DEBS"/; fi
          echo "缓存目录里的系统包：$(find "$DEBS" -name '*.deb' | wc -l) 个 .deb，$(du -sh "$DEBS" | cut -f1)"
      # 只在没有恰好命中时存；装浏览器一步失败时不存。存在 E2E 之前：E2E 红了，重跑也取得到
      - name: Save the Playwright system packages
        if: steps.playwright-debs-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.playwright-debs.outputs.path }}
          key: ${{ steps.playwright-debs.outputs.key }}
      # make e2e 先完整执行 make build（Go 与 Node 都要）：持续集成中只有这里构建内嵌前端的二进制。
      # 时限是 00-M12 第 3 节第 11 条的那一个，E2E 本身变慢时在这里红：作业原来的 20 分钟减去平常的前几步与装浏览器（中位 31 + 54 秒）。
      # 2026-11-06 至 18 日绿的 235 次 3:30–8:52，中位 6:27
      - name: E2E
        timeout-minutes: 18
        run: make e2e
      # 报告中带着失败用例的 trace 与截图；test-results/ 中另有每个 worker 的服务日志与失败时导出的数据库
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          # 每个服务的附件目录（*.data，M7）不上传：导入导出的 zip 可能很大
          path: |
            e2e/playwright-report/
            e2e/test-results/
            !e2e/test-results/**/*.data/**

  image:
    name: image
    needs: [server, web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 与 e2e 任务相同：与默认值不同，image-smoke.sh 由此确认镜像里的版本号是注入的
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .git 进入镜像的构建阶段（取提交信息），其中不能有令牌
          persist-credentials: false
      # 构建镜像，在它上面跑 S1、S3，核对进程不是 root、停机时退出码为 0
      - name: Image smoke
        run: make image-smoke
