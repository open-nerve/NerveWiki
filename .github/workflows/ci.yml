name: CI

on:
  push:
  pull_request:

# 其他分支上的新推送取消同一分支较早的运行。main 的每次运行各占一个组：同一组里只保留一个排队的运行，
# 共用一个组时，排队中的运行会被更晚的推送替换掉，只靠 cancel-in-progress 保不住每个提交的结果。
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.leg }})
    # 同仓库分支的 PR 已由 push 事件在同一个提交上跑过；pull_request 事件只为 fork 的 PR 运行
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    # 一个作业跑全部的 Go 测试在 M8/P3A 时超过了 25 分钟的时限：分成几份并行，各占一个 runner（Makefile 的
    # test-go-race、test-go-bootstrap-1、-2 与 -3、test-go-costs、test-go-guards，几份之和是 make test-go；另有 test-go-short 一份，只跑单元测试，
    # 不在这个和里）。不带竞态检测的耗时守卫也因此不与竞态检测下的构建抢 CPU。
    # 一份失败不取消别的：各自的失败都看得到。时限约为各份在 CI 上实测的两倍（M8/P3A，作业 6:20、10:58、9:26）：
    # 组合根那一份里 go test 的 -timeout 15m 先到，打出卡住的测试
    strategy:
      fail-fast: false
      matrix:
        include:
          # 组合根之外的全部包（go list 列出，新加的包自动在内）。M9/P1 S3 时作业已到 8:17，时限照约两倍的规则从 15 分钟提到
          # 20 分钟：go test 的 -timeout 15m 先到，打出卡住的测试（同组合根那几份）
          - leg: race
            timeout: 20
          # 组合根的整个程序测试，竞态检测下最慢的一个包，按测试名分成三份（Makefile 的 BOOTSTRAP_FIRST 与 BOOTSTRAP_THIRD；
          # M8/P4A 审查 C 的 M-6：一份时测试一步已到 12 分钟，离 go test 的 15 分钟时限只剩约两成）。一份的测试一步两次运行的平均
          # 过了约 7:30 时照 M9/P2 设计 6.5 挪界线或再分一份：M9/P2 S1 时第二份 7:15 与 8:33、第一份 6:59 与 6:56，界线往后挪之后
          # 第二份照旧过线（7:54、7:45，中间一次两份都快的看作离群），撤回、再分一份（数在 Makefile 的注释里）
          - leg: bootstrap-1
            timeout: 25
          - leg: bootstrap-2
            timeout: 25
          # M9/P2 S1：第二份的测试一步过了 go test 的 15 分钟的一半，按测试名再分一份（Makefile 的 BOOTSTRAP_THIRD）
          - leg: bootstrap-3
            timeout: 25
          # 不带竞态检测的预算与界线的守卫、server/tools；静态检查与生成物的检查也只在这一份里跑一次
          - leg: costs
            timeout: 20
          # 不带竞态检测的组合根的预算与守卫：成本那一份在 M8/P4A 之前已到 15 分钟，加后台撤销的守卫时分出（M8/P4 设计 3.11）。
          # M9/P1 S2 时作业已到 11:05，时限照约两倍的规则从 20 分钟提到 25 分钟（S2 修正第二轮）
          - leg: guards
            timeout: 25
          # 只跑单元测试（Makefile 的 test-go-short：go test -short，不带竞态检测，不起数据库），README 告诉贡献者这样跑：别的份都不这样跑，
          # M9/P2 S1 的一个测试在 -short 下失败、没有谁看见（S1 修复第二轮，审查 C 的 C2-M1）。不在 make test-go 的各份之和里，也不进组合根的份：
          # 那几份的规则读它们的测试一步。按耗时判定的守卫在 -short 下跳过：这一份的各包同时跑，一个 2 秒的界线在这里到过 2.6 秒
          # （S1 修复第二轮的第二次运行），本机整个 53 与 38 秒，CI 上作业 2:38。时限 20 分钟，不是作业的两倍：这一行的 go test 不带
          # -timeout，Go 默认的每个测试二进制 10 分钟（在构建之后）要先到、打出卡住的测试，同别的各份；Go 的缓存是冷的时（例如 go.sum
          # 改了）构建慢得多、各个二进制开始得晚，15 分钟就可能先到（修复第三轮，审查 C）
          - leg: short
            timeout: 20
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # 按完整的提交 SHA 引用 actions（tag 可以被改指），注释中写明对应的版本
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 之后的步骤会运行第三方代码（pnpm install、golangci-lint 的安装脚本），不在 .git/config 里留下令牌
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # server/tools 是独立的 Go 模块（oapi-codegen），生成物检查要用它
          cache-dependency-path: |
            server/go.sum
            server/tools/go.sum
      - name: Go version
        working-directory: server
        run: go version
      - name: Lint
        if: matrix.leg == 'costs'
        run: make lint-go
      # 由 api/ 重新生成 Go 接口层，生成物必须已提交且没有差异
      - name: Generated code
        if: matrix.leg == 'costs'
        run: make gen-check-go
      # 集成测试用 testcontainers 启动 PostgreSQL：ubuntu runner 自带 Docker。
      # 输出另存一份：失败时下一步从中取出失败的测试
      - name: Test
        shell: bash
        # 不用回收器（Ryuk）：go test ./... 的各个包共用一个回收器的会话；一个包连它出错时 testcontainers 终止它、另起一个（reaper.go 的 retryLocked），
        # 新的那个在自己的客户端走光之后清掉整个会话的容器，连同没连上它、还在跑的包的数据库（M7/P6A 的 CI 两次在 bootstrap 中途失去数据库，疑为此）。
        # runner 用完即弃，容器不必回收；本机照旧由回收器删除
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: make "test-go-${{ matrix.leg }}" 2>&1 | tee "$RUNNER_TEMP/test-go.log"
      # 失败的测试写成注解：公开仓库的运行日志只有有权限的人读得到，注解经检查的接口人人可读。
      # 失败处之前的 16 行也取：带 -v 的测试（耗时的守卫）在 --- FAIL 之前就打出了 === RUN 与自己的 Logf、Errorf，
      # 只取其后的行时注解里看不出是哪一条断言失败、测得多少（M8，main 的 1f732c9）；总量仍由 head 与下面的字数封顶。
      # 容器、磁盘、内存与内核的 OOM 记录另写成警告（错误的注解一步至多十条）：数据库中途消失时看得出是谁
      - name: Annotate the failed tests
        if: failure()
        shell: bash
        run: |
          grep -E -B16 -A24 -- '--- FAIL|^panic: |^FAIL\s' "$RUNNER_TEMP/test-go.log" | head -n 600 > "$RUNNER_TEMP/failures.txt" || true
          {
            echo "== containers"
            docker ps -a --format '{{.ID}} {{.Image}} {{.Status}}'
            for id in $(docker ps -aq --filter status=exited); do
              echo "== exited $id: $(docker inspect -f 'code={{.State.ExitCode}} oom={{.State.OOMKilled}} {{.State.Error}}' "$id")"
              docker logs --tail 12 "$id" 2>&1
            done
            echo "== disk"; df -h /
            echo "== memory"; free -m
            echo "== kernel"; sudo dmesg 2>/dev/null | grep -iE 'out of memory|killed process' | tail -n 10
          } > "$RUNNER_TEMP/environment.txt" 2>&1 || true
          python3 - "$RUNNER_TEMP/failures.txt" "$RUNNER_TEMP/environment.txt" <<'EOF'
          import sys
          for path, level, title, most in ((sys.argv[1], "error", "Go test failures", 36000), (sys.argv[2], "warning", "Test environment", 16000)):
              text = open(path, encoding="utf-8", errors="replace").read()[:most]
              for i in range(0, len(text), 4000):
                  chunk = text[i:i + 4000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::{level} title={title}, part {i // 4000 + 1}::{chunk}")
          EOF

  web:
    name: web
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      # pnpm 的包存储按锁文件缓存：锁文件变了就换一个缓存，旧的包不会越积越多
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: make lint-web
      # 重新打包 api/dist 并生成 TS 类型，生成物必须已提交且没有差异
      - name: Generated code
        run: make gen-check-web
      - name: Unused code
        run: make knip
      - name: Test
        run: make test-web
      - name: Build
        run: make build-web

  e2e:
    name: e2e
    # server（它的各份全部）、web 都通过之后才运行；if 与这两个任务相同
    needs: [server, web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 写进 bin/nervewiki 的版本号，与默认值不同，S3 由此确认 make build 的注入生效
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 提交信息取自 Go 工具链嵌入的 VCS 信息，需要 .git；令牌不留在 .git/config 里
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      # 只装无界面的 Chromium 和它需要的系统库；不缓存浏览器：系统库缓存不了，下载与恢复缓存的耗时相当
      - name: Install the Playwright browser
        working-directory: e2e
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # make e2e 先完整执行 make build（Go 与 Node 都要）：持续集成中只有这里构建内嵌前端的二进制
      - name: E2E
        run: make e2e
      # 报告中带着失败用例的 trace 与截图；test-results/ 中另有每个 worker 的服务日志与失败时导出的数据库
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          # 每个服务的附件目录（*.data，M7）不上传：导入导出的 zip 可能很大
          path: |
            e2e/playwright-report/
            e2e/test-results/
            !e2e/test-results/**/*.data/**

  image:
    name: image
    needs: [server, web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 与 e2e 任务相同：与默认值不同，image-smoke.sh 由此确认镜像里的版本号是注入的
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .git 进入镜像的构建阶段（取提交信息），其中不能有令牌
          persist-credentials: false
      # 构建镜像，在它上面跑 S1、S3，核对进程不是 root、停机时退出码为 0
      - name: Image smoke
        run: make image-smoke
