name: CI

on:
  push:
  pull_request:

# 其他分支上的新推送取消同一分支较早的运行。main 的每次运行各占一个组：同一组里只保留一个排队的运行，
# 共用一个组时，排队中的运行会被更晚的推送替换掉，只靠 cancel-in-progress 保不住每个提交的结果。
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server
    # 同仓库分支的 PR 已由 push 事件在同一个提交上跑过；pull_request 事件只为 fork 的 PR 运行
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 按完整的提交 SHA 引用 actions（tag 可以被改指），注释中写明对应的版本
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 之后的步骤会运行第三方代码（pnpm install、golangci-lint 的安装脚本），不在 .git/config 里留下令牌
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # server/tools 是独立的 Go 模块（oapi-codegen），生成物检查要用它
          cache-dependency-path: |
            server/go.sum
            server/tools/go.sum
      - name: Go version
        working-directory: server
        run: go version
      - name: Lint
        run: make lint-go
      # 由 api/ 重新生成 Go 接口层，生成物必须已提交且没有差异
      - name: Generated code
        run: make gen-check-go
      # 集成测试用 testcontainers 启动 PostgreSQL：ubuntu runner 自带 Docker。
      # 输出另存一份：失败时下一步从中取出失败的测试
      - name: Test
        shell: bash
        run: make test-go 2>&1 | tee "$RUNNER_TEMP/test-go.log"
      # 失败的测试写成注解：公开仓库的运行日志只有有权限的人读得到，注解经检查的接口人人可读
      - name: Annotate the failed tests
        if: failure()
        shell: bash
        run: |
          grep -E -A24 -- '--- FAIL|^panic: |^FAIL\s' "$RUNNER_TEMP/test-go.log" | head -n 600 > "$RUNNER_TEMP/failures.txt" || true
          python3 - "$RUNNER_TEMP/failures.txt" <<'EOF'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()[:36000]
          for i in range(0, len(text), 4000):
              chunk = text[i:i + 4000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Go test failures, part {i // 4000 + 1}::{chunk}")
          EOF

  web:
    name: web
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      # pnpm 的包存储按锁文件缓存：锁文件变了就换一个缓存，旧的包不会越积越多
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: make lint-web
      # 重新打包 api/dist 并生成 TS 类型，生成物必须已提交且没有差异
      - name: Generated code
        run: make gen-check-web
      - name: Unused code
        run: make knip
      - name: Test
        run: make test-web
      - name: Build
        run: make build-web

  e2e:
    name: e2e
    # server、web 都通过之后才运行；if 与这两个任务相同
    needs: [server, web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 写进 bin/nervewiki 的版本号，与默认值不同，S3 由此确认 make build 的注入生效
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 提交信息取自 Go 工具链嵌入的 VCS 信息，需要 .git；令牌不留在 .git/config 里
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      # 只装无界面的 Chromium 和它需要的系统库；不缓存浏览器：系统库缓存不了，下载与恢复缓存的耗时相当
      - name: Install the Playwright browser
        working-directory: e2e
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # make e2e 先完整执行 make build（Go 与 Node 都要）：持续集成中只有这里构建内嵌前端的二进制
      - name: E2E
        run: make e2e
      # 报告中带着失败用例的 trace 与截图；test-results/ 中另有每个 worker 的服务日志与失败时导出的数据库
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

  image:
    name: image
    needs: [server, web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 与 e2e 任务相同：与默认值不同，image-smoke.sh 由此确认镜像里的版本号是注入的
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .git 进入镜像的构建阶段（取提交信息），其中不能有令牌
          persist-credentials: false
      # 构建镜像，在它上面跑 S1、S3，核对进程不是 root、停机时退出码为 0
      - name: Image smoke
        run: make image-smoke
