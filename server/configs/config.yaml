# 基础配置：列出所有配置项及其默认值。各环境的覆盖项在 config.<env>.yaml 中。
# 任何一项都可以用环境变量覆盖：NWIKI_ 加上配置路径，层级之间用双下划线，
# 例如 database.url 对应 NWIKI_DATABASE__URL。
server:
  addr: ":8080"
  # 连接上的读写都有上限：读请求头、读整个请求（含请求体）、写响应。
  # 长连接路由（SSE、MCP 流）自己解除写上限；流式路由（附件与导入导出的上传、下载）的读写上限
  # 从 read_timeout 起，按已传的字节数以最低速率推后。其余路由不要为个别接口调大全局值。
  # handler 自身的执行时间不受这些上限约束，它里面的阻塞调用要自带期限。
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 60s
  # 停机时给正在处理的请求留的时间，到期后强制关闭连接
  shutdown_timeout: 20s
  # 每个接口操作的期限：到期取消请求的 context，数据库调用随之结束。加上 read_timeout 必须短于
  # write_timeout，期限到了之后还要写出错误响应。长连接与流式路由不受它约束（流式路由读写之外的步骤仍受）
  request_timeout: 15s
  # 接口请求体的上限（字节），超出时 413 payload_too_large。页面正文的两个路由（写正文、带正文新建）
  # 另有自己的上限，期限另加 read_timeout，给请求体传完的时间：5 MiB 的正文在 30 秒内传完约需
  # 1.4 Mbit/s 的上行，更慢的链路调大 read_timeout 与 write_timeout
  max_body_bytes: 1048576
  # 非空时，监听成功后把实际地址写进这个文件（端到端测试用 127.0.0.1:0 监听）
  addr_file: ""
  # 反向代理的 CIDR 列表：来自它们的 X-Forwarded-For 才被采信，用于认出客户端 IP。
  # 空列表时客户端就是连接的对端。环境变量里用逗号分隔，例如 10.0.0.0/8,fd00::/8
  trusted_proxies: []

database:
  # 必须提供。dev 环境写在 config.dev.yaml 中；test 和 prod 通过 NWIKI_DATABASE__URL 提供。
  url: ""
  max_conns: 10
  # nervewiki serve 启动前是否自动执行迁移
  auto_migrate: true
  # COMMIT、ROLLBACK 自己的期限：它们不随请求期限取消
  commit_timeout: 2s

auth:
  # 是否开放注册。基础配置（也就是 prod）关闭：由服务器管理员用 nervewiki users create 建账户
  signup_enabled: false
  access_token_ttl: 15m
  # 会话的期限从登录起算，续期不延长
  session_ttl: 720h
  # 续期与退出的服务端期限。加上 database.commit_timeout 必须短于前端放弃续期的 8 秒：
  # 前端放弃之后服务端才提交的轮换，会让客户端手里的令牌成为旧的一代
  refresh_deadline: 4s
  # 后台任务删除过期会话的间隔，至少 1 秒
  session_cleanup_interval: 1h
  jwt:
    # 签名私钥：PKCS#8 PEM 的 Ed25519 私钥（openssl genpkey -algorithm ed25519）。
    # prod 必须提供；dev、test 为空时每次启动生成临时密钥，重启后已签发的令牌全部失效
    private_key_file: ""
  password:
    # argon2id 的参数（OWASP 的最低配置）。调整后，旧的哈希在下次登录时按新参数重算
    argon2_memory_kib: 19456
    argon2_iterations: 2
    argon2_parallelism: 1
    # 同时进行的哈希计算的上限；拿不到名额的请求最多等 max_wait（必须短于 server.request_timeout），然后 503 server_busy
    max_concurrent_hashes: 4
    max_wait: 2s

ratelimit:
  # IPv6 的客户端按这个长度的前缀计数：一台主机通常拿到整个 /64
  ipv6_prefix_len: 64
  # 每个桶最多存 burst 个单位，每分钟补充 per_minute 个；取不到时 429 rate_limited 与 Retry-After
  # 公开操作（注册、登录、续期、退出、实例信息、导出的签名下载），按客户端 IP
  anonymous: { per_minute: 600, burst: 100 }
  # 认证之前的失败闸门：带了令牌、认证却失败的请求，按客户端 IP
  auth_failure: { per_minute: 60, burst: 60 }
  # 需要令牌的操作，按凭证（会话或 PAT）
  authenticated: { per_minute: 1200, burst: 200 }
  # 登录：按客户端 IP，以及按客户端 IP 加邮箱，两个桶全取或全不取
  login_ip: { per_minute: 30, burst: 10 }
  login_ip_email: { per_minute: 10, burst: 5 }
  # 注册：按客户端 IP
  register_ip: { per_minute: 10, burst: 5 }
  # 校验当前密码的已认证操作（改密码、创建 PAT）：按账户
  password_user: { per_minute: 5, burst: 5 }
  # 附件的签名下载（公开，不消耗 anonymous），按客户端 IP：打开一页时它的图片一起来
  asset_content: { per_minute: 6000, burst: 1000 }

workspace:
  # 每个账户都能创建工作区。关闭之后，工作区由服务器管理员用 nervewiki workspaces create 创建
  creation_enabled: true

page:
  # 后台任务删除过期而未结束的编辑会话的间隔，至少 1 秒。会话是否活着按租约判断，不等这个任务
  edit_session_cleanup_interval: 10m
  # 同时解析、渲染的正文字节数的上限，至少 5242880（一页正文的上限）；每次至少记 4 KiB。最坏的正文解析时约占它 300 倍的内存，
  # 默认的 8 MiB 约 2.4 GB；普通的正文约 40 倍。链接索引每页至多记 10,000 条链接，保存时它另占的内存因此有界，不计入预算。取不到额度的请求最多等 parse_max_wait（必须短于
  # server.request_timeout，且应明显短于它：认证与权限判定也要时间），然后 503 server_busy
  parse_budget_bytes: 8388608
  parse_max_wait: 2s

events:
  # 事件流的心跳与重新认证凭证的间隔，5 到 50 秒。要短于反向代理的读超时（nginx 的 proxy_read_timeout 默认
  # 60 秒）；流的第一帧把它告诉客户端
  heartbeat_interval: 20s

jobs:
  # 停机时给正在执行的后台任务留的时间，到期后取消它们。停机的宽限期要长于
  # server.shutdown_timeout 加上它再加 8 秒（默认 38 秒）：docker stop -t 40
  shutdown_timeout: 10s
  # 物理删除软删除的行（工作区、成员、邀请等）的间隔，至少 1 秒
  purge_interval: 1h
  # 软删除的行保留这么久之后才被物理删除，至少 1 小时。期间运维可以从数据库恢复
  purge_retention: 1440h
  # 同时运行的导出数（各在自己的队列里，不占定时任务），1 到 8，且至多 database.max_conns 的一半：每个导出在快照里占一个数据库连接、写一个文件
  export_workers: 1
  # 同时运行的导入数（各在自己的队列里），1 到 8；与 export_workers 合起来至多 database.max_conns 的一半
  import_workers: 1

storage:
  # 附件、导入导出的文件所在的目录，不存在就建。不可写时 serve 拒绝启动，错误里写明进程的 uid。
  # 镜像里是 /data（Dockerfile 的 NWIKI_STORAGE__DIR），挂载为卷；dev 环境是 server/_data（config.dev.yaml）。
  # 只能由一个 nervewiki 进程使用（v0.1 只支持单实例）
  dir: data
  # 剩余空间低于它（字节）时不再接受写入
  min_free_bytes: 1073741824

asset:
  # 单个附件的上限（字节），1 KiB 到 4 GiB；超过答 413 payload_too_large
  max_bytes: 52428800
  # 上传与下载的最低平均速率（字节/秒）：流式路由的读写截止时间按它随字节放宽。max_bytes 按这个速率传完
  # 不能超过 1 小时，这也是一个附件上传占住连接的上界（默认约 13 分钟）；导入包按它传完不超过 3 小时
  # （transfer.import_max_bytes，默认约 2 小时 17 分钟）
  upload_min_rate: 65536

transfer:
  # 成功的导出保留多久，之后 zip 被删掉、任务记成已过期；至少 10 分钟。每人每本笔记本只留最新的一份
  export_ttl: 24h
  # 一个导入导出任务最长运行多久，1 分钟到 7 天；到时间任务被取消，记成失败（超时）
  job_timeout: 6h
  # 运行中的任务每秒写一次心跳；心跳早于它的任务被记成失败（中断），至少 1 分钟，短于 job_timeout
  heartbeat_timeout: 5m
  # 全部排队与运行中的任务的上限，至少 1，正在上传的导入也算在内；超出时开始任务答 503 server_busy
  max_queued: 20
  # 导入上传的 zip 的上限（字节），至少 1 MiB，不小于 asset.max_bytes；超过答 413 payload_too_large。
  # 按 asset.upload_min_rate 传完不能超过 3 小时。反向代理要放过这么大的请求体（nginx 的 client_max_body_size）
  import_max_bytes: 536870912
  # 导入的 zip 至多有多少个条目，1 到 100,000（中央目录至多读 64 MiB）；更多时整包失败
  import_max_entries: 50000
  # 导入的 zip 解压后的总字节数上限，不小于 import_max_bytes；超过时整包失败
  import_max_unpacked_bytes: 4294967296

log:
  level: info # debug | info | warn | error
  format: json # text | json
