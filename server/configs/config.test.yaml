# 测试环境（NWIKI_ENV=test）：集成测试和端到端测试使用。数据库地址通过 NWIKI_DATABASE__URL 提供。
auth:
  signup_enabled: true
  # 端到端的会话清理故事（A13）等得起
  session_cleanup_interval: 2s
  password:
    # 测试大量注册：把 argon2 降到最低
    argon2_memory_kib: 64
    argon2_iterations: 1

# 测试大量注册、登录：桶大到用不完。限流本身的测试自己设小桶
ratelimit:
  anonymous: { per_minute: 600000, burst: 100000 }
  auth_failure: { per_minute: 600000, burst: 100000 }
  authenticated: { per_minute: 600000, burst: 100000 }
  login_ip: { per_minute: 600000, burst: 100000 }
  login_ip_email: { per_minute: 600000, burst: 100000 }
  register_ip: { per_minute: 600000, burst: 100000 }
  password_user: { per_minute: 600000, burst: 100000 }

# 端到端的清理故事（W12）等得起
jobs:
  purge_interval: 2s

log:
  level: warn
  format: text
