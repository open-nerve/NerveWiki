version: "2"

linters:
  # standard = errcheck、govet、ineffassign、staticcheck、unused
  default: standard
  enable:
    - depguard
    # 禁止 init() 与包级变量（全局可变状态），对应总体设计 8.1。
    # 例外逐个用带理由的 //nolint:gochecknoglobals 标出；以 err 开头的错误变量、_ 断言不算
    - gochecknoinits
    - gochecknoglobals
    # 错误用 errors.Is / errors.As 判断，不直接比较或断言类型：被包装的错误也要认出来
    - errorlint
  settings:
    depguard:
      rules:
        # 整个项目都禁止使用的库。模块边界和分层方向由架构测试检查（P3 起）。
        banned:
          deny:
            - pkg: github.com/google/uuid
              desc: 用标准库 uuid
            - pkg: github.com/gofrs/uuid
              desc: 用标准库 uuid
            - pkg: github.com/satori/go.uuid
              desc: 用标准库 uuid
            - pkg: github.com/spf13/viper
              desc: 用 koanf（platform/config）
            - pkg: github.com/pkg/errors
              desc: 用标准库 errors
            # 末尾的 $ 表示精确匹配：只禁止 log，不影响 log/slog
            - pkg: log$
              desc: 用 log/slog

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/open-nerve/NerveWiki
