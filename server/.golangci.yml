version: "2"

linters:
  # standard = errcheck、govet、ineffassign、staticcheck、unused
  default: standard
  enable:
    - depguard
    # 禁止 init() 与包级变量（全局可变状态），对应总体设计 8.1。
    # 例外逐个用带理由的 //nolint:gochecknoglobals 标出。linter 自己放过：以 err 开头的错误变量、_ 断言、
    # 名为 version 的变量（buildinfo.version 供 -ldflags -X 注入）
    - gochecknoinits
    - gochecknoglobals
    # 错误用 errors.Is / errors.As 判断，不直接比较或断言类型：被包装的错误也要认出来
    - errorlint
  settings:
    depguard:
      rules:
        # 整个项目都禁止使用的库。模块边界和分层方向由架构测试检查（P3 起）。
        banned:
          deny:
            - pkg: github.com/google/uuid
              desc: 用标准库 uuid
            - pkg: github.com/gofrs/uuid
              desc: 用标准库 uuid
            - pkg: github.com/satori/go.uuid
              desc: 用标准库 uuid
            - pkg: github.com/spf13/viper
              desc: 用 koanf（platform/config）
            - pkg: github.com/pkg/errors
              desc: 用标准库 errors
            # 末尾的 $ 表示精确匹配：只禁止 log，不影响 log/slog
            - pkg: log$
              desc: 用 log/slog
        # MCP 的 SDK 与 jsonschema-go 只在 mcpserver 与组合根（M9 总设计 4.1）：生产代码由架构测试的
        # mcpSDKStaysInMCPServer 检查，它的导入图不含测试文件，这一条连测试文件也管
        mcp-sdk:
          files:
            - $all
            - "!**/internal/platform/httpserver/mcpserver/**"
            - "!**/internal/bootstrap/**"
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: MCP SDK 只在 mcpserver 与组合根的测试（M9 4.1）
            - pkg: github.com/google/jsonschema-go
              desc: MCP SDK 只在 mcpserver 与组合根的测试（M9 4.1）

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/open-nerve/NerveWiki
