# pnpm 工作区的根。前端的应用与包（P5）、端到端测试（P6）出现后，依赖的共享版本写进 catalog。
packages:
  - web/apps/*
  - web/packages/*
  - e2e

# 两个以上的包共用的依赖版本，包里写 "catalog:"
catalog:
  typescript: 7.0.2

# 供应链：
# - minimumReleaseAge：新发布的版本满 1 天才会被解析。显式写出时 minimumReleaseAgeStrict 随之默认为 true，
#   太新的版本直接报错，而不是被悄悄放过；需要例外时写进 minimumReleaseAgeExclude 并注明理由。
# - strictDepBuilds：依赖的安装脚本默认不运行，没有在 allowBuilds 中放行的一律报错。
# - trustPolicy: no-downgrade：新版本的发布可信度（例如是否有来源证明）低于旧版本时拒绝安装，这是发布账号被盗的典型信号。
minimumReleaseAge: 1440
strictDepBuilds: true
trustPolicy: no-downgrade

# 依赖的安装脚本一律不运行，这里逐个列出并注明理由。以下三项是端到端测试的 testcontainers 经 dockerode 间接依赖的包：
# 它们的安装脚本编译通过 SSH 连接 Docker 时用的可选扩展（cpu-features、ssh2），或只检查版本号（protobufjs），都用不到
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
# 依赖的补丁（pnpm patch），各注明理由；升级依赖时重新核对是否还需要：
# - katex：alignedat 的列数照参数造，与行无关，{30000000} 四十几个字节就耗尽页面的内存；超过 100 时报解析错误，
#   公式显示原文（M6/P6 B 修复核对 f2-1）
# - @lezer/markdown：段落里有 | 的一行是否是表头，要看下一行整行是否是分隔行；这个正则把行首的 > 与空白每种分法都试一遍，
#   8 万个空格进入编辑与每按一个键都要 4 秒多，编辑器的两个上限兜不住。改为行首的一次取完（先行断言不回溯），
#   匹配的行不变（M6 收尾修复核对 FB4-I1）
patchedDependencies:
  "@lezer/markdown@1.7.2": patches/@lezer__markdown@1.7.2.patch
  katex@0.16.47: patches/katex@0.16.47.patch
