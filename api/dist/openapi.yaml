          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
        role:
          $ref: '#/components/schemas/NotebookRole'
        member_count:
          description: How many active members the notebook has. A private notebook with one member is the caller's own ("My notebooks").
