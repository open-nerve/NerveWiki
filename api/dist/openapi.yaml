openapi: 3.1.0
info:
  title: Nerve Wiki API
  version: v0
  description: The HTTP API of Nerve Wiki. The web app is one client of it; every account can use every endpoint the same way. Every operation lists the problem codes it can answer in x-problem-codes; the top-level x-problem-codes can come from every operation, and an operation that needs a bearer token can also answer unauthorized.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
tags:
  - name: identity
    description: Accounts, sign-in, sessions and personal access tokens.
  - name: instance
    description: What this instance runs.
paths:
  /api/v0/auth/register:
    post:
      operationId: register
      tags:
        - identity
      summary: Create an account and sign in
      description: 'Creates an account and signs it in: the response holds a new session''s tokens. While sign-up is off, a well-formed request answers identity.signup_disabled before the address or the password is looked at, so the answer never depends on whether the address is registered. The password needs 8–128 characters and must be neither a common password nor made of the address''s local part. Sign-ups have a rate limit of their own, per client IP.'
      security: []
      x-problem-codes:
        - identity.signup_disabled
        - validation_failed
        - identity.email_taken
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account exists and is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/login:
    post:
      operationId: login
      tags:
        - identity
      summary: Sign in with an e-mail address and a password
      description: 'Starts a new session and returns its tokens. An unknown address and a wrong password get the same identity.invalid_credentials; a deactivated account answers identity.account_deactivated only to the right password. Sign-ins have rate limits of their own: per client IP, and per client IP and address together.'
      security: []
      x-problem-codes:
        - identity.invalid_credentials
        - identity.account_deactivated
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The new session's tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - identity
      summary: Exchange a refresh token for the next pair
      description: 'Returns new tokens of the same session and retires the refresh token sent: the next refresh uses the refresh_token of this response. The session''s end, refresh_token_expires_at, never moves. Any refresh token but the current one of a session that has not ended answers identity.refresh_token_invalid; one this session issued before under the current signing key also ends the session, since someone else holds a copy of it. The server answers within a few seconds, before a client that waits 8 seconds gives up.'
      security: []
      x-problem-codes:
        - identity.refresh_token_invalid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session's next tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/logout:
    post:
      operationId: logout
      tags:
        - identity
      summary: End the session of a refresh token
      description: Ends the session when refresh_token is its current one; its access tokens stop working at once. Any other token changes nothing and gets the same answer, which tells nothing about the token.
      security: []
      x-problem-codes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Done, whatever the token was.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Read the caller's account
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/api-tokens:
    get:
      operationId: listApiTokens
      tags:
        - identity
      summary: List the caller's personal access tokens
      description: 'The caller''s personal access tokens that are not revoked, expired ones too, newest first. The tokens themselves are never listed: only createApiToken answers one, once.'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiToken
      tags:
        - identity
      summary: Create a personal access token
      description: 'Creates a personal access token of the caller and answers the token itself, this once. Sent as "Authorization: Bearer", it acts as the account in every operation until it expires or is revoked; it can create tokens itself. The caller''s current password is asked for, whatever the credential: a refresh token that leaks cannot become a token that never expires. Attempts have a rate limit of their own, per account.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - identity.current_password_incorrect
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: The new token, with the token itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/api-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeApiToken
      tags:
        - identity
      summary: Revoke a personal access token
      description: Revokes one of the caller's tokens, which stops working at once; a token may revoke itself. A token that does not exist, is revoked already or belongs to another account is identity.api_token_not_found.
      security:
        - bearer: []
      x-problem-codes:
        - identity.api_token_not_found
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/instance:
    get:
      operationId: getInstance
      tags:
        - instance
      summary: Describe this instance
      description: 'Reports the product, the build and the API version this instance runs, and whether it is open for sign-up. Public: needs no authentication.'
      security: []
      x-problem-codes: []
      responses:
        '200':
          description: What this instance runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInfo'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token (JWT) from register, login or refresh, or a personal access token (nwk_pat_) from createApiToken.
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: The sign-in address; stored trimmed and in lower case.
          type: string
          format: email
        password:
          type: string
    FieldError:
      description: One invalid field of a request. Clients show text looked up by `code`; `message` is an English explanation for developers. Must match httpserver.FieldError and the field codes of internal/shared.
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          description: The field's path in the request, e.g. title or properties.status. A path longer than 256 bytes is cut short and ends with `…`.
          type: string
        code:
          description: What is wrong with the field.
          type: string
          enum:
            - required
            - invalid_format
            - too_short
            - too_long
            - out_of_range
            - not_allowed
            - duplicate
            - common_password
        message:
          type: string
    Problem:
      description: RFC 9457 problem details. `title` is the HTTP status phrase, `detail` explains this occurrence, and clients branch on `code`. Must match httpserver.Problem; the platform's contract test checks it.
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - title
      properties:
        status:
          description: HTTP status code.
          type: integer
        code:
          description: Stable error code. Platform codes have no prefix (bad_request, unauthorized, forbidden, not_found, payload_too_large, validation_failed, rate_limited, server_busy, internal_error, not_ready); module codes are prefixed with the module that refuses, e.g. page.locked. Each operation lists the codes it can answer in x-problem-codes.
          type: string
        title:
          description: HTTP status phrase, e.g. "Not Found".
          type: string
        detail:
          description: What went wrong in this occurrence.
          type: string
        errors:
          description: The invalid fields of the request.
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    AuthTokens:
      description: 'A session''s tokens. Send access_token as "Authorization: Bearer"; access_token_expires_in counts from the response, so a client''s clock does not matter. When it expires, exchange refresh_token for the next pair at POST /api/v0/auth/refresh.'
      type: object
      additionalProperties: false
      required:
        - token_type
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_at
      properties:
        token_type:
          type: string
          enum:
            - Bearer
        access_token:
          type: string
        access_token_expires_in:
          description: Seconds from this response until the access token expires.
          type: integer
        refresh_token:
          description: An opaque nwk_rt_ token.
          type: string
        refresh_token_expires_at:
          description: When the session ends; refreshing never extends it.
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: 'The sign-in address, in any case, with or without surrounding blanks. It is not checked for form: an address no account has answers identity.invalid_credentials.'
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the session's last AuthTokens.
          type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the session's last AuthTokens.
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - display_name
        - onboarding_steps
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        onboarding_steps:
          description: The ids of the onboarding steps the account has completed; the web app defines the steps.
          type: array
          items:
            type: string
    ApiToken:
      description: A personal access token as the list shows it. The token itself appears only in ApiTokenCreated.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - expires_at
        - last_used_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        expires_at:
          description: When the token stops working; null when it never does.
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          description: When the token last authenticated a request, to the minute; null when it never has.
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    ApiTokenList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
    ApiTokenCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - current_password
      properties:
        name:
          description: 1–100 characters after the surrounding blanks are trimmed, without control characters.
          type: string
        expires_at:
          description: A time in the future; absent for a token that never expires.
          type: string
          format: date-time
        current_password:
          type: string
    ApiTokenCreated:
      description: 'A new personal access token: the fields of ApiToken, and the token itself, which is shown this once and cannot be read again.'
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - expires_at
        - last_used_at
        - created_at
        - token
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        expires_at:
          description: When the token stops working; null when it never does.
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          description: Null; the token has not been used yet.
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        token:
          description: The token, nwk_pat_ and 43 more characters.
          type: string
    InstanceInfo:
      type: object
      additionalProperties: false
      required:
        - product
        - version
        - commit
        - api_version
        - signup_enabled
      properties:
        product:
          description: Product name.
          type: string
          examples:
            - Nerve Wiki
        version:
          description: Product version of the running build.
          type: string
          examples:
            - 0.1.0-dev
        commit:
          description: Git revision of the running build; "unknown" when the build carries no VCS stamp.
          type: string
        api_version:
          description: Version of this HTTP API; every path starts with /api/{api_version}.
          type: string
          enum:
            - v0
        signup_enabled:
          description: Whether anyone may register (auth.signup_enabled); when off, the server's administrator creates the accounts.
          type: boolean
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: Whole seconds to wait before trying again, rounded up; sent with rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: 'Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token" (RFC 6750 3) when the bearer token sent is refused before the operation runs, being invalid or expired; plain Bearer for every other 401, including a credential that the operation finds revoked while it runs.'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
x-problem-codes:
  - bad_request
  - payload_too_large
  - rate_limited
  - internal_error
