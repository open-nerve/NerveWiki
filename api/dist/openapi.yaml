        data:
          type: array
          items:
            $ref: '#/components/schemas/Notebook'
    NotebookName:
      description: '1–255 bytes after the surrounding blanks are trimmed and the text is in NFC; none of / \ : * ? " < > | # ^ [ ] nor control characters; not starting or ending with a dot; no name Windows reserves (CON, COM1, …). It is the folder''s name when the notebook is exported.'
      type: string
    NotebookCreate:
      description: A new notebook; its workspace access is none when absent.
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/NotebookName'
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
    NotebookUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/NotebookName'
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
    NotebookMember:
      description: A membership of a notebook, with what the caller may see of the account.
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - role
        - display_name
        - email
        - created_at
      properties:
        id:
          description: The membership's id, which the member operations take.
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/NotebookRole'
        display_name:
          type: string
        email:
          description: The account's email; null when the caller is a guest of the workspace.
          type:
            - string
