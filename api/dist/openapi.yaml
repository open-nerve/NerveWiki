openapi: 3.1.0
info:
  title: Nerve Wiki API
  version: v0
  description: The HTTP API of Nerve Wiki. The web app is one client of it; every account can use every endpoint the same way. Every operation lists the problem codes it can answer in x-problem-codes; the top-level x-problem-codes can come from every operation, and an operation that needs a bearer token can also answer unauthorized.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
tags:
  - name: identity
    description: Accounts, sign-in, sessions and personal access tokens.
  - name: instance
    description: What this instance runs.
  - name: workspace
    description: Workspaces, their members and invitations.
  - name: notebook
    description: Notebooks and their members.
  - name: page
    description: The pages of a notebook's tree.
  - name: linking
    description: The link index's reads, backlinks, properties, tags and link targets.
  - name: events
    description: The stream of the events of what the caller sees.
  - name: asset
    description: The attachments of a notebook's pages and their files.
  - name: transfer
    description: The imports and exports of notebooks, jobs that run in the background.
paths:
  /api/v0/auth/register:
    post:
      operationId: register
      tags:
        - identity
      summary: Create an account and sign in
      description: 'Creates an account and signs it in: the response holds a new session''s tokens. While sign-up is off, only an invitation to the address opens it: any other well-formed request answers identity.signup_disabled before the address is checked or the password looked at, so the answer never depends on whether the address is registered. Registering does not accept the invitation. The password needs 8–128 characters and must be neither a common password nor made of the address''s local part. Sign-ups have a rate limit of their own, per client IP.'
      security: []
      x-problem-codes:
        - identity.signup_disabled
        - validation_failed
        - identity.email_taken
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account exists and is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/login:
    post:
      operationId: login
      tags:
        - identity
      summary: Sign in with an e-mail address and a password
      description: 'Starts a new session and returns its tokens. An unknown address and a wrong password get the same identity.invalid_credentials; a deactivated account answers identity.account_deactivated only to the right password. Sign-ins have rate limits of their own: per client IP, and per client IP and address together.'
      security: []
      x-problem-codes:
        - identity.invalid_credentials
        - identity.account_deactivated
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The new session's tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - identity
      summary: Exchange a refresh token for the next pair
      description: 'Returns new tokens of the same session and retires the refresh token sent: the next refresh uses the refresh_token of this response. The session''s end, refresh_token_expires_at, never moves. Any refresh token but the current one of a session that has not ended answers identity.refresh_token_invalid; one this session issued before under the current signing key also ends the session, since someone else holds a copy of it. The server answers within a few seconds, before a client that waits 8 seconds gives up.'
      security: []
      x-problem-codes:
        - identity.refresh_token_invalid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session's next tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/logout:
    post:
      operationId: logout
      tags:
        - identity
      summary: End the session of a refresh token
      description: Ends the session when refresh_token is its current one; its access tokens stop working at once. Any other token changes nothing and gets the same answer, which tells nothing about the token.
      security: []
      x-problem-codes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Done, whatever the token was.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Read the caller's account
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Change the caller's profile
      description: 'Changes the fields sent and answers the account. A body without any field changes nothing. The address cannot change here: the server''s administrator changes it.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: The caller's account, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/onboarding-steps:
    post:
      operationId: recordOnboardingStep
      tags:
        - identity
      summary: Record a completed onboarding step
      description: 'Adds the step to the account''s onboarding_steps and answers the account; a step recorded already changes nothing. The web app defines the steps: the server checks the id''s form, and records 32 steps at most.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStepRequest'
      responses:
        '200':
          description: The caller's account, with the step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/change-password:
    post:
      operationId: changePassword
      tags:
        - identity
      summary: Change the caller's password
      description: Replaces the password once the current one is confirmed. Every other session of the account ends; the caller's own session goes on, and a caller with a personal access token ends them all. Personal access tokens keep working. Attempts have a rate limit of their own, per account.
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - identity.current_password_incorrect
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password is changed.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/deactivate:
    post:
      operationId: deactivateMe
      tags:
        - identity
      summary: Deactivate the caller's account
      description: 'Deactivates the account: every session ends, and the personal access tokens stop working while it is inactive. Only the server''s administrator can activate it again; sign-in then answers identity.account_deactivated. No password is asked for. The modules that keep the account''s access elsewhere may refuse the deactivation with a code of their own, listed here: workspace.sole_admin when the account is the only admin of a workspace with other members, which the detail names; notebook.sole_admin when it is the only admin of a notebook with other members, which the detail counts by workspace. The deactivation ends the account''s memberships of workspaces and of their notebooks, and a notebook it was the only admin of becomes ownerless.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.sole_admin
        - notebook.sole_admin
      responses:
        '204':
          description: The account is deactivated.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/api-tokens:
    get:
      operationId: listApiTokens
      tags:
        - identity
      summary: List the caller's personal access tokens
      description: 'The caller''s personal access tokens that are not revoked, expired ones too, newest first. The tokens themselves are never listed: only createApiToken answers one, once.'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiToken
      tags:
        - identity
      summary: Create a personal access token
      description: 'Creates a personal access token of the caller and answers the token itself, this once. Sent as "Authorization: Bearer", it acts as the account in every operation until it expires or is revoked; it can create tokens itself. The caller''s current password is asked for, whatever the credential: a refresh token that leaks cannot become a token that never expires. Attempts have a rate limit of their own, per account.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - identity.current_password_incorrect
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: The new token, with the token itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/api-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeApiToken
      tags:
        - identity
      summary: Revoke a personal access token
      description: Revokes one of the caller's tokens, which stops working at once; a token may revoke itself. A token that does not exist, is revoked already or belongs to another account is identity.api_token_not_found.
      security:
        - bearer: []
      x-problem-codes:
        - identity.api_token_not_found
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/instance:
    get:
      operationId: getInstance
      tags:
        - instance
      summary: Describe this instance
      description: 'Reports the product, the build and the API version this instance runs, whether it is open for sign-up, whether accounts may create workspaces, the largest attachment and import archive it takes, and how long it keeps an export. Public: needs no authentication.'
      security: []
      x-problem-codes: []
      responses:
        '200':
          description: What this instance runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInfo'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces:
    get:
      operationId: listWorkspaces
      tags:
        - workspace
      summary: List the caller's workspaces
      description: The workspaces the caller is an active member of, with the caller's role in each, by name, case-insensitively. The list is not paged.
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspace
      tags:
        - workspace
      summary: Create a workspace
      description: Creates a workspace whose admin is the caller. While creating workspaces is off on the instance (GET /instance answers workspace_creation_enabled), it answers workspace.creation_disabled before the values are looked at; the server's administrator creates workspaces with nervewiki workspaces create. A slug another workspace has is workspace.slug_taken; a reserved one is a problem of the slug field (not_allowed).
      security:
        - bearer: []
      x-problem-codes:
        - workspace.creation_disabled
        - validation_failed
        - workspace.slug_taken
        - identity.account_deactivated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The workspace, with the caller as its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspace
      tags:
        - workspace
      summary: Get a workspace
      description: The workspace, with the caller's role. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found alike.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspace
      tags:
        - workspace
      summary: Rename a workspace
      description: Gives the workspace a new name; only its admins can. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; a member or a guest gets forbidden; the name is checked after both.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: The renamed workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWorkspace
      tags:
        - workspace
      summary: Delete a workspace
      description: Deletes the workspace with every membership of it and its pending invitations; only its admins can. No one sees it afterwards, and its slug can name a new workspace at once. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; a member or a guest gets forbidden.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '204':
          description: The workspace is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceMembers
      tags:
        - workspace
      summary: List a workspace's members
      description: The workspace's active members, by when they joined, each with the account's display name and, unless the caller is a guest, its email. The list is not paged.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/leave:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      operationId: leaveWorkspace
      tags:
        - workspace
      summary: Leave a workspace
      description: 'Ends the caller''s membership of the workspace; pending invitations of the workspace to the caller''s address are deleted with it. The workspace''s only active admin cannot leave it, even alone in it (workspace.sole_admin): another member is made an admin first, or the workspace is deleted. Nor can the only active admin of one of its notebooks with other members (notebook.sole_admin, whose detail counts them); the caller''s notebook memberships end with it, and a notebook it was the only admin of becomes ownerless.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - workspace.sole_admin
        - notebook.sole_admin
      responses:
        '204':
          description: The caller is no longer a member.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/invitations:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceInvitations
      tags:
        - workspace
      summary: List a workspace's pending invitations
      description: The workspace's pending invitations, newest first, each with the token of its link; only its admins can. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; a member or a guest gets forbidden. The list is not paged.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '200':
          description: The pending invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspaceInvitation
      tags:
        - workspace
      summary: Invite an e-mail address
      description: 'Invites an e-mail address to the workspace with a role; only its admins can. The answer holds the token of the invitation''s link, which the admin sends: whoever signs in with the address and holds the link can accept it. An address with a pending invitation to the workspace is a problem of the email field (duplicate), and so is an active member''s (not_allowed). A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; a member or a guest gets forbidden; the values are checked after both.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationCreate'
      responses:
        '201':
          description: The pending invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-members/{workspace_member_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceMemberID'
    patch:
      operationId: updateWorkspaceMember
      tags:
        - workspace
      summary: Change a member's role
      description: Gives the member a new role; only the workspace's admins can, and not their own (workspace.own_membership). A membership that does not exist, has ended, or whose workspace the caller cannot see is workspace.member_not_found; a member or a guest gets forbidden; the role is checked after both.
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.member_not_found
        - forbidden
        - workspace.own_membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberUpdate'
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeWorkspaceMember
      tags:
        - workspace
      summary: Remove a member
      description: 'Ends the member''s membership, and deletes the workspace''s pending invitations to the member''s address; only the workspace''s admins can, and not their own (workspace.own_membership: an admin leaves instead). A membership that does not exist, has ended, or whose workspace the caller cannot see is workspace.member_not_found; a member or a guest gets forbidden. The member''s notebook memberships end with it, and a notebook the member was the only admin of becomes ownerless.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.member_not_found
        - forbidden
        - workspace.own_membership
      responses:
        '204':
          description: The membership has ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{workspace_invitation_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceInvitationID'
    delete:
      operationId: deleteWorkspaceInvitation
      tags:
        - workspace
      summary: Withdraw an invitation
      description: Withdraws a pending invitation, whose link stops working; only the workspace's admins can. An invitation that does not exist, is no longer pending, or whose workspace the caller cannot see is workspace.invitation_not_found; a member or a guest gets forbidden.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.invitation_not_found
        - forbidden
      responses:
        '204':
          description: The invitation is withdrawn.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{workspace_invitation_id}/preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceInvitationID'
    post:
      operationId: previewWorkspaceInvitation
      tags:
        - workspace
      summary: Show what an invitation's link invites to
      description: The workspace's name and slug, and the role; never the address invited. Anyone holding the link may ask, signed in or not. An invitation that does not exist, is no longer pending, whose workspace is deleted, or whose token is not the link's is workspace.invitation_not_found alike. It is a POST so that the token stays out of URLs and their logs.
      security: []
      x-problem-codes:
        - workspace.invitation_not_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: What the invitation invites to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{workspace_invitation_id}/accept:
    parameters:
      - $ref: '#/components/parameters/WorkspaceInvitationID'
    post:
      operationId: acceptWorkspaceInvitation
      tags:
        - workspace
      summary: Accept an invitation
      description: 'Joins the workspace with the invitation''s role: the link''s token and the caller''s address are the credentials, the caller being no member yet. A caller signed in with another address than the one invited gets workspace.invitation_email_mismatch. A caller who is an active member already keeps their role, and the invitation is used up; one whose membership ended has it back, with the invitation''s role and when they first joined. A workspace without an active admin, its only one deactivated alone in it, admits only an admin until it has one again: a member''s or a guest''s invitation is workspace.no_admin, and stays pending. An invitation that does not exist, is no longer pending, whose workspace is deleted, or whose token is not the link''s is workspace.invitation_not_found alike.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.invitation_not_found
        - workspace.invitation_email_mismatch
        - workspace.no_admin
        - identity.account_deactivated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: The workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-slugs/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: checkWorkspaceSlug
      tags:
        - workspace
      summary: Tell whether a slug can name a new workspace
      description: 'Whether a new workspace can take the slug, and if not why: invalid (not 1–48 of a–z, 0–9, _ and -), reserved (a path of the site, or held for one), or taken (a workspace not deleted has it).'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: Whether the slug is free.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/notebooks:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listNotebooks
      tags:
        - notebook
      summary: List the notebooks the caller sees in a workspace
      description: 'The workspace''s notebooks the caller has a role in: those it is a member of, and, for the workspace''s admins and members, those open to the workspace; each with the caller''s role in it, by name, case-insensitively. A private notebook the caller is no member of is not listed, to the workspace''s admins neither. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found. The list is not paged.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The notebooks the caller sees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createNotebook
      tags:
        - notebook
      summary: Create a notebook
      description: Creates a notebook in the workspace whose admin is the caller; the workspace's admins and members can, its guests cannot (forbidden). A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; the values are checked after both.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookCreate'
      responses:
        '201':
          description: The notebook, with the caller as its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        default:
