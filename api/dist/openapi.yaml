  /api/v0/notebooks/{notebook_id}/imports:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    post:
      operationId: startImport
      tags:
        - transfer
      summary: Import a vault into a notebook
      description: 'Uploads a zip archive of an Obsidian vault, or of any folder of Markdown files, and starts a job that imports it into the notebook, at its root or under a page, after the children there: a file X.md is the page X, a folder X/ holds its children (X a page without content when there is no X.md beside it), any other file is an attachment of the page whose folder holds it. Hidden files and folders (.obsidian, .trash, .DS_Store...), __MACOSX and Thumbs.db are left out; a single folder at the archive''s top that holds .obsidian or .nerve is the vault itself. The siblings come in the order the vault''s .nerve/meta.json gives, then by name. A name that is no title is mended, a name a sibling has is numbered, each reported renamed. The archive is read whole before anything is written: an archive that is no zip, of more entries than the instance takes, or that unpacks to more than it takes fails the job, nothing written; an entry that cannot be imported is skipped and reported. The nodes are written in batches, each at once: a cancel stops the job between two, what was written kept. The notebook''s editors and admins can import, a reader cannot (forbidden). The body is multipart/form-data whose parts are parent_id and file, in that order, the first optional: an unknown part, one twice, one out of order, a part after the file, a parent_id that is no id, more than 4 KiB read before the file''s bytes, no file, and a body that goes on after the form past the limit are bad_request. Each part is read as sent: a Content-Transfer-Encoding is not decoded. Before the file is read, a notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; a parent_id that is no page of the notebook, or a deleted one, is page.not_found; an import of the notebook queued, running or uploading, anyone''s, is transfer.busy; as many jobs queued or running, with the imports uploading, as the instance takes is server_busy; a server whose storage would keep too little room once the body''s declared length, and the other uploads'', is stored is storage_full; a body whose declared length is past the limit is payload_too_large: a client answered before it sent its file may see the connection reset, and checks these first. A file larger than the instance''s import_max_bytes is payload_too_large; one that does not arrive at the instance''s lowest rate is cut off, as is one still arriving when the server shuts down. A file the storage runs out of room for is storage_full. The checks but the storage''s are made again as the job is created. The job is named after the file, its root_id is the parent; it runs in the background: read it with getTransferJob until it ends.'
      security:
        - bearer: []
      x-raw: true
      x-problem-codes:
        - notebook.not_found
        - forbidden
        - page.not_found
        - transfer.busy
        - server_busy
        - storage_full
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                parent_id:
                  description: The page to import under; none imports at the notebook's root.
                  type: string
                  format: uuid
                file:
                  description: The zip archive, the last part.
                  type: string
                  format: binary
      responses:
        '202':
          description: The import's job, queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJob'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebooks/{notebook_id}/transfer-jobs:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    get:
      operationId: listTransferJobs
      tags:
        - transfer
      summary: List a notebook's jobs
      description: 'The notebook''s imports and exports, the newest first, a page at a time: the caller''s own, or every one for the notebook''s admins. Any role in the notebook can list them. A cursor the list cannot read is bad_request, before anything else; a notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; a limit outside 1–100 is validation_failed.'
      security:
        - bearer: []
      x-problem-codes:
        - bad_request
        - notebook.not_found
        - validation_failed
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJobPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/transfer-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: getTransferJob
      tags:
        - transfer
      summary: Read a job
      description: The job, its progress, its report's problems once it ended, and an export's archive's address once it succeeded. Its starter and the notebook's admins can read it. A job that does not exist, is deleted with its notebook, is of a notebook the caller has no role in, or is another's to one who is not the notebook's admin is transfer.not_found.
      security:
        - bearer: []
      x-problem-codes:
        - transfer.not_found
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJobDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/transfer-jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobID'
    post:
      operationId: cancelTransferJob
      tags:
        - transfer
      summary: Cancel a job
      description: 'Cancels the job: a queued one at once, a running one at its next heartbeat, within about a second, its state then cancelled, its report telling what it did, an export''s archive not kept; a running job that ends first ends as it would have. Its starter and the notebook''s admins can cancel it; one not found is transfer.not_found as getTransferJob''s; a job that has ended is transfer.not_cancellable. A running job''s cancel asked again is the first''s.'
      security:
        - bearer: []
      x-problem-codes:
        - transfer.not_found
        - transfer.not_cancellable
      responses:
        '200':
          description: The job, as the cancel left it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJob'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/transfer-jobs/{job_id}/download:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: downloadExport
      tags:
        - transfer
      summary: Download an export's archive
      description: 'The export''s zip archive, at the address getTransferJob and listTransferJobs sign: anyone who has the address can download it, without a token, until it expires. A path whose id is no uuid is bad_request; otherwise the address is read as the server writes it: the path''s id, then the query e and s, in this order, each once, nothing escaped; anything else, a signature that does not match, an address expired, and a job deleted or expired since are not_found, alike. Ranges are answered (206, 416; If-Range by date), and a copy as new as the archive is not sent again (304: If-Modified-Since when no If-None-Match is sent, or If-None-Match as *, there being no ETag); If-Match and If-Unmodified-Since are ignored, as an address''s archive never changes. The downloads count against the instance''s limit of requests without a token, by client address. A download still sending when the server shuts down is cut off; one asked for then is server_busy.'
      security: []
      x-raw: true
      x-problem-codes:
        - not_found
        - server_busy
      parameters:
        - name: e
          in: query
          required: true
          description: When the address expires, in Unix seconds, as the signed address has it.
          schema:
            type: string
        - name: s
          in: query
          required: true
          description: The address's signature.
          schema:
            type: string
      responses:
        '200':
          description: The archive.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ArchiveDisposition'
            Content-Security-Policy:
              $ref: '#/components/headers/ArchivePolicy'
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '206':
          description: The range of the archive asked for.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ArchiveDisposition'
            Content-Security-Policy:
              $ref: '#/components/headers/ArchivePolicy'
            Content-Range:
              description: The range sent, and the archive's size; for several ranges, sent as multipart/byteranges, each part has its own instead.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: The archive has not changed since the copy the request names (If-Modified-Since), or If-None-Match is *.
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/ArchivePolicy'
        '416':
          description: No range asked for is in the archive; Content-Range tells its size.
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/ArchivePolicy'
            Content-Range:
              description: The archive's size, as bytes */<size>.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token (JWT) from register, login or refresh, or a personal access token (nwk_pat_) from createApiToken.
  schemas:
    SignupInvitation:
      description: The invitation to a workspace whose link the registration came by, as the link carries it. While sign-up is off, an invitation still pending, of a workspace not deleted and sent to the address lets the address register.
      type: object
      additionalProperties: false
      required:
        - id
        - token
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: The sign-in address; stored trimmed and in lower case.
          type: string
          format: email
        password:
          type: string
        invitation:
          $ref: '#/components/schemas/SignupInvitation'
    FieldError:
      description: One invalid field of a request. Clients show text looked up by `code`; `message` is an English explanation for developers. Must match httpserver.FieldError and the field codes of internal/shared.
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          description: The field's path in the request, e.g. title or properties.status. A path longer than 256 bytes is cut short and ends with `…`.
          type: string
        code:
          description: What is wrong with the field.
          type: string
          enum:
            - required
            - invalid_format
            - too_short
            - too_long
            - out_of_range
            - not_allowed
            - duplicate
            - common_password
        message:
          type: string
    Problem:
      description: RFC 9457 problem details. `title` is the HTTP status phrase, `detail` explains this occurrence, and clients branch on `code`. Must match httpserver.Problem; the platform's contract test checks it.
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - title
      properties:
        status:
          description: HTTP status code.
          type: integer
        code:
          description: Stable error code. Platform codes have no prefix (bad_request, unauthorized, forbidden, not_found, payload_too_large, validation_failed, rate_limited, server_busy, internal_error, not_ready, storage_full); module codes are prefixed with the module that refuses, e.g. page.locked. Each operation lists the codes it can answer in x-problem-codes.
          type: string
        title:
          description: HTTP status phrase, e.g. "Not Found".
          type: string
        detail:
          description: What went wrong in this occurrence.
          type: string
        errors:
          description: The invalid fields of the request.
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        lock:
          description: 'The edit lock page.locked names: the page locked and who holds it (the caller themself when they hold it elsewhere). No other code carries it.'
          type: object
          additionalProperties: false
          required:
            - page_id
            - user_id
            - display_name
          properties:
            page_id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            display_name:
              type: string
        locks:
          description: 'The edit locks linking.pages_locked names, one a page: each page whose links a rename or move would write again and who edits it (the caller themself when they edit it). No other code carries it.'
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - page_id
              - user_id
              - display_name
            properties:
              page_id:
                type: string
                format: uuid
              user_id:
                type: string
                format: uuid
              display_name:
                type: string
        ended_by:
          description: 'Who ended the caller''s edit session: page.edit_session_unlocked names the notebook''s admin who unlocked it. No other code carries it.'
          type: object
          additionalProperties: false
          required:
            - user_id
            - display_name
          properties:
            user_id:
              type: string
              format: uuid
            display_name:
              type: string
    AuthTokens:
      description: 'A session''s tokens. Send access_token as "Authorization: Bearer"; access_token_expires_in counts from the response, so a client''s clock does not matter. When it expires, exchange refresh_token for the next pair at POST /api/v0/auth/refresh.'
      type: object
      additionalProperties: false
      required:
        - token_type
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_at
      properties:
        token_type:
          type: string
          enum:
            - Bearer
        access_token:
          type: string
        access_token_expires_in:
          description: Seconds from this response until the access token expires.
          type: integer
        refresh_token:
          description: An opaque nwk_rt_ token.
          type: string
        refresh_token_expires_at:
          description: When the session ends; refreshing never extends it.
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: 'The sign-in address, in any case, with or without surrounding blanks. It is not checked for form: an address no account has answers identity.invalid_credentials.'
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the session's last AuthTokens.
          type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the session's last AuthTokens.
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - display_name
        - onboarding_steps
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        onboarding_steps:
          description: The ids of the onboarding steps the account has completed; the web app defines the steps.
          type: array
          items:
            type: string
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          description: 1–100 characters after the surrounding blanks are trimmed, without control characters.
          type: string
    OnboardingStepRequest:
      type: object
      additionalProperties: false
      required:
        - step
      properties:
        step:
          description: 'The step''s id: a lower-case letter, then lower-case letters, digits and underscores, 32 characters at most.'
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          description: 8–128 characters, neither a common password nor made of the address's local part.
          type: string
    ApiToken:
      description: A personal access token as the list shows it. The token itself appears only in ApiTokenCreated.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - expires_at
        - last_used_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        expires_at:
          description: When the token stops working; null when it never does.
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          description: When the token last authenticated a request, to the minute; null when it never has.
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    ApiTokenList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
    ApiTokenCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - current_password
      properties:
        name:
          description: 1–100 characters after the surrounding blanks are trimmed, without control characters.
          type: string
        expires_at:
          description: A time in the future; absent for a token that never expires.
          type: string
          format: date-time
        current_password:
          type: string
    ApiTokenCreated:
      description: 'A new personal access token: the fields of ApiToken, and the token itself, which is shown this once and cannot be read again.'
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - expires_at
        - last_used_at
        - created_at
        - token
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        expires_at:
          description: When the token stops working; null when it never does.
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          description: Null; the token has not been used yet.
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        token:
          description: The token, nwk_pat_ and 43 more characters.
          type: string
    InstanceInfo:
      type: object
      additionalProperties: false
      required:
        - product
        - version
        - commit
        - api_version
        - signup_enabled
        - workspace_creation_enabled
        - asset_max_bytes
        - import_max_bytes
        - export_ttl_seconds
      properties:
        product:
          description: Product name.
          type: string
          examples:
            - Nerve Wiki
        version:
          description: Product version of the running build.
          type: string
          examples:
            - 0.1.0-dev
        commit:
          description: Git revision of the running build; "unknown" when the build carries no VCS stamp.
          type: string
        api_version:
          description: Version of this HTTP API; every path starts with /api/{api_version}.
          type: string
          enum:
            - v0
        signup_enabled:
          description: Whether anyone may register (auth.signup_enabled); when off, the server's administrator creates the accounts.
          type: boolean
        workspace_creation_enabled:
          description: Whether accounts may create workspaces (workspace.creation_enabled); when off, the server's administrator creates them.
          type: boolean
        asset_max_bytes:
          description: The largest attachment an upload may send, in bytes (asset.max_bytes); a larger one is payload_too_large.
          type: integer
          format: int64
          minimum: 1024
        import_max_bytes:
          description: The largest archive an import may send, in bytes (transfer.import_max_bytes); a larger one is payload_too_large.
          type: integer
          format: int64
          minimum: 1048576
        export_ttl_seconds:
          description: How long an export's archive is kept once the export succeeded, in seconds (transfer.export_ttl); then it expires.
          type: integer
          format: int64
          minimum: 600
    WorkspaceRole:
      description: 'A member''s role: admin manages the workspace and its members, member and guest take part. Rules compare roles by set, never by order.'
      type: string
      enum:
        - admin
        - member
        - guest
    Workspace:
      description: A workspace, with the caller's role in it.
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          description: The workspace's address segment, fixed once created.
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          description: 1–80 characters after the surrounding blanks are trimmed, without control characters.
          type: string
        slug:
          description: 1–48 of a–z, 0–9, _ and -, not a reserved name; it cannot be changed later.
          type: string
    WorkspaceUpdate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: 1–80 characters after the surrounding blanks are trimmed, without control characters.
          type: string
    WorkspaceMember:
      description: A membership, with what the caller may see of the account.
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - role
        - display_name
        - email
        - created_at
      properties:
        id:
          description: The membership's id, which the member operations take.
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        display_name:
          type: string
        email:
          description: The account's email; null when the caller is a guest.
          type:
            - string
            - 'null'
        created_at:
          description: When the account first joined; a membership restored keeps it.
          type: string
          format: date-time
    WorkspaceMemberList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceInvitation:
      description: A pending invitation, as the workspace's admins see it.
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - token
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          description: The address invited, trimmed and in lower case.
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        token:
          description: The secret of the invitation's link, which the preview and the acceptance take with the id. It is the same each time it is read, until the instance's signing key changes.
          type: string
        created_at:
          type: string
          format: date-time
    WorkspaceInvitationList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceInvitation'
    WorkspaceInvitationCreate:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          description: The address to invite; stored trimmed and in lower case.
          type: string
          format: email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    WorkspaceMemberUpdate:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    InvitationToken:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          description: The token of the invitation's link.
          type: string
    InvitedWorkspace:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
        slug:
          type: string
    InvitationPreview:
      description: What an invitation invites to, as anyone holding its link sees it.
      type: object
      additionalProperties: false
      required:
        - workspace
        - role
      properties:
        workspace:
          $ref: '#/components/schemas/InvitedWorkspace'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    SlugAvailability:
      type: object
      additionalProperties: false
      required:
        - available
      properties:
        available:
          type: boolean
        reason:
          description: Why a new workspace cannot take the slug; absent when it can.
          type: string
          enum:
            - invalid
            - reserved
            - taken
    WorkspaceAccess:
      description: 'How open a notebook is to its workspace: the role it gives the workspace''s admins and members who are not its members (viewer gives reader, editor gives editor; none gives nothing). Guests have their own membership''s role alone.'
      type: string
      enum:
        - none
        - viewer
        - editor
    NotebookRole:
      description: 'A role in a notebook: admin manages the notebook and its members, editor writes, reader reads. Rules compare roles by set; which of two is higher only the order reader < editor < admin says.'
      type: string
      enum:
        - admin
        - editor
        - reader
    Notebook:
      description: 'A notebook, with the caller''s effective role in it: the higher of its membership''s role and the one the workspace access gives it.'
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - name
        - workspace_access
        - role
        - member_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
        role:
          $ref: '#/components/schemas/NotebookRole'
        member_count:
          description: How many active members the notebook has. A private notebook with one member is the caller's own ("My notebooks").
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotebookList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notebook'
    NotebookName:
      description: '1–255 bytes after the surrounding blanks are trimmed and the text is in NFC; none of / \ : * ? " < > | # ^ [ ] nor control characters; not starting or ending with a dot; no name Windows reserves (CON, COM1, …). It is the folder''s name when the notebook is exported.'
      type: string
    NotebookCreate:
      description: A new notebook; its workspace access is none when absent.
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/NotebookName'
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
    NotebookUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/NotebookName'
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
    NotebookMember:
      description: A membership of a notebook, with what the caller may see of the account.
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - role
        - display_name
        - email
        - created_at
      properties:
        id:
          description: The membership's id, which the member operations take.
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/NotebookRole'
        display_name:
          type: string
        email:
          description: The account's email; null when the caller is a guest of the workspace.
          type:
            - string
            - 'null'
        created_at:
          description: When the account first joined; a membership given back keeps it.
          type: string
          format: date-time
    NotebookMemberList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotebookMember'
    NotebookMemberCreate:
      type: object
      additionalProperties: false
      required:
        - user_id
        - role
      properties:
        user_id:
          description: The account's id, an active member of the notebook's workspace.
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/NotebookRole'
    NotebookMemberUpdate:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/NotebookRole'
    AccountProfile:
      description: What a workspace's admins see of an account in the ownerless list and the audit events.
      type: object
      additionalProperties: false
      required:
        - user_id
        - display_name
        - email
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
    OwnerlessNotebook:
      description: A notebook without an active admin, as its workspace's admins see it.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - workspace_access
        - member_count
        - former_owner
        - ownerless_since
        - last_activity_at
        - size_bytes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        workspace_access:
          $ref: '#/components/schemas/WorkspaceAccess'
        member_count:
          description: How many active members the notebook has left.
          type: integer
        former_owner:
          $ref: '#/components/schemas/AccountProfile'
        ownerless_since:
          description: When its last active admin's membership ended.
          type: string
          format: date-time
        last_activity_at:
          description: The last write to the notebook or to what it holds.
          type: string
          format: date-time
        size_bytes:
          description: What the notebook holds, in bytes.
          type: integer
          format: int64
    OwnerlessNotebookList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OwnerlessNotebook'
    NotebookAuditAction:
      description: 'What was done: taken_over and deleted by a workspace admin, returned to the former owner when it came back to the workspace.'
      type: string
      enum:
        - taken_over
        - deleted
        - returned
    NotebookAuditEvent:
      description: What was done with an ownerless notebook. It names the notebook as it was then, and outlives it.
      type: object
      additionalProperties: false
      required:
        - id
        - action
        - notebook_id
        - notebook_name
        - former_owner
        - actor
        - created_at
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/NotebookAuditAction'
        notebook_id:
          type: string
          format: uuid
        notebook_name:
          type: string
        former_owner:
          $ref: '#/components/schemas/AccountProfile'
        actor:
          $ref: '#/components/schemas/AccountProfile'
        created_at:
          type: string
          format: date-time
    NextCursor:
      description: The cursor of the next page; null on the last page.
      type:
        - string
        - 'null'
    NotebookAuditEventPage:
      type: object
      additionalProperties: false
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotebookAuditEvent'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    NodeKind:
      description: 'What a node of the tree is: a page, or an attachment, a file at the root or under a page, which no node is under.'
      type: string
      enum:
        - page
        - asset
    TreeNode:
      description: A node of a notebook's tree, a page or an attachment.
      type: object
      additionalProperties: false
      required:
        - id
        - notebook_id
        - parent_id
        - kind
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        parent_id:
          description: The parent page; null at the notebook's root.
          type:
            - string
            - 'null'
          format: uuid
        kind:
          $ref: '#/components/schemas/NodeKind'
        name:
          description: The page's title, or the attachment's file name.
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When the node was last created, renamed or moved; its content's writes do not change it.
          type: string
          format: date-time
    TreeNodeList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
    Title:
      description: '1–255 bytes after the surrounding blanks are trimmed and the text is in NFC; none of / \ : * ? " < > | # ^ [ ] nor control characters; not starting or ending with a dot; no name Windows reserves (CON, COM1, …). It is the file''s name when the notebook is exported. Siblings'' titles differ in more than case: they compare by Unicode case folding.'
      type: string
    Content:
      description: 'A page''s Markdown, byte for byte: at most 5 MiB (5,242,880 bytes) of UTF-8, without NUL characters. Its line breaks, byte order mark and blanks are kept as they are.'
      type: string
    PageCreate:
      description: A new page.
      type: object
      additionalProperties: false
      required:
        - parent_id
        - title
      properties:
        parent_id:
          description: The parent page; null for the notebook's root.
          type:
            - string
            - 'null'
          format: uuid
        title:
          $ref: '#/components/schemas/Title'
        after_id:
          description: The sibling the page goes right after; null puts it first, absent last.
          type:
            - string
            - 'null'
          format: uuid
        content:
          $ref: '#/components/schemas/Content'
    Ancestor:
      description: A page above another, on the way from the root.
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Page:
      description: 'A page: its node, its ancestors and what it tells of its content.'
      type: object
      additionalProperties: false
      required:
        - id
        - notebook_id
        - parent_id
        - kind
        - name
        - created_at
        - updated_at
        - ancestors
        - revision
        - byte_size
        - content_updated_at
        - content_updated_by
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        parent_id:
          description: The parent page; null at the notebook's root.
          type:
            - string
            - 'null'
          format: uuid
        kind:
          $ref: '#/components/schemas/NodeKind'
        name:
          description: The page's title.
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When the page was last created, renamed or moved; its content's writes do not change it.
          type: string
          format: date-time
        ancestors:
          description: The pages above it, from the root down to its parent; none at the root.
          type: array
          items:
            $ref: '#/components/schemas/Ancestor'
        revision:
          description: The content's version, 1 for a new page; each write of the content adds one.
          type: integer
        byte_size:
          description: The content's size in bytes.
          type: integer
        content_updated_at:
          description: When the content was last written.
          type: string
          format: date-time
        content_updated_by:
          description: The account that last wrote the content.
          type: string
          format: uuid
    PageContent:
      description: A page's content.
      type: object
      additionalProperties: false
      required:
        - content
        - revision
        - content_hash
      properties:
        content:
          $ref: '#/components/schemas/Content'
        revision:
          description: The content's version.
          type: integer
        content_hash:
          description: The SHA-256 of the content's bytes, in lower-case hexadecimal.
          type: string
          pattern: ^[0-9a-f]{64}$
    PageContentWrite:
      description: A page's new content.
      type: object
      additionalProperties: false
      required:
        - content
        - base_revision
      properties:
        content:
          $ref: '#/components/schemas/Content'
        base_revision:
          description: The revision the content was read at.
          type: integer
        edit_session_id:
          description: The caller's edit session of the page the write is made in.
          type: string
          format: uuid
    EditSessionOpening:
      description: How an edit session opens.
      type: object
      additionalProperties: false
      properties:
        take_over:
          description: End the caller's own alive sessions of the page first, wherever they were opened.
          type: boolean
          default: false
    EditSession:
      description: An edit session of a page, while its lease lasts.
      type: object
      additionalProperties: false
      required:
        - id
        - page_id
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        expires_at:
          description: When the session ends unless a heartbeat keeps it alive.
          type: string
          format: date-time
    EditLockHolder:
      description: The account whose alive edit session holds a page's lock.
      type: object
      additionalProperties: false
      required:
        - user_id
        - display_name
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
    EditLock:
      description: A page's edit lock.
      type: object
      additionalProperties: false
      required:
        - holder
        - expires_in
      properties:
        holder:
          description: Who holds the lock; null while no one does.
          anyOf:
            - $ref: '#/components/schemas/EditLockHolder'
            - type: 'null'
        expires_in:
          description: 'Whole seconds, rounded up, until the holder''s lease ends unless a heartbeat keeps it; null while no one holds the lock. A span, not a time: the client''s clock may be wrong.'
          type:
            - integer
            - 'null'
          minimum: 1
    PageView:
      description: A page's reading view.
      type: object
      additionalProperties: false
      required:
        - html
        - revision
        - assets_expire_at
      properties:
        html:
          description: 'The content rendered to HTML. The attachments its links lead to are shown at their contents'' addresses, signed, each a path of this site, as getPageView tells: an image, an audio or a video embedded, a link to any other; text past the first addresses, and in a link''s text but for an image.'
          type: string
        revision:
          description: The content's version the HTML was rendered from.
          type: integer
        assets_expire_at:
          description: When the earliest of the attachments' addresses in the HTML expires, after which the view is to be read again; null for a view with none.
          type:
            - string
            - 'null'
          format: date-time
    TaskToggle:
      description: A tick or a clear of a task item.
      type: object
      additionalProperties: false
      required:
        - base_revision
        - offset
        - checked
      properties:
        base_revision:
          description: The revision the offset was read at, the reading view's.
          type: integer
        offset:
          description: 'The byte offset in the content of the character between the item''s brackets: its checkbox''s data-task.'
          type: integer
        checked:
          description: Tick the item (true) or clear it (false).
          type: boolean
    NodeRename:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/Title'
    NodeMove:
      description: Where a page goes.
      type: object
      additionalProperties: false
      required:
        - parent_id
      properties:
        parent_id:
          description: The new parent page; null for the notebook's root.
          type:
            - string
            - 'null'
          format: uuid
        after_id:
          description: The sibling the page goes right after; null puts it first, absent last.
          type:
            - string
            - 'null'
          format: uuid
    Backlink:
      description: A page that links to another.
      type: object
      additionalProperties: false
      required:
        - id
        - count
        - contexts
      properties:
        id:
          description: The page with the links.
          type: string
          format: uuid
        count:
          description: 'How many of its links lead to the other page, counted up to 1000: 1000 is as many or more.'
          type: integer
          minimum: 1
          maximum: 1000
        contexts:
          description: The lines of its first 10 links there, by where they are written, one a line; none in the cases the operation lists.
          type: array
          maxItems: 10
          items:
            type: string
    BacklinkPage:
      type: object
      additionalProperties: false
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Backlink'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    PageProperty:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          description: The property's value as JSON; an object's keys are not in the order written.
    LinkTargetKind:
      description: What a link target is, a page or an attachment.
      type: string
      enum:
        - page
        - asset
    PropertyLink:
      description: A property whose value, or an item of whose list, is a link.
      type: object
      additionalProperties: false
      required:
        - key
        - node_id
        - kind
        - url
        - inline
      properties:
        key:
          description: The property's path, a list's item after a dot (sources.0).
          type: string
        node_id:
          description: The page or the attachment the link resolves to; null for none.
          type:
            - string
            - 'null'
          format: uuid
        kind:
          description: What node_id is; null when it is null.
          anyOf:
            - $ref: '#/components/schemas/LinkTargetKind'
            - type: 'null'
        url:
          description: 'The address of an attachment''s content, signed, a path of this site, as the attachment''s content_url is: it expires as that does, and a read of the properties signs it anew. Null for a page, for none, and for an attachment deleted since the link was indexed.'
          type:
            - string
            - 'null'
        inline:
          description: 'Whether the browser shows the content at url itself, which opens in a tab of its own, or downloads it: as the attachment''s mime says (an image, an audio, a video or a PDF the server shows). Null when url is null.'
          type:
            - boolean
            - 'null'
    PageProperties:
      type: object
      additionalProperties: false
      required:
        - valid
        - properties
        - links
        - assets_expire_at
      properties:
        valid:
          description: Whether the page's frontmatter is valid; a page without one is. An invalid one has no properties.
          type: boolean
        properties:
          description: The frontmatter's properties, in the order written.
          type: array
          items:
            $ref: '#/components/schemas/PageProperty'
        links:
          description: The property links, by where they are written.
          type: array
          items:
            $ref: '#/components/schemas/PropertyLink'
        assets_expire_at:
          description: When the earliest of the links' attachments' addresses expires, after which the properties are to be read again; null for none.
          type:
            - string
            - 'null'
          format: date-time
    Landing:
      description: Where a page made for a link would go.
      type: object
      additionalProperties: false
      required:
        - parent_id
        - title
      properties:
        parent_id:
          description: The page it would go under; null for the notebook's root.
          type:
            - string
            - 'null'
          format: uuid
        title:
          description: Its title, as createPage takes it.
          type: string
    LandingReason:
      description: Why a link's target has no landing; the operation says each.
      type: string
      enum:
        - target_invalid
        - title_invalid
        - target_is_asset
        - parent_missing
        - too_deep
        - not_resolvable
    LinkLanding:
      description: Exactly one of node_id, landing and reason is not null.
      type: object
      additionalProperties: false
      required:
        - node_id
        - landing
        - reason
      properties:
        node_id:
          description: The page the target leads to already; null for none.
          type:
            - string
            - 'null'
          format: uuid
        landing:
          description: Where the page made would go; null for nowhere.
          anyOf:
            - $ref: '#/components/schemas/Landing'
            - type: 'null'
        reason:
          description: Why the target has no landing; null when it has one.
          anyOf:
            - $ref: '#/components/schemas/LandingReason'
            - type: 'null'
    TagCount:
      type: object
      additionalProperties: false
      required:
        - tag
        - count
      properties:
        tag:
          description: The tag, without its '#'.
          type: string
        count:
          description: How many pages have it.
          type: integer
          minimum: 1
    TagList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagCount'
    TagPage:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
    TagPageList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagPage'
    LinkTarget:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - link
        - aliases
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/LinkTargetKind'
        name:
          description: The page's title; the attachment's name, with its extension.
          type: string
        link:
          description: 'How a wikilink is written to lead to the node alone, from anywhere in the notebook: its title or name, or its path from the root where another node of its kind has its title; with ".md" after the path where it would be read otherwise, a page''s whose title ends with ".md" as another page''s without it, a page''s whose title an attachment has as the attachment''s.'
          type: string
        aliases:
          description: The page's aliases, its first 1000, in the order of their case-folded keys; none for an attachment.
          type: array
          maxItems: 1000
          items:
            type: string
    LinkTargetList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LinkTarget'
    EventHello:
      description: The data of hello, the first frame.
      type: object
      additionalProperties: false
      required:
        - heartbeat_seconds
      properties:
        heartbeat_seconds:
          description: Seconds between two heartbeats.
          type: integer
          minimum: 5
          maximum: 50
    EventPageRevision:
      description: A page whose content was written, and its new revision.
      type: object
      additionalProperties: false
      required:
        - id
        - revision
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
    EventPages:
      description: The data of pages, one write of a notebook's pages.
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - notebook_id
        - tree
        - pages
      properties:
        workspace_id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        tree:
          description: Whether the notebook's tree changed.
          type: boolean
        pages:
          description: 'The pages whose content was written, with their new revisions: empty for none, null for more than 20.'
          type:
            - array
            - 'null'
          maxItems: 20
          items:
            $ref: '#/components/schemas/EventPageRevision'
    EventLock:
      description: The data of lock, an edit session of a page opened or ended.
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - notebook_id
        - page_id
        - session_id
      properties:
        workspace_id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
    EventLinks:
      description: The data of links, a write's changes of a notebook's link index.
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - notebook_id
        - pages
        - targets
      properties:
        workspace_id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        pages:
          description: 'The pages of the link index whose links resolve to other pages or attachments now, but for those whose content was written: empty for none, null for more than 20 or for all of them (a rebuilt index).'
          type:
            - array
            - 'null'
          maxItems: 20
          items:
            type: string
            format: uuid
        targets:
          description: 'The pages and attachments whose backlinks changed: empty for none, null for more than 20 or for all of them (a rebuilt index).'
          type:
            - array
            - 'null'
          maxItems: 20
          items:
            type: string
            format: uuid
    EventReset:
      description: The data of reset, the last frame.
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - access
            - notebooks_deleted
            - expired
            - unauthenticated
            - reconnected
            - overflow
    Asset:
      description: 'An attachment: its node in the notebook''s tree, its file, and the addresses of its content, signed for anyone who has them.'
      type: object
      additionalProperties: false
      required:
        - id
        - notebook_id
        - parent_id
        - name
        - link
        - mime
        - byte_size
        - sha256
        - width
        - height
        - created_by
        - created_at
        - content_url
        - download_url
        - expires_at
      properties:
        id:
          description: The attachment's node.
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        parent_id:
          description: The page it is under; null at the notebook's root.
          type:
            - string
            - 'null'
          format: uuid
        name:
          description: The attachment's file name.
          type: string
        link:
          description: 'How a wikilink, ![[link]] to embed it, is written to lead to the attachment alone from anywhere in the notebook, as the link targets write it: its name, or its path from the root where another attachment has its name''s title key. It is as of the answer: another attachment given that title key later may make the name lead elsewhere. Null for an attachment without an extension, which no link leads to.'
          type:
            - string
            - 'null'
        mime:
          description: 'The type the server told from the name''s extension and the file''s first bytes, which it serves the content as: an image, an audio, a video or a PDF it shows; application/octet-stream for any other file, which is downloaded.'
          type: string
        byte_size:
          description: The file's size in bytes.
          type: integer
          format: int64
        sha256:
          description: The file's SHA-256, in lower-case hexadecimal.
          type: string
        width:
          description: An image's width in pixels (PNG, JPEG, GIF), when the server read it; null otherwise.
          type:
            - integer
            - 'null'
        height:
          description: An image's height in pixels, as width.
          type:
            - integer
            - 'null'
        created_by:
          description: Who uploaded it.
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        content_url:
          description: 'The address of the content, on this server, which a browser opens without a token until expires_at: an image, an audio, a video or a PDF is shown, any other file downloaded.'
          type: string
        download_url:
          description: The address of the content to download, whatever its type, until expires_at.
          type: string
        expires_at:
          description: When the addresses stop working, one to two hours after they were signed; reading the attachment again signs new ones.
          type: string
          format: date-time
    AssetPage:
      type: object
      additionalProperties: false
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ExportStart:
      type: object
      additionalProperties: false
      properties:
        root_id:
          description: The page to export with its subtree; absent or null for the whole notebook.
          type:
            - string
            - 'null'
          format: uuid
    TransferKind:
      type: string
      enum:
        - import
        - export
    TransferState:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
        - expired
    TransferClient:
      description: Where the job was started from, which its writes are of.
      type: string
      enum:
        - web
        - api
    TransferStarter:
      description: Who started the job.
      type: object
      additionalProperties: false
      required:
        - user_id
        - display_name
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
    TransferProgress:
      description: 'How many of the job''s nodes are done, of all: an export''s written; an import''s created or skipped, of those to create, 0 of 0 until its archive is read.'
      type: object
      additionalProperties: false
      required:
        - done
        - total
      properties:
        done:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    TransferFailure:
      description: 'Why a job failed: interrupted (the server stopped or restarted, the job stopped beating, or the job queue dropped it before it began), timeout (it ran past the instance''s limit), forbidden (its starter could no longer read the notebook as it ran, or write in it as an import ran), root_not_found (the page exported, or imported under, was gone as it ran), storage_full, contributor_conflict (a file the server adds was where a node is), internal; for an import''s archive as a whole, nothing written: not_zip (no zip, or its directory is broken), too_many_entries (more entries than the instance takes, or a directory larger than 64 MiB), unpacked_too_large (its entries unpack to more than the instance takes); tree_changed (a page the import created was deleted or moved away as it ran, its later nodes not written).'
      type: string
      enum:
        - interrupted
        - timeout
        - forbidden
        - root_not_found
        - storage_full
        - contributor_conflict
        - internal
        - not_zip
        - too_many_entries
        - unpacked_too_large
        - tree_changed
    TransferCounts:
      description: 'What the job did before it ended, as it wrote its end. An export that could not write its end, which the server fails later as interrupted (it restarted, the job stopped beating, the job queue dropped it), counts nothing: its progress tells how far it went. An import writes its counts and problems as it goes, every ten seconds at most: one interrupted keeps those it last wrote, of the batches written by then.'
      type: object
      additionalProperties: false
      required:
        - pages
        - attachments
        - renamed
        - missing
        - skipped
      properties:
        pages:
          description: The pages written; an import's, created.
          type: integer
          format: int64
        attachments:
          description: The attachments whose files were written; an import's, created.
          type: integer
          format: int64
        renamed:
          description: The nodes the export's vault names otherwise, as the export laid the vault out before it wrote; the nodes an import named otherwise than the archive.
          type: integer
          format: int64
        missing:
          description: The attachments whose files were not in the storage, and not written; 0 for an import.
          type: integer
          format: int64
        skipped:
          description: An import's entries skipped; 0 for an export.
          type: integer
          format: int64
    TransferReport:
      type: object
      additionalProperties: false
      required:
        - failure
        - counts
      properties:
        failure:
          description: Why the job failed; null when it did not.
          anyOf:
            - $ref: '#/components/schemas/TransferFailure'
            - type: 'null'
        counts:
          $ref: '#/components/schemas/TransferCounts'
    TransferDownload:
      type: object
      additionalProperties: false
      required:
        - url
        - expires_at
      properties:
        url:
          description: The archive's address on this server, which a browser downloads without a token until expires_at.
          type: string
        expires_at:
          description: 'When the address stops working: one to two hours after it was signed, or as the export expires, whichever comes first; reading the job again signs a new one. The starter''s next export of the notebook, once it succeeds, expires this one at once.'
          type: string
          format: date-time
    TransferJob:
      description: 'An import or an export of a notebook, a job that runs in the background: queued, then running, then succeeded, failed or cancelled. An export''s archive expires a while after it succeeded, the instance''s export TTL, or at once when its starter''s next export of the notebook succeeds: a starter keeps only their latest export of a notebook.'
      type: object
      additionalProperties: false
      required:
        - id
        - notebook_id
        - root_id
        - name
        - kind
        - state
        - client
        - created_by
        - created_at
        - started_at
        - cancel_requested_at
        - finished_at
        - progress
        - result_bytes
        - report
        - download
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        root_id:
          description: The page exported with its subtree, or imported under; null for the whole notebook, or its root.
          type:
            - string
            - 'null'
          format: uuid
        name:
          description: What is exported, by name, the notebook's or the page's, which the archive is named after; for an import, the archive's file name.
          type: string
        kind:
          $ref: '#/components/schemas/TransferKind'
        state:
          $ref: '#/components/schemas/TransferState'
        client:
          $ref: '#/components/schemas/TransferClient'
        created_by:
          $ref: '#/components/schemas/TransferStarter'
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        cancel_requested_at:
          description: 'When a cancel of the job was asked as it ran: it stops at its next heartbeat, within about a second, unless it ends first; null when none was.'
          type:
            - string
            - 'null'
          format: date-time
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
        progress:
          $ref: '#/components/schemas/TransferProgress'
        result_bytes:
          description: The bytes of an export's archive, once it succeeded, and after it expired; null otherwise.
          type:
            - integer
            - 'null'
          format: int64
        report:
          description: What the job did and why it failed, once it ended; null before.
          oneOf:
            - $ref: '#/components/schemas/TransferReport'
            - type: 'null'
        download:
          description: The address of an export's archive, once it succeeded and until it expires; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/TransferDownload'
            - type: 'null'
    TransferJobPage:
      type: object
      additionalProperties: false
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransferJob'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    TransferProblem:
      description: 'What befell a node, at its path in the archive''s vault (at most 1,024 bytes): renamed, written at to instead, so links to its old name do not reach it there; file_missing, an attachment whose file was not in the storage. An import''s entry skipped, at its name in the archive: unsafe_path (it leaves the archive''s root: "..", an absolute path, a drive), special_file (a symbolic link, or another file that is no regular one), encrypted, unsupported_method (compressed otherwise than stored or deflated), too_compressed (it unpacks to more than 200 times its packed size), name_not_utf8, invalid_content (a page''s file not UTF-8, or holding NUL), too_large (a page''s file past 5 MiB, an attachment past the instance''s asset_max_bytes), duplicate (a path an earlier entry has), unreadable (its data broken, its checksum or size not its header''s); an import''s node, at its path in the vault: too_deep (more than 10 levels deep in the notebook where the import goes, with everything under it), renamed (created under the name at the end of to, its path from where the import goes).'
      type: object
      additionalProperties: false
      required:
        - path
        - code
        - to
      properties:
        path:
          type: string
        code:
          type: string
          enum:
            - renamed
            - file_missing
            - unsafe_path
            - special_file
            - encrypted
            - unsupported_method
            - too_compressed
            - name_not_utf8
            - invalid_content
            - too_large
            - too_deep
            - duplicate
            - unreadable
        to:
          description: Where a renamed node is written, or created; null for any other problem.
          type:
            - string
            - 'null'
    TransferJobDetail:
      description: A job, as TransferJob, and its report's problems once it ended.
      type: object
      additionalProperties: false
      required:
        - id
        - notebook_id
        - root_id
        - name
        - kind
        - state
        - client
        - created_by
        - created_at
        - started_at
        - cancel_requested_at
        - finished_at
        - progress
        - result_bytes
        - report
        - download
        - problems
        - problems_truncated
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        root_id:
          description: The page exported with its subtree, or imported under; null for the whole notebook, or its root.
          type:
            - string
            - 'null'
          format: uuid
        name:
          description: What is exported, by name, the notebook's or the page's, which the archive is named after; for an import, the archive's file name.
          type: string
        kind:
          $ref: '#/components/schemas/TransferKind'
        state:
          $ref: '#/components/schemas/TransferState'
        client:
          $ref: '#/components/schemas/TransferClient'
        created_by:
          $ref: '#/components/schemas/TransferStarter'
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        cancel_requested_at:
          description: 'When a cancel of the job was asked as it ran: it stops at its next heartbeat, within about a second, unless it ends first; null when none was.'
          type:
            - string
            - 'null'
          format: date-time
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
        progress:
          $ref: '#/components/schemas/TransferProgress'
        result_bytes:
          description: The bytes of an export's archive, once it succeeded, and after it expired; null otherwise.
          type:
            - integer
            - 'null'
          format: int64
        report:
          description: What the job did and why it failed, once it ended; null before.
          oneOf:
            - $ref: '#/components/schemas/TransferReport'
            - type: 'null'
        download:
          description: The address of an export's archive, once it succeeded and until it expires; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/TransferDownload'
            - type: 'null'
        problems:
          description: The first 1,000 problems of the report, in the order met; empty before the job ends.
          type: array
          items:
            $ref: '#/components/schemas/TransferProblem'
        problems_truncated:
          description: Whether problems were left out past the first 1,000.
          type: boolean
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: Whole seconds to wait before trying again, rounded up; sent with rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: 'Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token" (RFC 6750 3) when the bearer token sent is refused before the operation runs, being invalid or expired; plain Bearer for every other 401, including a credential that the operation finds revoked while it runs.'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: 'The workspace''s slug. It carries no pattern here: a slug spelled wrong names no workspace, which the operation answers itself.'
      schema:
        type: string
    WorkspaceMemberID:
      name: workspace_member_id
      in: path
      required: true
      description: The id of a membership, as the member list answers it; not the account's id.
      schema:
        type: string
        format: uuid
    WorkspaceInvitationID:
      name: workspace_invitation_id
      in: path
      required: true
      description: The id of an invitation, as its link carries it.
      schema:
        type: string
        format: uuid
    NotebookID:
      name: notebook_id
      in: path
      required: true
      description: The notebook's id.
      schema:
        type: string
        format: uuid
    NotebookMemberID:
      name: notebook_member_id
      in: path
      required: true
      description: The id of a membership, as the member list answers it; not the account's id.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: The page size, 1–100; 50 when absent. Outside that range the answer is 422 validation_failed on limit.
      schema:
        type: integer
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the page before; absent for the first page. A cursor that does not decode, has an unknown version or a payload of another shape than this list's, or is not spelled as the server writes it is 400 bad_request on cursor.
      schema:
        type: string
    PageID:
      name: page_id
      in: path
      required: true
      description: The page's id.
      schema:
        type: string
        format: uuid
    EditSessionID:
      name: edit_session_id
      in: path
      required: true
      description: The edit session's id.
      schema:
        type: string
        format: uuid
    NodeID:
      name: node_id
      in: path
      required: true
      description: The id of a node of a notebook's tree.
      schema:
        type: string
        format: uuid
    Tag:
      name: tag
      in: path
      required: true
      description: 'A tag''s name, without its ''#'', as listTags writes it and a reading view''s tag link carries it; a nested tag''s ''/'' is written %2F (a%2Fb). The tag "/" alone cannot be named: the path reads its %2F as a trailing slash, a path no operation has (404 not_found).'
      schema:
        type: string
    JobID:
      name: job_id
      in: path
      required: true
      description: The job's id.
      schema:
        type: string
        format: uuid
  headers:
    ContentDisposition:
      description: 'inline for a file shown, attachment for one downloaded, with its name (RFC 6266: filename in ASCII, filename* in UTF-8).'
      required: true
      schema:
        type: string
    ETag:
      description: The file's SHA-256, in lower-case hexadecimal, quoted.
      required: true
      schema:
        type: string
    CacheControl:
      description: private, max-age of the seconds the address has left, immutable.
      required: true
      schema:
        type: string
    ContentSecurityPolicy:
      description: 'The sandbox every answer of a content runs in: no script, an opaque origin, nothing asked of another server, images and media of this one alone.'
      required: true
      schema:
        type: string
    CrossOriginResourcePolicy:
      description: same-origin, that no other site reads the content.
      required: true
      schema:
        type: string
    ArchiveDisposition:
      description: 'attachment, with the archive''s name: the notebook''s or the page''s, and .zip (RFC 6266: filename in ASCII, filename* in UTF-8).'
      required: true
      schema:
        type: string
    ArchivePolicy:
      description: The sandbox every answer of the download runs in.
      required: true
      schema:
        type: string
x-problem-codes:
  - bad_request
  - payload_too_large
  - rate_limited
  - internal_error
