          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}/content:
    parameters:
      - $ref: '#/components/parameters/PageID'
    get:
      operationId: getPageContent
      tags:
        - page
      summary: Read a page's content
      description: The page's Markdown, byte for byte as written, with its revision and hash. Any role in its notebook can read it. A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike.
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
      responses:
        '200':
          description: The page's content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContent'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putPageContent
      tags:
        - page
      summary: Write a page's content
      description: 'Replaces the page''s content, byte for byte, on the revision the writer read it at; its notebook''s editors and admins can, a reader cannot (forbidden). A content of more than 5 MiB (5,242,880 bytes) or with a NUL character is validation_failed first, whatever the page. Then a page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found; an edit session that is not the caller''s session of this page, opened from the same client (the web or a token), is page.edit_session_ended; then one taken over by the caller elsewhere is page.edit_session_taken_over, one whose lock an admin of the notebook released is page.edit_session_unlocked, naming them in ended_by, and one no longer alive is page.edit_session_ended; a base_revision that is not the page''s revision is page.revision_mismatch: the page was written since, and the writer reads it again. A content the page holds already writes nothing, whatever the base. Then a page whose lock another edit session holds, the caller''s elsewhere among them, is page.locked, naming the holder in lock: a write in no session too. The writes of one edit session are one changeset, with one version of the page, until another write of the page comes in between. When the server parses as much content as it can at once, a content waits a moment, then is server_busy. A body that has not all arrived within the server''s read timeout (server.read_timeout, 30 seconds by default, in which 5 MiB needs about 1.4 Mbit/s) is bad_request.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - page.not_found
        - forbidden
        - page.edit_session_ended
        - page.edit_session_taken_over
        - page.edit_session_unlocked
        - page.revision_mismatch
        - page.locked
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageContentWrite'
      responses:
        '200':
          description: The page, as the write leaves it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}/edit-sessions:
    parameters:
      - $ref: '#/components/parameters/PageID'
    post:
      operationId: openEditSession
      tags:
        - page
      summary: Open an edit session
      description: 'Opens the caller''s edit session of the page: a lease of 120 seconds, which a heartbeat every 20 seconds keeps alive. The content''s writes that name it are one changeset. The page''s alive session holds its edit lock: while one does, another opening is page.locked, naming the holder in lock, the caller among them when they hold it elsewhere. With take_over, the caller''s own alive sessions of the page end first (their next heartbeat or write is page.edit_session_taken_over); someone else''s lock it does not pass. Its notebook''s editors and admins can, a reader cannot (forbidden). A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - forbidden
        - page.locked
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditSessionOpening'
      responses:
        '201':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSession'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}/edit-lock:
    parameters:
      - $ref: '#/components/parameters/PageID'
    get:
      operationId: getEditLock
      tags:
        - page
      summary: Read a page's edit lock
      description: Who holds the page's edit lock, and for how many seconds its lease lasts unless a heartbeat keeps it; no holder while no alive session holds it. Whoever may read the page may read it. A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike.
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
      responses:
        '200':
          description: The page's edit lock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditLock'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: releaseEditLock
      tags:
        - page
      summary: Release a page's edit lock
      description: 'Ends whichever edit session holds the page''s lock: its next heartbeat or write is page.edit_session_unlocked, naming the caller. A page no session holds is released already. Its notebook''s admins can, anyone else in it cannot (forbidden). A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - forbidden
      responses:
        '204':
          description: No session holds the page's lock.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}/view:
    parameters:
      - $ref: '#/components/parameters/PageID'
    get:
      operationId: getPageView
      tags:
        - page
      summary: Read a page
      description: 'The page''s reading view: its content rendered to HTML, its frontmatter''s properties as a table first, and the revision it was rendered from. The HTML holds only what the renderer writes and a typographic allowlist of the content''s own HTML, every address on this site, http(s) or mailto, and nothing loaded but an attachment''s image, audio or video at a path of this site. In the content, a wikilink, an embed (nw-embed), and a Markdown link or image whose address is a path, from the root too, link to pages of the notebook and have no address, which the app gives: each carries the page it leads to as it reads now (data-nw-node) and its anchor''s heading id (data-nw-anchor), or nw-unresolved and its target (data-nw-target). One that leads to an attachment (nw-asset) has its content''s address, signed, which expires at assets_expire_at the earliest: an embed or an image of an image is its img, of the caption and the size written (|300, |300x200), or else of the image''s own size; of an audio or a video, its element, the content''s first 20 of them; any other is a link, data-nw-size its size in bytes, and download where the browser downloads the content (any type the server does not show: its mime is application/octet-stream), showing the others itself. Past the content''s first 2000 addresses of attachments, in a link''s text but for an image, and for an attachment deleted, it is text. A tag (nw-tag) of a name tag lists count links to its pages and has no address either: it carries the tag as this page writes it, but for its ''#'' and a last ''/'', which getTag takes (data-nw-tag); a tag the index does not keep of the page, its key longer than 1024 bytes or past the page''s first 1000 tags, links still, though getTag does not list the page for it. A tag of a name the lists do not count (#1/) is a span, as are the tag "/" (#//), which getTag''s path cannot name, and a tag in a link''s text. A wikilink in a link''s text is a span, as is one written with a block''s anchor alone ([[#^b]]); one written with a heading''s anchor alone ([[#h]]) has the heading''s id as its address, as has a Markdown link to an anchor alone (#h), which is its text alone for a block''s anchor or an empty one; an image of a page in a link''s text has no link of its own. A table, the properties'' table and a block formula are each in a div of class nw-scroll, a region of their own that may scroll sideways. In the properties'' table, a string written on one line that is one link to a page or an attachment and nothing else, a wikilink with a target (not an anchor alone) or a Markdown link whose address is a path, is a link as in the content, without a title, showing the text the link shows; a value a YAML alias repeats, and every other value, is text. Once the page is in the link index (nervewiki reindex after an upgrade), a links event tells when where its links lead changes. A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike. When the server parses as much content as it can at once, the page waits a moment, then is server_busy.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - server_busy
      responses:
        '200':
          description: The page's reading view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageView'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}/toggle-task:
    parameters:
      - $ref: '#/components/parameters/PageID'
    post:
      operationId: toggleTask
      tags:
        - page
      summary: Tick or clear a task item
      description: 'Ticks the page''s task item at offset (checked true) or clears it (false): the character between its brackets, at the byte offset in the content that the reading view''s checkbox carries in data-task, becomes x or a space, and no other byte changes. Its notebook''s editors and admins can, a reader cannot (forbidden). A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found; a base_revision that is not the page''s revision is page.revision_mismatch: an offset means something in that revision only. Then an offset that is no task item''s, of that content, is validation_failed (out_of_range on offset), and a tick or a clear that would leave none there is too (not_allowed: ticking "- [ ]: /u" makes a link reference definition). A task item in that state already writes nothing: the page is answered as it is, or page.revision_mismatch if a write came since. Then a page whose lock an edit session holds, the caller''s elsewhere among them, is page.locked, naming the holder in lock. When the server parses as much content as it can at once, a toggle waits a moment, then is server_busy.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - forbidden
        - page.revision_mismatch
        - validation_failed
        - page.locked
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskToggle'
      responses:
        '200':
          description: The page, as the toggle leaves it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/edit-sessions/{edit_session_id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/EditSessionID'
    post:
      operationId: heartbeatEditSession
      tags:
        - page
      summary: Keep an edit session alive
      description: 'Keeps the caller''s session alive for 120 seconds from now. The caller''s session, alive or ended by a take-over or an unlock, is page.edit_session_not_found when the caller has no role in its notebook any more, and forbidden when they may only read its page now. Otherwise the caller''s session taken over elsewhere is page.edit_session_taken_over; one whose lock an admin of the notebook released is page.edit_session_unlocked, naming them in ended_by: the editor does not open another. Either answers so until its record is cleaned up, at least 120 seconds after the end. A session that does not exist, has expired, or is someone else''s is page.edit_session_not_found alike: the editor opens a new one.'
      security:
        - bearer: []
      x-problem-codes:
        - page.edit_session_not_found
        - forbidden
        - page.edit_session_taken_over
        - page.edit_session_unlocked
      responses:
        '200':
          description: The session, kept alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSession'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/edit-sessions/{edit_session_id}:
    parameters:
      - $ref: '#/components/parameters/EditSessionID'
    delete:
      operationId: endEditSession
      tags:
        - page
      summary: End an edit session
      description: 'Ends the caller''s session: it asks only that the session is the caller''s, and alive, or taken over or unlocked, expired or not until its record is cleaned up (its record goes). A session that does not exist, has expired otherwise, or is someone else''s is page.edit_session_not_found alike, which the editor takes for ended.'
      security:
        - bearer: []
      x-problem-codes:
        - page.edit_session_not_found
      responses:
        '204':
          description: The session is ended.
