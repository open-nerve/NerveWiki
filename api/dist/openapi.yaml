  /api/v0/events:
    get:
      operationId: streamEvents
      tags:
        - events
      summary: Stream the events of what the caller sees
      description: |-
        A server-sent event stream of the writes in the notebooks the caller may read, for a client to refresh what it shows. Any account can open one; it gets the events of what it sees. Each frame has an event field and one line of JSON data:

        - hello: the first frame; heartbeat_seconds is how often a heartbeat comes, a comment line. The server authenticates the credential again at each.
        - pages: a write of a notebook's pages; tree tells whether the tree changed (a page created, renamed, moved or deleted), pages lists the pages whose content was written with their new revisions, empty for none, null for more than 20, when the client takes every page as written.
        - lock: an edit session of a page opened or ended; the client reads the page's lock again.
        - links: a write of a notebook's pages changed its link index; pages lists the pages of the index (so after an upgrade once nervewiki reindex has run) whose links resolve to other pages now, but for those whose content the write wrote, which a pages event lists; targets lists the pages whose backlinks changed. Each is empty for none, and null for more than 20 or for all of them, as after nervewiki reindex rebuilt the index, when the client takes every page of the notebook as changed.
        - reset: the last frame; the client reconnects at once and refreshes all it shows. reason is access (the caller may see other notebooks now), notebooks_deleted, expired (the credential, at its expiry), unauthenticated (it failed at a heartbeat: revoked, signed out, the account deactivated), reconnected (the server missed events), or overflow (the client fell behind). A reset for access, notebooks_deleted, reconnected or overflow comes after the events the stream held.

        The stream may also end without a reset: when the server stops, when the credential cannot be checked at a heartbeat, or when the client does not take a frame within a heartbeat. The client reconnects then too, and refreshes.

        Other event types may come; a client ignores those it does not know. While the server cannot listen for events yet, starting or reconnecting, it answers not_ready with Retry-After.
      security:
        - bearer: []
      x-long-lived: true
      x-problem-codes:
        - not_ready
      responses:
        '200':
          description: The stream; it stays open until it ends as above or the client goes.
          content:
            text/event-stream:
              schema:
                description: The data of a frame, by its event field.
                oneOf:
                  - $ref: '#/components/schemas/EventHello'
                  - $ref: '#/components/schemas/EventPages'
                  - $ref: '#/components/schemas/EventLock'
                  - $ref: '#/components/schemas/EventLinks'
                  - $ref: '#/components/schemas/EventReset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebooks/{notebook_id}/assets:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    post:
      operationId: uploadAsset
      tags:
        - asset
      summary: Upload an attachment
      description: 'Uploads a file as an attachment of the notebook, under a page or at its root, last among its siblings; its notebook''s editors and admins can, a reader cannot (forbidden). The body is multipart/form-data whose parts are parent_id, name and file, in that order, the first two optional: an unknown part, one twice, one out of order, a part after the file, a parent_id that is no id, a name of more than 1 KiB or not UTF-8, more than 4 KiB read before the file''s bytes, no file, and a body that goes on after the form past the limit are bad_request. Each part is read as sent: a Content-Transfer-Encoding is not decoded. Without a name, or with one empty or of blanks, the file part''s file name is taken. Before the file is read, a notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; the name follows a page''s title''s rules and does not end with ".md", in any case, and the parent is a page of the notebook (validation_failed); a name a sibling has, compared by its key, is page.title_taken; and a server whose storage keeps no more room is storage_full: a client answered before it sent its file may see the connection reset, and checks these first. A file larger than the instance''s asset_max_bytes is payload_too_large; one that does not arrive at the instance''s lowest rate is cut off, as is one still arriving when the server shuts down. A file the storage runs out of room for is storage_full. The checks are made again as the attachment is created. The server tells the file''s type from its name''s extension and its first bytes, and reads an image''s size.'
      security:
        - bearer: []
      x-raw: true
      x-problem-codes:
        - notebook.not_found
        - forbidden
        - validation_failed
        - page.title_taken
        - storage_full
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                parent_id:
                  description: The page to put the attachment under; none puts it at the notebook's root.
                  type: string
                  format: uuid
                name:
                  description: The attachment's name; none, or one empty or of blanks, takes the file part's file name.
                  type: string
                file:
                  description: The file, the last part.
                  type: string
                  format: binary
      responses:
        '201':
          description: The attachment, uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listAssets
      tags:
        - asset
      summary: List the attachments under a page
      description: The attachments under a page of the notebook, or at its root without parent_id, by name, compared by its key, then id, a page at a time, each with its addresses signed. Any role in the notebook can list them. A cursor the list cannot read is bad_request, before anything else; a notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; a parent_id that is no page of the notebook, or a deleted one, is page.not_found; a limit outside 1–100 is validation_failed.
      security:
        - bearer: []
      x-problem-codes:
        - bad_request
        - notebook.not_found
        - page.not_found
        - validation_failed
      parameters:
        - name: parent_id
          in: query
          description: The page whose attachments to list; absent for the notebook's root.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        default:
          $ref: '#/components/responses/Problem'
