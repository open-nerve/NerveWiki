openapi: 3.1.0
info:
  title: Nerve Wiki API
  version: v0
  description: The HTTP API of Nerve Wiki. The web app is one client of it; every account can use every endpoint the same way. Every operation lists the problem codes it can answer in x-problem-codes; the top-level x-problem-codes can come from every operation, and an operation that needs a bearer token can also answer unauthorized.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
tags:
  - name: identity
    description: Accounts, sign-in, sessions and personal access tokens.
  - name: instance
    description: What this instance runs.
  - name: workspace
    description: Workspaces, their members and invitations.
  - name: notebook
    description: Notebooks and their members.
  - name: page
    description: The pages of a notebook's tree.
paths:
  /api/v0/auth/register:
    post:
      operationId: register
      tags:
        - identity
      summary: Create an account and sign in
      description: 'Creates an account and signs it in: the response holds a new session''s tokens. While sign-up is off, only an invitation to the address opens it: any other well-formed request answers identity.signup_disabled before the address is checked or the password looked at, so the answer never depends on whether the address is registered. Registering does not accept the invitation. The password needs 8–128 characters and must be neither a common password nor made of the address''s local part. Sign-ups have a rate limit of their own, per client IP.'
      security: []
      x-problem-codes:
        - identity.signup_disabled
        - validation_failed
        - identity.email_taken
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account exists and is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/login:
    post:
      operationId: login
      tags:
        - identity
      summary: Sign in with an e-mail address and a password
      description: 'Starts a new session and returns its tokens. An unknown address and a wrong password get the same identity.invalid_credentials; a deactivated account answers identity.account_deactivated only to the right password. Sign-ins have rate limits of their own: per client IP, and per client IP and address together.'
      security: []
      x-problem-codes:
        - identity.invalid_credentials
        - identity.account_deactivated
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The new session's tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - identity
      summary: Exchange a refresh token for the next pair
      description: 'Returns new tokens of the same session and retires the refresh token sent: the next refresh uses the refresh_token of this response. The session''s end, refresh_token_expires_at, never moves. Any refresh token but the current one of a session that has not ended answers identity.refresh_token_invalid; one this session issued before under the current signing key also ends the session, since someone else holds a copy of it. The server answers within a few seconds, before a client that waits 8 seconds gives up.'
      security: []
      x-problem-codes:
        - identity.refresh_token_invalid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session's next tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/auth/logout:
    post:
      operationId: logout
      tags:
        - identity
      summary: End the session of a refresh token
      description: Ends the session when refresh_token is its current one; its access tokens stop working at once. Any other token changes nothing and gets the same answer, which tells nothing about the token.
      security: []
      x-problem-codes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Done, whatever the token was.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Read the caller's account
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Change the caller's profile
      description: 'Changes the fields sent and answers the account. A body without any field changes nothing. The address cannot change here: the server''s administrator changes it.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: The caller's account, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/onboarding-steps:
    post:
      operationId: recordOnboardingStep
      tags:
        - identity
      summary: Record a completed onboarding step
      description: 'Adds the step to the account''s onboarding_steps and answers the account; a step recorded already changes nothing. The web app defines the steps: the server checks the id''s form, and records 32 steps at most.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStepRequest'
      responses:
        '200':
          description: The caller's account, with the step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/change-password:
    post:
      operationId: changePassword
      tags:
        - identity
      summary: Change the caller's password
      description: Replaces the password once the current one is confirmed. Every other session of the account ends; the caller's own session goes on, and a caller with a personal access token ends them all. Personal access tokens keep working. Attempts have a rate limit of their own, per account.
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - identity.current_password_incorrect
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password is changed.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/deactivate:
    post:
      operationId: deactivateMe
      tags:
        - identity
      summary: Deactivate the caller's account
      description: 'Deactivates the account: every session ends, and the personal access tokens stop working while it is inactive. Only the server''s administrator can activate it again; sign-in then answers identity.account_deactivated. No password is asked for. The modules that keep the account''s access elsewhere may refuse the deactivation with a code of their own, listed here: workspace.sole_admin when the account is the only admin of a workspace with other members, which the detail names; notebook.sole_admin when it is the only admin of a notebook with other members, which the detail counts by workspace. The deactivation ends the account''s memberships of workspaces and of their notebooks, and a notebook it was the only admin of becomes ownerless.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.sole_admin
        - notebook.sole_admin
      responses:
        '204':
          description: The account is deactivated.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/me/api-tokens:
    get:
      operationId: listApiTokens
      tags:
        - identity
      summary: List the caller's personal access tokens
      description: 'The caller''s personal access tokens that are not revoked, expired ones too, newest first. The tokens themselves are never listed: only createApiToken answers one, once.'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiToken
      tags:
        - identity
      summary: Create a personal access token
      description: 'Creates a personal access token of the caller and answers the token itself, this once. Sent as "Authorization: Bearer", it acts as the account in every operation until it expires or is revoked; it can create tokens itself. The caller''s current password is asked for, whatever the credential: a refresh token that leaks cannot become a token that never expires. Attempts have a rate limit of their own, per account.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - identity.current_password_incorrect
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: The new token, with the token itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/api-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeApiToken
      tags:
        - identity
      summary: Revoke a personal access token
      description: Revokes one of the caller's tokens, which stops working at once; a token may revoke itself. A token that does not exist, is revoked already or belongs to another account is identity.api_token_not_found.
      security:
        - bearer: []
      x-problem-codes:
        - identity.api_token_not_found
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/instance:
    get:
      operationId: getInstance
      tags:
        - instance
      summary: Describe this instance
      description: 'Reports the product, the build and the API version this instance runs, whether it is open for sign-up, and whether accounts may create workspaces. Public: needs no authentication.'
      security: []
      x-problem-codes: []
      responses:
        '200':
          description: What this instance runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInfo'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces:
    get:
      operationId: listWorkspaces
      tags:
        - workspace
      summary: List the caller's workspaces
      description: The workspaces the caller is an active member of, with the caller's role in each, by name, case-insensitively. The list is not paged.
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspace
      tags:
        - workspace
      summary: Create a workspace
      description: Creates a workspace whose admin is the caller. While creating workspaces is off on the instance (GET /instance answers workspace_creation_enabled), it answers workspace.creation_disabled before the values are looked at; the server's administrator creates workspaces with nervewiki workspaces create. A slug another workspace has is workspace.slug_taken; a reserved one is a problem of the slug field (not_allowed).
      security:
        - bearer: []
      x-problem-codes:
        - workspace.creation_disabled
        - validation_failed
        - workspace.slug_taken
        - identity.account_deactivated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The workspace, with the caller as its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: getWorkspace
      tags:
        - workspace
      summary: Get a workspace
      description: The workspace, with the caller's role. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found alike.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspace
      tags:
        - workspace
      summary: Rename a workspace
      description: Gives the workspace a new name; only its admins can. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; a member or a guest gets forbidden; the name is checked after both.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: The renamed workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteWorkspace
      tags:
        - workspace
      summary: Delete a workspace
      description: Deletes the workspace with every membership of it and its pending invitations; only its admins can. No one sees it afterwards, and its slug can name a new workspace at once. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; a member or a guest gets forbidden.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '204':
          description: The workspace is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceMembers
      tags:
        - workspace
      summary: List a workspace's members
      description: The workspace's active members, by when they joined, each with the account's display name and, unless the caller is a guest, its email. The list is not paged.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/leave:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      operationId: leaveWorkspace
      tags:
        - workspace
      summary: Leave a workspace
      description: 'Ends the caller''s membership of the workspace; pending invitations of the workspace to the caller''s address are deleted with it. The workspace''s only active admin cannot leave it, even alone in it (workspace.sole_admin): another member is made an admin first, or the workspace is deleted. Nor can the only active admin of one of its notebooks with other members (notebook.sole_admin, whose detail counts them); the caller''s notebook memberships end with it, and a notebook it was the only admin of becomes ownerless.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - workspace.sole_admin
        - notebook.sole_admin
      responses:
        '204':
          description: The caller is no longer a member.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/invitations:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listWorkspaceInvitations
      tags:
        - workspace
      summary: List a workspace's pending invitations
      description: The workspace's pending invitations, newest first, each with the token of its link; only its admins can. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; a member or a guest gets forbidden. The list is not paged.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '200':
          description: The pending invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspaceInvitation
      tags:
        - workspace
      summary: Invite an e-mail address
      description: 'Invites an e-mail address to the workspace with a role; only its admins can. The answer holds the token of the invitation''s link, which the admin sends: whoever signs in with the address and holds the link can accept it. An address with a pending invitation to the workspace is a problem of the email field (duplicate), and so is an active member''s (not_allowed). A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; a member or a guest gets forbidden; the values are checked after both.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationCreate'
      responses:
        '201':
          description: The pending invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-members/{workspace_member_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceMemberID'
    patch:
      operationId: updateWorkspaceMember
      tags:
        - workspace
      summary: Change a member's role
      description: Gives the member a new role; only the workspace's admins can, and not their own (workspace.own_membership). A membership that does not exist, has ended, or whose workspace the caller cannot see is workspace.member_not_found; a member or a guest gets forbidden; the role is checked after both.
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - workspace.member_not_found
        - forbidden
        - workspace.own_membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberUpdate'
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeWorkspaceMember
      tags:
        - workspace
      summary: Remove a member
      description: 'Ends the member''s membership, and deletes the workspace''s pending invitations to the member''s address; only the workspace''s admins can, and not their own (workspace.own_membership: an admin leaves instead). A membership that does not exist, has ended, or whose workspace the caller cannot see is workspace.member_not_found; a member or a guest gets forbidden. The member''s notebook memberships end with it, and a notebook the member was the only admin of becomes ownerless.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.member_not_found
        - forbidden
        - workspace.own_membership
      responses:
        '204':
          description: The membership has ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{workspace_invitation_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceInvitationID'
    delete:
      operationId: deleteWorkspaceInvitation
      tags:
        - workspace
      summary: Withdraw an invitation
      description: Withdraws a pending invitation, whose link stops working; only the workspace's admins can. An invitation that does not exist, is no longer pending, or whose workspace the caller cannot see is workspace.invitation_not_found; a member or a guest gets forbidden.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.invitation_not_found
        - forbidden
      responses:
        '204':
          description: The invitation is withdrawn.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{workspace_invitation_id}/preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceInvitationID'
    post:
      operationId: previewWorkspaceInvitation
      tags:
        - workspace
      summary: Show what an invitation's link invites to
      description: The workspace's name and slug, and the role; never the address invited. Anyone holding the link may ask, signed in or not. An invitation that does not exist, is no longer pending, whose workspace is deleted, or whose token is not the link's is workspace.invitation_not_found alike. It is a POST so that the token stays out of URLs and their logs.
      security: []
      x-problem-codes:
        - workspace.invitation_not_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: What the invitation invites to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-invitations/{workspace_invitation_id}/accept:
    parameters:
      - $ref: '#/components/parameters/WorkspaceInvitationID'
    post:
      operationId: acceptWorkspaceInvitation
      tags:
        - workspace
      summary: Accept an invitation
      description: 'Joins the workspace with the invitation''s role: the link''s token and the caller''s address are the credentials, the caller being no member yet. A caller signed in with another address than the one invited gets workspace.invitation_email_mismatch. A caller who is an active member already keeps their role, and the invitation is used up; one whose membership ended has it back, with the invitation''s role and when they first joined. A workspace without an active admin, its only one deactivated alone in it, admits only an admin until it has one again: a member''s or a guest''s invitation is workspace.no_admin, and stays pending. An invitation that does not exist, is no longer pending, whose workspace is deleted, or whose token is not the link''s is workspace.invitation_not_found alike.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.invitation_not_found
        - workspace.invitation_email_mismatch
        - workspace.no_admin
        - identity.account_deactivated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: The workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspace-slugs/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: checkWorkspaceSlug
      tags:
        - workspace
      summary: Tell whether a slug can name a new workspace
      description: 'Whether a new workspace can take the slug, and if not why: invalid (not 1–48 of a–z, 0–9, _ and -), reserved (a path of the site, or held for one), or taken (a workspace not deleted has it).'
      security:
        - bearer: []
      x-problem-codes: []
      responses:
        '200':
          description: Whether the slug is free.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/notebooks:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listNotebooks
      tags:
        - notebook
      summary: List the notebooks the caller sees in a workspace
      description: 'The workspace''s notebooks the caller has a role in: those it is a member of, and, for the workspace''s admins and members, those open to the workspace; each with the caller''s role in it, by name, case-insensitively. A private notebook the caller is no member of is not listed, to the workspace''s admins neither. A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found. The list is not paged.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
      responses:
        '200':
          description: The notebooks the caller sees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createNotebook
      tags:
        - notebook
      summary: Create a notebook
      description: Creates a notebook in the workspace whose admin is the caller; the workspace's admins and members can, its guests cannot (forbidden). A workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found; the values are checked after both.
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookCreate'
      responses:
        '201':
          description: The notebook, with the caller as its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebooks/{notebook_id}:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    get:
      operationId: getNotebook
      tags:
        - notebook
      summary: Get a notebook
      description: The notebook, with the caller's role in it. A notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found alike.
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
      responses:
        '200':
          description: The notebook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateNotebook
      tags:
        - notebook
      summary: Change a notebook's name or workspace access
      description: Changes the fields sent and answers the notebook; only its admins can. A body without any field changes nothing. A notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; an editor or a reader gets forbidden; the values are checked after both.
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
        - forbidden
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookUpdate'
      responses:
        '200':
          description: The notebook, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteNotebook
      tags:
        - notebook
      summary: Delete a notebook
      description: Deletes the notebook with every membership of it; only its admins can. No one sees it afterwards. A notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; an editor or a reader gets forbidden.
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
        - forbidden
      responses:
        '204':
          description: The notebook is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebooks/{notebook_id}/members:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    get:
      operationId: listNotebookMembers
      tags:
        - notebook
      summary: List a notebook's members
      description: The notebook's active members, by when they joined; any role in the notebook can list them. Those who use it by its workspace access alone are no members and are not listed. The emails go to the workspace's admins and members; a guest sees null. A notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found. The list is not paged.
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
      responses:
        '200':
          description: The notebook's members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookMemberList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addNotebookMember
      tags:
        - notebook
      summary: Add a member to a notebook
      description: 'Gives an active member of the notebook''s workspace, a guest included, a role in the notebook; only its admins can. One whose membership of the notebook ended gets it back, with this role and the time it first joined. A notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; an editor or a reader gets forbidden; the values are checked after both: user_id not_allowed when the account is no active member of the workspace, duplicate when it is a member of the notebook already.'
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
        - forbidden
        - validation_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookMemberCreate'
      responses:
        '201':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookMember'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebook-members/{notebook_member_id}:
    parameters:
      - $ref: '#/components/parameters/NotebookMemberID'
    patch:
      operationId: updateNotebookMember
      tags:
        - notebook
      summary: Change a notebook member's role
      description: Gives the member a new role; only the notebook's admins can, and not their own (notebook.own_membership). A membership that does not exist, has ended, or whose notebook the caller has no role in is notebook.member_not_found; an editor or a reader gets forbidden; the role is checked after both.
      security:
        - bearer: []
      x-problem-codes:
        - notebook.member_not_found
        - forbidden
        - validation_failed
        - notebook.own_membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotebookMemberUpdate'
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookMember'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeNotebookMember
      tags:
        - notebook
      summary: Remove a member from a notebook
      description: 'Ends the member''s membership of the notebook; only its admins can, and not their own (notebook.own_membership: an admin leaves instead). A membership that does not exist, has ended, or whose notebook the caller has no role in is notebook.member_not_found; an editor or a reader gets forbidden.'
      security:
        - bearer: []
      x-problem-codes:
        - notebook.member_not_found
        - forbidden
        - notebook.own_membership
      responses:
        '204':
          description: The membership has ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebooks/{notebook_id}/leave:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    post:
      operationId: leaveNotebook
      tags:
        - notebook
      summary: Leave a notebook
      description: 'Ends the caller''s membership of the notebook. Its only admin cannot, even alone in it (notebook.sole_admin): another member becomes an admin first, or the admin deletes the notebook. A notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; a caller who uses it by its workspace access alone, no member of it, is notebook.member_not_found.'
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
        - notebook.member_not_found
        - notebook.sole_admin
      responses:
        '204':
          description: The caller's membership has ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/ownerless-notebooks:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listOwnerlessNotebooks
      tags:
        - notebook
      summary: List a workspace's ownerless notebooks
      description: 'The workspace''s notebooks that have no active admin, the earliest to become ownerless first: their names, private ones included, go to the workspace''s admins alone, who take them over or delete them. A member or a guest of the workspace is forbidden; a workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found. The list is not paged.'
      security:
        - bearer: []
      x-problem-codes:
        - workspace.not_found
        - forbidden
      responses:
        '200':
          description: The ownerless notebooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerlessNotebookList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/ownerless-notebooks/{notebook_id}/take-over:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    post:
      operationId: takeOverNotebook
      tags:
        - notebook
      summary: Take over an ownerless notebook
      description: 'Makes the caller, an admin of the notebook''s workspace, the notebook''s admin: a membership it had ended is restored, a lower role it has is raised; the workspace access stays. The take-over is recorded in the workspace''s audit events. A notebook that does not exist, is deleted or is not ownerless, and any caller but the workspace''s admins, is notebook.not_found: no one else learns whether it is there.'
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
      responses:
        '200':
          description: The notebook, the caller its admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notebook'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/ownerless-notebooks/{notebook_id}:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    delete:
      operationId: deleteOwnerlessNotebook
      tags:
        - notebook
      summary: Delete an ownerless notebook
      description: Deletes the notebook softly, with its members, as deleteNotebook does; the purge removes it after the retention. The deletion is recorded in the workspace's audit events. A notebook that does not exist, is deleted or is not ownerless, and any caller but the workspace's admins, is notebook.not_found.
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
      responses:
        '204':
          description: The notebook is deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/workspaces/{slug}/notebook-audit-events:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      operationId: listNotebookAuditEvents
      tags:
        - notebook
      summary: List the audit events of a workspace's ownerless notebooks
      description: 'What was done with the workspace''s ownerless notebooks, newest first, a page at a time: taken over or deleted by a workspace admin, returned to their former owner. The workspace''s admins alone read them; a member or a guest is forbidden, and a workspace that does not exist, is deleted, or that the caller is no active member of is workspace.not_found. A cursor the list cannot read is bad_request, before anything else; a limit outside 1–100 is validation_failed.'
      security:
        - bearer: []
      x-problem-codes:
        - bad_request
        - workspace.not_found
        - forbidden
        - validation_failed
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotebookAuditEventPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebooks/{notebook_id}/nodes:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    get:
      operationId: listNodes
      tags:
        - page
      summary: List a notebook's tree
      description: The notebook's pages, each parent before its children, siblings in their order; any role in the notebook can list them. A notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found. The list is not paged.
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
      responses:
        '200':
          description: The tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNodeList'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebooks/{notebook_id}/pages:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    post:
      operationId: createPage
      tags:
        - page
      summary: Create a page
      description: 'Creates a page under a parent, or at the notebook''s root, with the content given, empty when none is, at revision 1; its editors and admins can, a reader cannot (forbidden). A content of more than 5 MiB (5,242,880 bytes) or with a NUL character is validation_failed first, whatever the notebook. Then a notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; the other values are checked after both: the title''s rules, a parent that is no page of the notebook and a page to follow that is no child of the parent are validation_failed; then a title a sibling has, compared by its key, is page.title_taken, and a page deeper than ten levels page.too_deep. When the server parses as much content as it can at once, a content waits a moment, then is server_busy.'
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
        - forbidden
        - validation_failed
        - page.title_taken
        - page.too_deep
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageCreate'
      responses:
        '201':
          description: The page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}:
    parameters:
      - $ref: '#/components/parameters/PageID'
    get:
      operationId: getPage
      tags:
        - page
      summary: Get a page
      description: The page, with its ancestors and what it tells of its content. A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike.
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}/content:
    parameters:
      - $ref: '#/components/parameters/PageID'
    get:
      operationId: getPageContent
      tags:
        - page
      summary: Read a page's content
      description: The page's Markdown, byte for byte as written, with its revision and hash. Any role in its notebook can read it. A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike.
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
      responses:
        '200':
          description: The page's content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContent'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putPageContent
      tags:
        - page
      summary: Write a page's content
      description: 'Replaces the page''s content, byte for byte, on the revision the writer read it at; its notebook''s editors and admins can, a reader cannot (forbidden). A content of more than 5 MiB (5,242,880 bytes) or with a NUL character is validation_failed first, whatever the page. Then a page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found; an edit session that is not the caller''s session of this page, opened from the same client (the web or a token), alive, is page.edit_session_ended; a base_revision that is not the page''s revision is page.revision_mismatch: the page was written since, and the writer reads it again. A content the page holds already writes nothing, whatever the base. The writes of one edit session are one changeset, with one version of the page, until another write of the page comes in between. When the server parses as much content as it can at once, a content waits a moment, then is server_busy.'
      security:
        - bearer: []
      x-problem-codes:
        - validation_failed
        - page.not_found
        - forbidden
        - page.edit_session_ended
        - page.revision_mismatch
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageContentWrite'
      responses:
        '200':
          description: The page, as the write leaves it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}/edit-sessions:
    parameters:
      - $ref: '#/components/parameters/PageID'
    post:
      operationId: openEditSession
      tags:
        - page
      summary: Open an edit session
      description: 'Opens the caller''s edit session of the page: a lease of 60 seconds, which a heartbeat every 20 seconds keeps alive. The content''s writes that name it are one changeset. Its notebook''s editors and admins can, a reader cannot (forbidden). A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - forbidden
      responses:
        '201':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSession'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}/view:
    parameters:
      - $ref: '#/components/parameters/PageID'
    get:
      operationId: getPageView
      tags:
        - page
      summary: Read a page
      description: 'The page''s reading view: its content rendered to HTML, its frontmatter''s properties as a table first, and the revision it was rendered from. The HTML holds only what the renderer writes and a typographic allowlist of the content''s own HTML, every address on this site, http(s) or mailto, and no image loaded. A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike. When the server parses as much content as it can at once, the page waits a moment, then is server_busy.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - server_busy
      responses:
        '200':
          description: The page's reading view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageView'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/edit-sessions/{edit_session_id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/EditSessionID'
    post:
      operationId: heartbeatEditSession
      tags:
        - page
      summary: Keep an edit session alive
      description: 'Keeps the caller''s session alive for 60 seconds from now. A session that does not exist, has expired, is someone else''s, or whose notebook the caller has no role in any more is page.edit_session_not_found alike: the editor opens a new one. One whose page the caller may only read now is forbidden.'
      security:
        - bearer: []
      x-problem-codes:
        - page.edit_session_not_found
        - forbidden
      responses:
        '200':
          description: The session, kept alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditSession'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/edit-sessions/{edit_session_id}:
    parameters:
      - $ref: '#/components/parameters/EditSessionID'
    delete:
      operationId: endEditSession
      tags:
        - page
      summary: End an edit session
      description: 'Ends the caller''s session: it asks only that the session is the caller''s and alive. A session that does not exist, has expired, or is someone else''s is page.edit_session_not_found alike, which the editor takes for ended.'
      security:
        - bearer: []
      x-problem-codes:
        - page.edit_session_not_found
      responses:
        '204':
          description: The session is ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/nodes/{node_id}:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    patch:
      operationId: renameNode
      tags:
        - page
      summary: Rename a page
      description: 'Renames the page; its notebook''s editors and admins can, a reader cannot (forbidden). A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found; the name is checked after both: its rules are validation_failed, a name a sibling has, compared by its key, is page.title_taken. The page''s own name writes nothing; one that differs from it in case alone is written.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - forbidden
        - validation_failed
        - page.title_taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRename'
      responses:
        '200':
          description: The page, renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteNode
      tags:
        - page
      summary: Delete a page
      description: 'Deletes the page with every page under it, at one time: they go to the trash together. Its notebook''s editors and admins can, a reader cannot (forbidden). A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - forbidden
      responses:
        '204':
          description: The page and the pages under it are deleted.
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/nodes/{node_id}/move:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    post:
      operationId: moveNode
      tags:
        - page
      summary: Move a page
      description: 'Moves the page with every page under it: under another parent, to the notebook''s root, or among its siblings. Its notebook''s editors and admins can, a reader cannot (forbidden). A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found; the destination is checked after both: a parent that is no page of the notebook and a page to follow that is no other child of the parent are validation_failed; then a parent that is the page itself or under it is page.cycle, a title a new sibling has, compared by its key, page.title_taken, and a page under it that would be deeper than ten levels page.too_deep. A move to where the page is writes nothing.'
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
        - forbidden
        - validation_failed
        - page.cycle
        - page.title_taken
        - page.too_deep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeMove'
      responses:
        '200':
          description: The page, moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token (JWT) from register, login or refresh, or a personal access token (nwk_pat_) from createApiToken.
  schemas:
    SignupInvitation:
      description: The invitation to a workspace whose link the registration came by, as the link carries it. While sign-up is off, an invitation still pending, of a workspace not deleted and sent to the address lets the address register.
      type: object
      additionalProperties: false
      required:
        - id
        - token
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: The sign-in address; stored trimmed and in lower case.
          type: string
          format: email
        password:
          type: string
        invitation:
          $ref: '#/components/schemas/SignupInvitation'
    FieldError:
      description: One invalid field of a request. Clients show text looked up by `code`; `message` is an English explanation for developers. Must match httpserver.FieldError and the field codes of internal/shared.
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          description: The field's path in the request, e.g. title or properties.status. A path longer than 256 bytes is cut short and ends with `…`.
          type: string
        code:
          description: What is wrong with the field.
          type: string
          enum:
            - required
            - invalid_format
            - too_short
            - too_long
            - out_of_range
            - not_allowed
            - duplicate
            - common_password
        message:
          type: string
    Problem:
      description: RFC 9457 problem details. `title` is the HTTP status phrase, `detail` explains this occurrence, and clients branch on `code`. Must match httpserver.Problem; the platform's contract test checks it.
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - title
      properties:
        status:
          description: HTTP status code.
          type: integer
        code:
          description: Stable error code. Platform codes have no prefix (bad_request, unauthorized, forbidden, not_found, payload_too_large, validation_failed, rate_limited, server_busy, internal_error, not_ready); module codes are prefixed with the module that refuses, e.g. page.locked. Each operation lists the codes it can answer in x-problem-codes.
          type: string
        title:
          description: HTTP status phrase, e.g. "Not Found".
          type: string
        detail:
          description: What went wrong in this occurrence.
          type: string
        errors:
          description: The invalid fields of the request.
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    AuthTokens:
      description: 'A session''s tokens. Send access_token as "Authorization: Bearer"; access_token_expires_in counts from the response, so a client''s clock does not matter. When it expires, exchange refresh_token for the next pair at POST /api/v0/auth/refresh.'
      type: object
      additionalProperties: false
      required:
        - token_type
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_at
      properties:
        token_type:
          type: string
          enum:
            - Bearer
        access_token:
          type: string
        access_token_expires_in:
          description: Seconds from this response until the access token expires.
          type: integer
        refresh_token:
          description: An opaque nwk_rt_ token.
          type: string
        refresh_token_expires_at:
          description: When the session ends; refreshing never extends it.
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          description: 'The sign-in address, in any case, with or without surrounding blanks. It is not checked for form: an address no account has answers identity.invalid_credentials.'
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          description: The refresh_token of the session's last AuthTokens.
          type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
