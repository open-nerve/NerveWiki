  /api/v0/notebooks/{notebook_id}/pages:
    parameters:
      - $ref: '#/components/parameters/NotebookID'
    post:
      operationId: createPage
      tags:
        - page
      summary: Create a page
      description: 'Creates a page under a parent, or at the notebook''s root, with the content given, empty when none is, at revision 1; its editors and admins can, a reader cannot (forbidden). A content of more than 5 MiB (5,242,880 bytes) or with a NUL character is validation_failed first, whatever the notebook. Then a notebook that does not exist, is deleted, or that the caller has no role in is notebook.not_found; the other values are checked after both: the title''s rules, a parent that is no page of the notebook and a page to follow that is no child of the parent are validation_failed; then a title a sibling has, compared by its key, is page.title_taken, and a page deeper than ten levels page.too_deep. When the server parses as much content as it can at once, a content waits a moment, then is server_busy. A body that has not all arrived within the server''s read timeout (server.read_timeout, 30 seconds by default, in which 5 MiB needs about 1.4 Mbit/s) is bad_request.'
      security:
        - bearer: []
      x-problem-codes:
        - notebook.not_found
        - forbidden
        - validation_failed
        - page.title_taken
        - page.too_deep
        - server_busy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageCreate'
      responses:
        '201':
          description: The page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/pages/{page_id}:
    parameters:
      - $ref: '#/components/parameters/PageID'
    get:
      operationId: getPage
      tags:
        - page
      summary: Get a page
      description: The page, with its ancestors and what it tells of its content. A page that does not exist, is deleted, or whose notebook the caller has no role in is page.not_found alike.
      security:
        - bearer: []
      x-problem-codes:
        - page.not_found
      responses:
        '200':
          description: The page.
