  /api/v0/assets/{node_id}/content:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getAssetContent
      tags:
        - asset
      summary: Download an attachment's content
      description: 'The attachment''s file, at the address getAsset, listAssets, uploadAsset, getPageView (in its HTML) and getPageProperties (a link''s url) sign: anyone who has the address can open it, without a token, until it expires. The address is read as the server writes it: the path''s id, then the query b, e, s and, to download whatever the type, d=1, in this order, each once, nothing escaped; anything else, a signature that does not match, an address expired, and an attachment deleted since are not_found, alike. An image, an audio, a video or a PDF is shown, any other file downloaded, under its name; every answer is sandboxed (Content-Security-Policy) and readable by no other site, and a file''s is cached privately until the address expires. Ranges and the conditions on a copy the client holds are answered (206, 304, 416); what an address serves never changes, so a condition on a change (If-Match, If-Unmodified-Since) is passed by. The addresses share a bucket of their own, by client IP (rate_limited). A download still sending when the server shuts down is cut off; one asked for then is server_busy.'
      security: []
      x-raw: true
      x-problem-codes:
        - not_found
        - server_busy
      parameters:
        - name: b
          in: query
          required: true
          description: The file's id, as the signed address has it.
          schema:
            type: string
        - name: e
          in: query
          required: true
          description: When the address expires, in Unix seconds, as the signed address has it.
          schema:
            type: string
        - name: s
          in: query
          required: true
          description: The address's signature.
          schema:
            type: string
        - name: d
          in: query
          description: 1 to download the file whatever its type, as the download address has it.
          schema:
            type: string
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/CrossOriginResourcePolicy'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: The range of the file asked for.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/CrossOriginResourcePolicy'
            Content-Range:
              description: The range sent, and the file's size; for several ranges, sent as multipart/byteranges, each part has its own instead.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: The file has not changed since the copy the request names.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
        '416':
          description: No range asked for is in the file; Content-Range tells its size.
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
            Content-Range:
              description: The file's size, as bytes */<size>.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /api/v0/notebooks/{notebook_id}/exports:
