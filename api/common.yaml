# 各模块共用的组件，Go 类型生成在 server/internal/platform/httpserver/apigen（make gen-go）。
# 模块这样引用：$ref: '../common.yaml#/components/schemas/<名字>'。
# 只放 schemas 和 parameters，不放 responses：跨文件引用 response 时，oapi-codegen
# 要求共享包也生成 strict server，生成的代码编译失败。
openapi: 3.1.0
info:
  title: Nerve Wiki common components
  version: v0
components:
  # Paging (v0.1 design 6.1): each paged list takes Limit and Cursor, and answers next_cursor as NextCursor.
  parameters:
    Limit:
      name: limit
      in: query
      description: >-
        The page size, 1–100; 50 when absent. Outside that range the answer is
        422 validation_failed on limit.
      schema:
        type: integer
    Cursor:
      name: cursor
      in: query
      description: >-
        The next_cursor of the page before; absent for the first page. A
        cursor that does not decode, has an unknown version or a payload of
        another shape than this list's, or is not spelled as the server
        writes it is 400 bad_request on cursor.
      schema:
        type: string
  schemas:
    NextCursor:
      description: The cursor of the next page; null on the last page.
      type: [string, "null"]
    Problem:
      description: >-
        RFC 9457 problem details. `title` is the HTTP status phrase, `detail`
        explains this occurrence, and clients branch on `code`. Must match
        httpserver.Problem; the platform's contract test checks it.
      type: object
      additionalProperties: false
      required: [status, code, title]
      properties:
        status:
          description: HTTP status code.
          type: integer
        code:
          description: >-
            Stable error code. Platform codes have no prefix (bad_request,
            unauthorized, forbidden, not_found, payload_too_large,
            validation_failed, rate_limited, server_busy, internal_error,
            not_ready, storage_full); module codes are prefixed with the module that
            refuses, e.g. page.locked. Each operation lists the codes it can
            answer in x-problem-codes.
          type: string
        title:
          description: HTTP status phrase, e.g. "Not Found".
          type: string
        detail:
          description: What went wrong in this occurrence.
          type: string
        errors:
          description: The invalid fields of the request.
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        lock:
          $ref: "#/components/schemas/PageLock"
          description: >-
            The edit lock page.locked names: the page locked and who holds it
            (the caller themself when they hold it elsewhere). No other code
            carries it.
        locks:
          description: >-
            The edit locks linking.pages_locked names, one a page: each page
            whose links a rename or move would write again and who edits it
            (the caller themself when they edit it). No other code carries
            it.
          type: array
          items:
            $ref: "#/components/schemas/PageLock"
        ended_by:
          description: >-
            Who ended the caller's edit session: page.edit_session_unlocked
            names the notebook's admin who unlocked it. No other code carries
            it.
          type: object
          additionalProperties: false
          required: [user_id, display_name]
          properties:
            user_id:
              type: string
              format: uuid
            display_name:
              type: string
        root_id:
          description: >-
            The root of the trash item a node was deleted with:
            page.not_trash_root names it, the item to restore. No other code
            carries it.
          type: string
          format: uuid
        conflicts:
          description: >-
            The nodes that keep a revert from its changeset, page.revert_conflict's:
            by reason in the order of RevertConflict's, then by node id, the
            first 100 of conflict_count. No other code carries it.
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/RevertConflict"
        conflict_count:
          description: >-
            How many conflicts keep the revert, page.revert_conflict's: conflicts
            lists the first 100. No other code carries it.
          type: integer
          minimum: 1
    PageLock:
      description: >-
        An edit lock: the page locked and who holds it, by their display name
        as of the answer.
      type: object
      additionalProperties: false
      required: [page_id, user_id, display_name]
      properties:
        page_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
    TrashPlacement:
      description: >-
        Where a restore puts a trash item: under its parent where it was, original (parent_id null when it was at
        the root), or last at the notebook's root, parent_id null, its parent being in the trash (parent_in_trash)
        or its pages too deep under it (too_deep).
      type: object
      additionalProperties: false
      required: [parent_id, reason]
      properties:
        parent_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: string
          enum: [original, parent_in_trash, too_deep]
    RevertConflict:
      description: >-
        A node that keeps a revert from its changeset (page.revert_conflict).
        reason, in the order the conflicts are listed: changed (the node is
        no longer as the changeset left it: changed, moved, deleted or
        restored since, its trash item another, or its content written);
        expired (a trash item the changeset deleted is past the time it can
        be restored in); parent_gone (the node would go back under a parent
        that is in the trash or purged); children_added (another changeset
        put the node under one the revert would delete: it would go with
        it); title_taken (the node would go back to a name another node
        holds under its parent there: holder_id); cycle (the node would go
        back under itself); too_deep (pages would nest deeper than 10 levels
        under the node).
      type: object
      additionalProperties: false
      required: [node_id, name, reason]
      properties:
        node_id:
          type: string
          format: uuid
        name:
          description: >-
            The node's name where the revert would put it, the name contended
            for by title_taken; its name now when the revert would leave it
            nowhere.
          type: string
        reason:
          type: string
          enum: [changed, expired, parent_gone, children_added, title_taken, cycle, too_deep]
        holder_id:
          description: The node holding the name, title_taken's alone.
          type: string
          format: uuid
    UserRef:
      description: >-
        An account, by its id and its display name, as of the answer: who
        made a changeset, holds a lock, started a job or deleted a node.
      type: object
      additionalProperties: false
      required: [user_id, display_name]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
    FieldError:
      description: >-
        One invalid field of a request. Clients show text looked up by `code`;
        `message` is an English explanation for developers. Must match
        httpserver.FieldError and the field codes of internal/shared.
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          description: >-
            The field's path in the request, e.g. title or properties.status.
            A path longer than 256 bytes is cut short and ends with `…`. The
            empty path is the request body itself: a JSON body of more than
            1,000 JSON values (each object, array, string, number, true, false
            and null is one) is bad_request with this one field, too_long,
            read no further.
          type: string
        code:
          description: What is wrong with the field.
          type: string
          enum:
            - required
            - invalid_format
            - too_short
            - too_long
            - out_of_range
            - not_allowed
            - duplicate
            - common_password
        message:
          type: string
