# linking 模块的接口：链接索引的读——反链、页面属性、标签、链接目标（M6/P5），链接的落点（M6/P6）。生成的 Go 代码在
# server/internal/modules/linking/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve Wiki linking API
  version: v0
paths:
  /api/v0/pages/{page_id}/backlinks:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: listBacklinks
      tags: [linking]
      summary: List the pages that link to a page
      description: >-
        The pages whose links resolve to this page, the page itself left out,
        by id, a page at a time; each with how many of its links lead here,
        and the line of each of its first 10, one a line, as written: of a
        line of more than 240 bytes, at most 240 of them with the link, cut
        on characters, an ellipsis (…) where it is cut. A page written or
        deleted since the index read it has no lines; the links event that
        follows says to read again. So has a page the index read with an
        older extraction, before nervewiki reindex, and every page
        after 32 MiB of contents are read for the lines of one answer. Any
        role in the page's notebook can read them. A cursor
        the list cannot read is bad_request, before anything else; a page
        that does not exist, is deleted, or whose notebook the caller has no
        role in is page.not_found; a limit outside 1–100 is
        validation_failed. Pages the index does not have, before nervewiki
        reindex after an upgrade, are not among them.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, page.not_found, validation_failed]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the pages that link here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/properties:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getPageProperties
      tags: [linking]
      summary: Read a page's properties
      description: >-
        The page's frontmatter properties as the link index has them, and
        where each of its property links resolves. Any role in its notebook
        can read them. A page that does not exist, is deleted, or whose
        notebook the caller has no role in is page.not_found. A page the
        index does not have, before nervewiki reindex after an upgrade, has
        a valid frontmatter and no properties.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found]
      responses:
        "200":
          description: The page's properties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProperties"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/tags:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: listTags
      tags: [linking]
      summary: List a notebook's tags
      description: >-
        The tags of the notebook's pages, the body's and the frontmatter's,
        one a tag, which tags compare by case-folded, in the order of that
        key's bytes; each as most of its pages write it, and how many pages
        have it. Of a page's tags, its first 1000 are kept. A nested tag (a/b) is one of its own: its parent is listed
        only when a page has the parent itself. Any role in the notebook can
        list them. A notebook that does not exist, is deleted, or that the
        caller has no role in is notebook.not_found. The list is not paged.
        The tag "/" (#//) is listed, though getTag cannot name it.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "200":
          description: The notebook's tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/tags/{tag}:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
      - $ref: "#/components/parameters/Tag"
    get:
      operationId: getTag
      tags: [linking]
      summary: List the pages with a tag
      description: >-
        The ids of the notebook's pages with the tag, in any case, or a tag
        under it (tag/…), by id. Of a page's tags, its first 1000 are kept:
        a page with the tag past them is not listed. A tag that no page could
        have, such as one with a space or a '#', has none. Any role in the
        notebook can list
        them. A notebook that does not exist, is deleted, or that the caller
        has no role in is notebook.not_found. The list is not paged.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "200":
          description: The pages with the tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPageList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/link-targets:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: listLinkTargets
      tags: [linking]
      summary: List what a notebook's links may lead to
      description: >-
        The notebook's pages and attachments with an extension, for the
        editor's completion, by id: each with its kind, its title or name,
        how a wikilink is written to lead to it alone from anywhere in the
        notebook, as a rename writes it again, and a page's aliases. An
        attachment without an extension, which no link leads to, is not
        listed. Any role in the notebook can list them. A notebook that does
        not exist, is deleted, or that the caller has no role in is
        notebook.not_found. The list is not paged.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "200":
          description: The notebook's link targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTargetList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/link-landing:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getLinkLanding
      tags: [linking]
      summary: Read where a page made for a link would go
      description: >-
        Where a page made for a link's target, written in this page, would
        go so that the link then leads to it: under which page, null for the
        notebook's root, and titled what, the target's last segment as
        written without ".md". createPage makes it. A target that leads to a
        page already answers that page instead; one with no such place
        answers why: target_invalid, it has an empty segment, a "." or ".."
        past its head, a NUL, or bytes that are not UTF-8; title_invalid,
        its last segment is no title; target_is_asset, it is read as an
        attachment's, its last segment, not written with ".md", the title
        key of an attachment of the notebook with an extension, which it
        leads to or not, or an attachment where the page would go has its
        title; parent_missing, no page is where its other segments lead,
        read from this page's folder for "./" and "../", from the root for
        "/", else as links resolve but not by aliases; too_deep, the page
        made would be deeper than pages nest; not_resolvable, the target
        would not lead to the page made, or not to it alone. The notebook's
        admins and editors can read it. A page that does not exist, is
        deleted, or whose notebook the caller has no role in is
        page.not_found; then a role that does not write is forbidden; then
        a target absent or longer than 4096 bytes is validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden, validation_failed]
      parameters:
        - name: target
          in: query
          description: >-
            The link's target as the reading view carries it
            (data-nw-target): a wikilink's as written, a Markdown link's
            decoded, without its anchor or display text; at most 4096 bytes.
            Absent is validation_failed on target.
          schema:
            type: string
      responses:
        "200":
          description: Where the page made would go, the page there, or why neither.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkLanding"
        default:
          $ref: "#/components/responses/Problem"
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    NotebookID:
      name: notebook_id
      in: path
      required: true
      description: The notebook's id.
      schema:
        type: string
        format: uuid
    PageID:
      name: page_id
      in: path
      required: true
      description: The page's id.
      schema:
        type: string
        format: uuid
    Tag:
      name: tag
      in: path
      required: true
      description: >-
        A tag's name, without its '#', as listTags writes it and a reading
        view's tag link carries it; a nested tag's '/' is written %2F
        (a%2Fb). The tag "/" alone cannot be named: the path reads its %2F
        as a trailing slash, a path no operation has (404 not_found).
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    BacklinkPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Backlink"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
    Backlink:
      description: A page that links to another.
      type: object
      additionalProperties: false
      required: [id, count, contexts]
      properties:
        id:
          description: The page with the links.
          type: string
          format: uuid
        count:
          description: >-
            How many of its links lead to the other page, counted up to 1000:
            1000 is as many or more.
          type: integer
          minimum: 1
          maximum: 1000
        contexts:
          description: >-
            The lines of its first 10 links there, by where they are written,
            one a line; none in the cases the operation lists.
          type: array
          maxItems: 10
          items:
            type: string
    PageProperties:
      type: object
      additionalProperties: false
      required: [valid, properties, links, assets_expire_at]
      properties:
        valid:
          description: >-
            Whether the page's frontmatter is valid; a page without one is. An
            invalid one has no properties.
          type: boolean
        properties:
          description: The frontmatter's properties, in the order written.
          type: array
          items:
            $ref: "#/components/schemas/PageProperty"
        links:
          description: The property links, by where they are written.
          type: array
          items:
            $ref: "#/components/schemas/PropertyLink"
        assets_expire_at:
          description: >-
            When the earliest of the links' attachments' addresses expires, after which the properties are to be read
            again; null for none.
          type: [string, "null"]
          format: date-time
    PageProperty:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key:
          type: string
        value:
          description: >-
            The property's value as JSON; an object's keys are not in the
            order written.
    PropertyLink:
      description: A property whose value, or an item of whose list, is a link.
      type: object
      additionalProperties: false
      required: [key, node_id, kind, url, inline]
      properties:
        key:
          description: The property's path, a list's item after a dot (sources.0).
          type: string
        node_id:
          description: The page or the attachment the link resolves to; null for none.
          type: [string, "null"]
          format: uuid
        kind:
          description: What node_id is; null when it is null.
          anyOf:
            - $ref: "#/components/schemas/LinkTargetKind"
            - type: "null"
        url:
          description: >-
            The address of an attachment's content, signed, a path of this site, as the attachment's content_url is:
            it expires as that does, and a read of the properties signs it anew. Null for a page, for none, and
            for an attachment deleted since the link was indexed.
          type: [string, "null"]
        inline:
          description: >-
            Whether the browser shows the content at url itself, which opens in a tab of its own, or downloads it:
            as the attachment's mime says (an image, an audio, a video or a PDF the server shows). Null when url is
            null.
          type: [boolean, "null"]
    TagList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TagCount"
    TagCount:
      type: object
      additionalProperties: false
      required: [tag, count]
      properties:
        tag:
          description: The tag, without its '#'.
          type: string
        count:
          description: How many pages have it.
          type: integer
          minimum: 1
    TagPageList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TagPage"
    TagPage:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    LinkTargetKind:
      description: What a link target is, a page or an attachment.
      type: string
      enum: [page, asset]
    LinkTargetList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LinkTarget"
    LinkTarget:
      type: object
      additionalProperties: false
      required: [id, kind, name, link, aliases]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LinkTargetKind"
        name:
          description: The page's title; the attachment's name, with its extension.
          type: string
        link:
          description: >-
            How a wikilink is written to lead to the node alone, from
            anywhere in the notebook: its title or name, or its path from the
            root where another node of its kind has its title; with ".md"
            after the path where it would be read otherwise, a page's whose
            title ends with ".md" as another page's without it, a page's
            whose title an attachment has as the attachment's.
          type: string
        aliases:
          description: >-
            The page's aliases, its first 1000, in the order of their
            case-folded keys; none for an attachment.
          type: array
          maxItems: 1000
          items:
            type: string
    LinkLanding:
      description: Exactly one of node_id, landing and reason is not null.
      type: object
      additionalProperties: false
      required: [node_id, landing, reason]
      properties:
        node_id:
          description: The page the target leads to already; null for none.
          type: [string, "null"]
          format: uuid
        landing:
          description: Where the page made would go; null for nowhere.
          anyOf:
            - $ref: "#/components/schemas/Landing"
            - type: "null"
        reason:
          description: Why the target has no landing; null when it has one.
          anyOf:
            - $ref: "#/components/schemas/LandingReason"
            - type: "null"
    Landing:
      description: Where a page made for a link would go.
      type: object
      additionalProperties: false
      required: [parent_id, title]
      properties:
        parent_id:
          description: The page it would go under; null for the notebook's root.
          type: [string, "null"]
          format: uuid
        title:
          description: Its title, as createPage takes it.
          type: string
    LandingReason:
      description: Why a link's target has no landing; the operation says each.
      type: string
      enum: [target_invalid, title_invalid, target_is_asset, parent_missing, too_deep, not_resolvable]
