# transfer 模块的接口：笔记本的导出（M7/P5）与导入（P6）的任务。开始导入（上传 zip）与下载导出的 zip 是原样的操作（x-raw）：
# 处理器是模块手写的，逐字节读写，不进代码生成（oapi-codegen.yaml 的 exclude-operation-ids）；其余的生成在
# server/internal/modules/transfer/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve Wiki transfer API
  version: v0
paths:
  /api/v0/notebooks/{notebook_id}/exports:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: startExport
      tags: [transfer]
      summary: Export a notebook, or a page and its subtree
      description: >-
        Starts a job that writes the notebook, or the page root_id and its
        subtree, as a zip archive laid out as an Obsidian vault: a root
        folder named after the notebook or the page, a page as its file
        <title>.md and its children in the folder <title>/, an attachment
        as its file in its page's folder, and .nerve/meta.json with the
        siblings' order. Any role in the notebook can export it. The job
        is queued, and runs in the background: read it with getTransferJob
        until it ends. A notebook that does not exist, is deleted, or that
        the caller has no role in is notebook.not_found; a root_id that is
        no page of the notebook, or a deleted one, is page.not_found; an
        export of the caller's queued or running in the notebook is
        transfer.busy; as many jobs queued or running, with the imports
        uploading, as the instance takes is server_busy; a server whose
        storage keeps no more room, the imports' uploads counted, is
        storage_full.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, page.not_found, transfer.busy, server_busy, storage_full]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportStart"
      responses:
        "202":
          description: The export's job, queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferJob"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/imports:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: startImport
      tags: [transfer]
      summary: Import a vault into a notebook
      description: >-
        Uploads a zip archive of an Obsidian vault, or of any folder of
        Markdown files, and starts a job that imports it into the notebook,
        at its root or under a page, after the children there: a file X.md
        is the page X, a folder X/ holds its children (X a page without
        content when there is no X.md beside it), any other file is an
        attachment of the page whose folder holds it. Hidden files and
        folders (.obsidian, .trash, .DS_Store...), __MACOSX and Thumbs.db
        are left out; a single folder at the archive's top that holds
        .obsidian or .nerve is the vault itself. The siblings come in the
        order the vault's .nerve/meta.json gives, then by name. A name that
        is no title is mended, a name a sibling has is numbered, each
        reported renamed. The archive is read whole before anything is
        written: an archive that is no zip, of more entries than the
        instance takes, or that unpacks to more than it takes fails the job,
        nothing written; an entry that cannot be imported is skipped and
        reported. The nodes are written in batches, each at once: a cancel
        stops the job between two, what was written kept.
        The notebook's editors and admins can import, a reader cannot
        (forbidden). The body is multipart/form-data whose parts are
        parent_id and file, in that order, the first optional: an unknown
        part, one twice, one out of order, a part after the file, a
        parent_id that is no id, more than 4 KiB read before the file's
        bytes, no file, and a body that goes on after the form past the
        limit are bad_request. Each part is read as sent: a
        Content-Transfer-Encoding is not decoded.
        Before the file is read, a notebook that does not exist, is deleted,
        or that the caller has no role in is notebook.not_found; a parent_id
        that is no page of the notebook, or a deleted one, is
        page.not_found; a job that writes the notebook's tree (an import,
        a restore or a revert) queued or running, or an import uploading or
        a restore's or a revert's start under way into it, anyone's, is
        transfer.busy; as many jobs queued or
        running, with the imports uploading, as the instance takes is
        server_busy; a server whose storage would keep too little room once
        the body's declared length, and what the other uploads have yet to
        store, is stored is storage_full; a body whose
        declared length is past the limit is payload_too_large: a client
        answered before it sent its file may see the connection reset, and
        checks these first. A file larger than the instance's
        import_max_bytes is payload_too_large; one that does not arrive at
        the instance's lowest rate is cut off, as is one still arriving when
        the server shuts down. A file the storage runs out of room for is
        storage_full. The checks but the storage's are made again as the
        job is created. The job is named after the file, its root_id is the
        parent; it runs in the background: read it with getTransferJob
        until it ends.
      security: [{ bearer: [] }]
      x-raw: true
      x-problem-codes: [notebook.not_found, forbidden, page.not_found, transfer.busy, server_busy, storage_full]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                parent_id:
                  description: The page to import under; none imports at the notebook's root.
                  type: string
                  format: uuid
                file:
                  description: The zip archive, the last part.
                  type: string
                  format: binary
      responses:
        "202":
          description: The import's job, queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferJob"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/trash-restores:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: startTrashRestore
      tags: [transfer]
      summary: Restore a trash item in the background
      description: >-
        Starts a job that restores the trash item of the root node_id, a
        page with what was deleted with it or an attachment, of any size,
        as restoreNode does one a request holds: where the root goes, its
        parent alive where it was, or the notebook's root; its name
        numbered when a sibling there holds it. The job restores the item
        in batches, its root first, then the rest depth first, each batch
        a unit of one changeset, a trash_restore, which the job's
        changeset_id names: between two batches, the nodes left in the
        trash under those restored are trash items of their own, each
        restorable alone, which the job skips when someone restored them
        first. Each batch checks its nodes again: the item's time to be
        restored in (restore_expired), its root unchanged (trash_changed),
        a parent restored and deleted or moved too deep since (tree_changed);
        a name a sibling took since is numbered. The job stops at the first,
        what it restored kept; its changeset can be reverted as any other
        (within the background revert's bound of items). The notebook's
        editors and admins can restore, a reader cannot (forbidden). In
        this order: a notebook that does not exist, is deleted, or that the
        caller has no role in is notebook.not_found; a reader forbidden; a
        node of no notebook, of another, or purged page.not_found; an alive
        node page.not_in_trash; a node deleted with another root
        page.not_trash_root; an item past the time it can be restored in
        page.restore_expired; a job that writes the notebook's tree
        (an import, a restore or a revert) queued or running, or an import
        uploading or another start under way into it, anyone's,
        transfer.busy; as many jobs queued or running, with the imports
        uploading, as the instance takes server_busy. The checks but the
        item's are made again as the job is created. The job is named after
        the item, its root_id is the item's root; it runs in the background:
        read it with getTransferJob until it ends.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          notebook.not_found,
          forbidden,
          page.not_found,
          page.not_in_trash,
          page.not_trash_root,
          page.restore_expired,
          transfer.busy,
          server_busy,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrashRestoreStart"
      responses:
        "202":
          description: The restore's job, queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferJob"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/reverts:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: startRevert
      tags: [transfer]
      summary: Revert a changeset in the background
      description: >-
        Starts a job that reverts the changeset changeset_id of the
        notebook as revertChangeset does one a request holds, of up to the
        instance's bound of items, whatever its pages, bytes, history or
        steps: revertChangeset's checks are made first, in the request,
        but past its unit's bounds; a changeset of more items than the
        bound is page.revert_too_large, which no job reverts. The job
        reverts it in batches of the round's steps, puts, deletions, a
        group's nodes restored, pages written back, each batch a unit of
        one changeset, a revert of it with the message, which the job's
        changeset_id names; each batch plans its own steps again, under the
        lock: a node changed since stops the job (revert_conflict, the
        report's conflicts), as does a page of the batch an edit session
        holds (page_locked, the report's lock) and a changeset the purge
        trimmed (changeset_trimmed); a top deleted goes to the trash whole;
        a group restored past one batch is restored depth first, a member
        someone restored where it goes skipped. What the job reverted is
        kept as it stops; its changeset can be reverted. The notebook's
        editors and admins can revert, a reader cannot (forbidden). In this
        order: a message that breaks its rules is validation_failed; a
        notebook that does not exist, is deleted, or that the caller has no
        role in is notebook.not_found; a reader forbidden; a changeset of
        no notebook or of another page.changeset_not_found; one the purge
        trimmed page.changeset_trimmed; one of more items than the bound
        page.revert_too_large; then, before anything else is read, a job
        that writes the notebook's tree queued or running, or an import
        uploading or another start under way into it, transfer.busy; then
        as revertChangeset reads it (gone meanwhile: notebook.not_found or
        forbidden as first, else page.changeset_trimmed): the conflicts
        (page.revert_conflict with conflicts and conflict_count), a version
        the purge took (page.changeset_trimmed); a page the revert deletes
        another account's edit session holds, or a page it writes back any
        session holds, the first in the round's order (page.locked with
        lock); as many jobs queued or running, with the imports uploading,
        as the instance takes server_busy. The checks but the changeset's
        are made again as the job is created. The job is named after the
        changeset's kind, its target_changeset_id is the changeset; it runs
        in the background: read it with getTransferJob until it ends.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          validation_failed,
          notebook.not_found,
          forbidden,
          page.changeset_not_found,
          page.changeset_trimmed,
          page.revert_too_large,
          transfer.busy,
          page.revert_conflict,
          page.locked,
          server_busy,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertStart"
      responses:
        "202":
          description: The revert's job, queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferJob"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/transfer-jobs:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: listTransferJobs
      tags: [transfer]
      summary: List a notebook's jobs
      description: >-
        The notebook's imports, exports, background restores and reverts,
        the newest first, a page at a time, without their reports' problems
        and conflicts: the caller's own, or every one for the notebook's
        admins. Any
        role in the notebook can list them. A cursor the list cannot read
        is bad_request, before anything else; a notebook that does not
        exist, is deleted, or that the caller has no role in is
        notebook.not_found; a limit outside 1–100 is validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, notebook.not_found, validation_failed]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferJobPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/transfer-jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getTransferJob
      tags: [transfer]
      summary: Read a job
      description: >-
        The job, its progress, its report's problems, and a revert's
        conflicts, once it ended, and an export's archive's address once it
        succeeded. Its starter and the
        notebook's admins can read it. A job that does not exist, is
        deleted with its notebook, is of a notebook the caller has no role
        in, or is another's to one who is not the notebook's admin is
        transfer.not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [transfer.not_found]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferJobDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/transfer-jobs/{job_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: cancelTransferJob
      tags: [transfer]
      summary: Cancel a job
      description: >-
        Cancels the job: a queued one at once, a running one at its next
        heartbeat, within about a second, its state then cancelled, its
        report telling what it did, an export's archive not kept; a running
        job that ends first ends as it would have. Its starter and the notebook's
        admins can cancel it; one not found is transfer.not_found as
        getTransferJob's; a job that has ended is transfer.not_cancellable.
        A running job's cancel asked again is the first's.
      security: [{ bearer: [] }]
      x-problem-codes: [transfer.not_found, transfer.not_cancellable]
      responses:
        "200":
          description: The job, as the cancel left it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferJob"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/transfer-jobs/{job_id}/download:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: downloadExport
      tags: [transfer]
      summary: Download an export's archive
      description: >-
        The export's zip archive, at the address getTransferJob and
        listTransferJobs sign: anyone who has the address can download it,
        without a token, until it expires. A path whose id is no uuid is
        bad_request; otherwise the address is read as the server writes
        it: the path's id, then the query e and s, in this order, each
        once, nothing escaped; anything else, a signature that does not
        match, an address expired, and a job deleted or expired since are
        not_found, alike. A range is answered (206, 416; If-Range by
        date), a Range of several ranges passed by, the whole archive sent
        (200); a copy as new as the archive is not sent again (304:
        If-Modified-Since when no If-None-Match is sent, or If-None-Match
        as *, there being no ETag);
        If-Match and If-Unmodified-Since are ignored, as an address's
        archive never changes. The downloads count against the instance's
        limit of requests without a token, by client address. A download
        still sending when the server shuts down is cut off; one asked for
        then is server_busy.
      security: []
      x-raw: true
      x-problem-codes: [not_found, server_busy]
      parameters:
        - name: e
          in: query
          required: true
          description: When the address expires, in Unix seconds, as the signed address has it.
          schema:
            type: string
        - name: s
          in: query
          required: true
          description: The address's signature.
          schema:
            type: string
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ArchiveDisposition"
            Content-Security-Policy:
              $ref: "#/components/headers/ArchivePolicy"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "206":
          description: The range of the archive asked for.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ArchiveDisposition"
            Content-Security-Policy:
              $ref: "#/components/headers/ArchivePolicy"
            Content-Range:
              description: The range sent, and the archive's size.
              required: true
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "304":
          description: The archive has not changed since the copy the request names (If-Modified-Since), or If-None-Match is *.
          headers:
            Content-Security-Policy:
              $ref: "#/components/headers/ArchivePolicy"
        "416":
          description: No range asked for is in the archive; Content-Range tells its size.
          headers:
            Content-Security-Policy:
              $ref: "#/components/headers/ArchivePolicy"
            Content-Range:
              description: The archive's size, as bytes */<size>.
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    NotebookID:
      name: notebook_id
      in: path
      required: true
      description: The notebook's id.
      schema:
        type: string
        format: uuid
    JobID:
      name: job_id
      in: path
      required: true
      description: The job's id.
      schema:
        type: string
        format: uuid
  headers:
    ArchiveDisposition:
      description: >-
        attachment, with the archive's name: the notebook's or the page's,
        and .zip (RFC 6266: filename in ASCII, filename* in UTF-8).
      required: true
      schema:
        type: string
    ArchivePolicy:
      description: The sandbox every answer of the download runs in.
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    ExportStart:
      type: object
      additionalProperties: false
      properties:
        root_id:
          description: The page to export with its subtree; absent or null for the whole notebook.
          type: [string, "null"]
          format: uuid
    TrashRestoreStart:
      type: object
      additionalProperties: false
      required: [node_id]
      properties:
        node_id:
          description: The root of the trash item to restore, a page or an attachment.
          type: string
          format: uuid
    RevertStart:
      description: A revert of a changeset in the background; no message, none.
      type: object
      additionalProperties: false
      required: [changeset_id]
      properties:
        changeset_id:
          description: The changeset to revert, of the notebook.
          type: string
          format: uuid
        message:
          description: >-
            Why, kept with the revert's changeset: 1–4,096 bytes of UTF-8, without NUL characters.
          type: string
    TransferJobPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TransferJob"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
    TransferJob:
      description: >-
        An import or an export of a notebook, a restore of a trash item or
        a revert of a changeset, a job that runs in the background: queued,
        then running, then succeeded, failed or cancelled. An export's
        archive expires a while after it succeeded, the instance's export
        TTL, or at once when its starter's next export of the notebook
        succeeds: a starter keeps only their latest export of a notebook.
        created_by is its starter.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          root_id,
          name,
          changeset_id,
          target_changeset_id,
          kind,
          state,
          client,
          created_by,
          created_at,
          started_at,
          cancel_requested_at,
          finished_at,
          progress,
          result_bytes,
          report,
          download,
        ]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        root_id:
          description: >-
            The page exported with its subtree, or imported under; null for
            the whole notebook, or its root. A restore's, the root of the
            trash item it restores, a page or an attachment; null for a
            revert.
          type: [string, "null"]
          format: uuid
        name:
          description: >-
            What is exported, by name, the notebook's or the page's, which
            the archive is named after; for an import, the archive's file
            name; for a restore, the trash item's name as it was deleted;
            for a revert, the kind of the changeset it reverts.
          type: string
        changeset_id:
          description: >-
            The changeset the job writes in, an import's, a restore's
            trash_restore or a revert's revert, decided as the job was
            created: it exists once the job first wrote. Null for an export,
            and for an import created before the jobs had it.
          type: [string, "null"]
          format: uuid
        target_changeset_id:
          description: The changeset a revert reverts; null for every other job.
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/TransferKind"
        state:
          $ref: "#/components/schemas/TransferState"
        client:
          $ref: "#/components/schemas/TransferClient"
        created_by:
          $ref: "../common.yaml#/components/schemas/UserRef"
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        cancel_requested_at:
          description: >-
            When a cancel of the job was asked as it ran: it stops at its
            next heartbeat, within about a second, unless it ends first;
            null when none was.
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        progress:
          $ref: "#/components/schemas/TransferProgress"
        result_bytes:
          description: The bytes of an export's archive, once it succeeded, and after it expired; null otherwise.
          type: [integer, "null"]
          format: int64
        report:
          description: What the job did and why it failed, once it ended; null before.
          oneOf:
            - $ref: "#/components/schemas/TransferReport"
            - type: "null"
        download:
          description: The address of an export's archive, once it succeeded and until it expires; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/TransferDownload"
            - type: "null"
    # TransferJob 的每个属性加上问题的两项，与 TransferJob 同步改：不用 allOf，TransferJob 的 additionalProperties: false
    # 会拒绝多出的两项。
    TransferJobDetail:
      description: >-
        A job, as TransferJob, and its report's problems and a revert's
        conflicts once it ended.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          root_id,
          name,
          changeset_id,
          target_changeset_id,
          kind,
          state,
          client,
          created_by,
          created_at,
          started_at,
          cancel_requested_at,
          finished_at,
          progress,
          result_bytes,
          report,
          download,
          problems,
          problems_truncated,
          conflicts,
          conflict_count,
        ]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        root_id:
          description: >-
            The page exported with its subtree, or imported under; null for
            the whole notebook, or its root. A restore's, the root of the
            trash item it restores, a page or an attachment; null for a
            revert.
          type: [string, "null"]
          format: uuid
        name:
          description: >-
            What is exported, by name, the notebook's or the page's, which
            the archive is named after; for an import, the archive's file
            name; for a restore, the trash item's name as it was deleted;
            for a revert, the kind of the changeset it reverts.
          type: string
        changeset_id:
          description: >-
            The changeset the job writes in, an import's, a restore's
            trash_restore or a revert's revert, decided as the job was
            created: it exists once the job first wrote. Null for an export,
            and for an import created before the jobs had it.
          type: [string, "null"]
          format: uuid
        target_changeset_id:
          description: The changeset a revert reverts; null for every other job.
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/TransferKind"
        state:
          $ref: "#/components/schemas/TransferState"
        client:
          $ref: "#/components/schemas/TransferClient"
        created_by:
          $ref: "../common.yaml#/components/schemas/UserRef"
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        cancel_requested_at:
          description: >-
            When a cancel of the job was asked as it ran: it stops at its
            next heartbeat, within about a second, unless it ends first;
            null when none was.
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        progress:
          $ref: "#/components/schemas/TransferProgress"
        result_bytes:
          description: The bytes of an export's archive, once it succeeded, and after it expired; null otherwise.
          type: [integer, "null"]
          format: int64
        report:
          description: What the job did and why it failed, once it ended; null before.
          oneOf:
            - $ref: "#/components/schemas/TransferReport"
            - type: "null"
        download:
          description: The address of an export's archive, once it succeeded and until it expires; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/TransferDownload"
            - type: "null"
        problems:
          description: The first 1,000 problems of the report, in the order met; empty before the job ends.
          type: array
          items:
            $ref: "#/components/schemas/TransferProblem"
        problems_truncated:
          description: Whether problems were left out past the first 1,000.
          type: boolean
        conflicts:
          description: >-
            The conflicts that stopped a revert (revert_conflict), as
            page.revert_conflict lists them: by reason, then by node id, the
            first 100 of conflict_count; empty for every other job and
            failure.
          type: array
          maxItems: 100
          items:
            $ref: "../common.yaml#/components/schemas/RevertConflict"
        conflict_count:
          description: How many conflicts stopped a revert (revert_conflict); 0 otherwise.
          type: integer
          minimum: 0
    TransferKind:
      type: string
      enum: [import, export, trash_restore, revert]
    TransferClient:
      description: Where the job was started from, which its writes are of.
      type: string
      enum: [web, api]
    TransferState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, expired]
    TransferProgress:
      description: >-
        How many of the job's nodes are done, of all: an export's written;
        an import's created or skipped, of those to create, 0 of 0 until
        its archive is read; a restore's restored or skipped, of the trash
        item's; a revert's put back, deleted, restored, written back or
        skipped, of those its plan changes, a subtree deleted counting its
        nodes; both 0 of 0 until the job is planned. A job interrupted
        keeps the progress it last wrote, at most a heartbeat behind.
      type: object
      additionalProperties: false
      required: [done, total]
      properties:
        done:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    TransferReport:
      type: object
      additionalProperties: false
      required: [failure, counts, placed, lock]
      properties:
        failure:
          description: Why the job failed; null when it did not.
          anyOf:
            - $ref: "#/components/schemas/TransferFailure"
            - type: "null"
        counts:
          $ref: "#/components/schemas/TransferCounts"
        placed:
          description: >-
            Where a restore put the trash item's root, once its first batch
            was written; null before, and for every other job.
          anyOf:
            - $ref: "../common.yaml#/components/schemas/TrashPlacement"
            - type: "null"
        lock:
          description: >-
            The page whose edit session stopped a revert (page_locked) and
            who holds it, by their display name as of the answer; null for
            every other job and failure.
          anyOf:
            - $ref: "../common.yaml#/components/schemas/PageLock"
            - type: "null"
    TransferFailure:
      description: >-
        Why a job failed: interrupted (the server stopped or restarted, the
        job stopped beating, or the job queue dropped it before it began),
        timeout (it ran past the instance's limit), forbidden (its starter
        could no longer read the notebook as it ran, or write in it as an
        import, a restore or a revert ran), root_not_found (the page
        exported, or imported under, was gone as it ran), storage_full,
        contributor_conflict (a file the server adds was where a node is),
        internal; for an import's archive as a whole, nothing written:
        not_zip (no zip, or its directory is broken), too_many_entries (more
        entries than the instance takes, or a directory larger than 64 MiB),
        unpacked_too_large (its entries unpack to more than the instance
        takes), too_many_nodes (its pages, attachments and the folders their
        paths imply are more nodes than one undo can revert, 60,000);
        tree_changed (a page an import created was deleted as it
        ran; a parent a restore restored was deleted, or moved so that its
        pages would nest deeper than 10 levels, as it ran), its later nodes
        not written; changeset_reverted (the changeset an import, a restore
        or a revert writes in was reverted as it ran, its later nodes not
        written). A restore's alone: trash_changed (the trash item is no
        longer as it was planned: restored, purged or deleted again as
        another, before its first batch, or a node left in the trash below
        what it restored no longer the root of its own item it made it);
        restore_expired (the item went past the time it can be restored in
        as it ran). A revert's alone: revert_conflict (a node it was about
        to change changed since, or would conflict, the report's conflicts
        listing them); changeset_trimmed (the purge took part of the
        changeset, a version it writes back or restores, or a trash item it
        restores); page_locked (an edit session holds a page it was about to
        delete or write back, the report's lock); revert_too_large (one of
        its segments, steps that must be in one batch, holds more pages,
        attachments, history or links than one batch writes). What a job
        wrote before it failed is kept.
      type: string
      enum:
        [
          interrupted,
          timeout,
          forbidden,
          root_not_found,
          storage_full,
          contributor_conflict,
          internal,
          not_zip,
          too_many_entries,
          unpacked_too_large,
          too_many_nodes,
          tree_changed,
          changeset_reverted,
          trash_changed,
          restore_expired,
          revert_conflict,
          changeset_trimmed,
          page_locked,
          revert_too_large,
        ]
    TransferCounts:
      description: >-
        What the job did before it ended, as it wrote its end. An export
        that could not write its end, which the server fails later as
        interrupted (it restarted, the job stopped beating, the job queue
        dropped it), counts nothing: its progress tells how far it went. An
        import, a restore and a revert write their counts and problems as
        they go, every ten seconds at most: one interrupted keeps those it
        last wrote, of the batches written by then. A restore counts pages,
        attachments, renamed and skipped; a revert restored, deleted,
        put_back, written and skipped.
      type: object
      additionalProperties: false
      required: [pages, attachments, renamed, missing, skipped, restored, deleted, put_back, written]
      properties:
        pages:
          description: The pages written; an import's, created; a restore's, restored.
          type: integer
          format: int64
        attachments:
          description: The attachments whose files were written; an import's, created; a restore's, restored.
          type: integer
          format: int64
        renamed:
          description: >-
            The nodes the export's vault names otherwise, as the export laid
            the vault out before it wrote; the nodes an import named
            otherwise than the archive; the nodes a restore numbered, a
            sibling where they went back holding their name.
          type: integer
          format: int64
        missing:
          description: The attachments whose files were not in the storage, and not written; 0 for an import.
          type: integer
          format: int64
        skipped:
          description: >-
            An import's entries skipped; the nodes of a restore's item, and
            of a revert's groups, that someone restored before the job came
            to them; 0 for an export.
          type: integer
          format: int64
        restored:
          description: >-
            The nodes a revert restored from the trash, its trash items'
            every node; 0 for every other job. (revertChangeset's log counts
            the trash items.)
          type: integer
          format: int64
        deleted:
          description: The nodes a revert deleted, with the subtrees of those it deleted; 0 for every other job.
          type: integer
          format: int64
        put_back:
          description: The nodes a revert put back where and as they were; 0 for every other job.
          type: integer
          format: int64
        written:
          description: The pages whose content a revert wrote back; 0 for every other job.
          type: integer
          format: int64
    TransferProblem:
      description: >-
        What befell a node, at its path in the archive's vault (at most
        1,024 bytes): renamed, written at to instead, so links to its old
        name do not reach it there; file_missing, an attachment whose file
        was not in the storage. An import's entry skipped, at its name in
        the archive: unsafe_path (it leaves the archive's root: "..", an
        absolute path, a drive), special_file (a symbolic link, or another
        file that is no regular one), encrypted, unsupported_method
        (compressed otherwise than stored or deflated), too_compressed (it
        unpacks to more than 200 times its packed size), name_not_utf8,
        invalid_content (a page's file not UTF-8, or holding NUL),
        too_large (a page's file past 5 MiB, an attachment past the
        instance's asset_max_bytes), duplicate (a path an earlier entry
        has), unreadable (its data broken, its checksum or size not its
        header's); an import's node, at its path in the vault: too_deep
        (more than 10 levels deep in the notebook where the import goes,
        with everything under it), renamed (created under the name at the
        end of to, its path from where the import goes).
      type: object
      additionalProperties: false
      required: [path, code, to]
      properties:
        path:
          type: string
        code:
          type: string
          enum:
            [
              renamed,
              file_missing,
              unsafe_path,
              special_file,
              encrypted,
              unsupported_method,
              too_compressed,
              name_not_utf8,
              invalid_content,
              too_large,
              too_deep,
              duplicate,
              unreadable,
            ]
        to:
          description: Where a renamed node is written, or created; null for any other problem.
          type: [string, "null"]
    TransferDownload:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          description: >-
            The archive's address on this server, which a browser downloads
            without a token until expires_at.
          type: string
        expires_at:
          description: >-
            When the address stops working: one to two hours after it was
            signed, or as the export expires, whichever comes first; reading
            the job again signs a new one. The starter's next export of the
            notebook, once it succeeds, expires this one at once.
          type: string
          format: date-time
