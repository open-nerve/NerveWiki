# wiki 模块的健康检查与升级；生成的 Go 代码在 server/internal/modules/wiki/adapter/http/gen。
openapi: 3.1.0
info:
  title: Nerve Wiki health checks and upgrade API
  version: v0
paths:
  /api/v0/notebooks/{notebook_id}/lint:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: getLint
      tags: [wiki]
      summary: Read a notebook's health checks
      description: >-
        Counts and up to five items for each applicable rule, from one read
        snapshot. A standard notebook has wanted, orphans, ambiguous and
        invalid_frontmatter, in that order. An LLM Wiki additionally has
        missing_type, missing_summary, undigested_sources and invalid_sources,
        in that order. Any role in the notebook can read them. A notebook
        that does not exist, is deleted, or is not visible to the caller is
        notebook.not_found. After that check, an exhausted computation or
        waiting budget is server_busy, with Retry-After: 1. Counts at the
        cap are lower bounds. Later pages are computed from later snapshots;
        items may move, disappear or repeat between calls.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, server_busy]
      responses:
        "200":
          description: The applicable rules, with their counts and previews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintSummary"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/lint/{rule}:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
      - $ref: "#/components/parameters/Rule"
    get:
      operationId: listLintItems
      tags: [wiki]
      summary: Read more items of a notebook's health check
      description: >-
        One page of a rule, from the current read snapshot. Any role in the
        notebook can read it. After HTTP binding, a malformed cursor is
        bad_request. When the requested rule is known, a cursor bound to
        another rule, notebook or scope is also bad_request before notebook
        authorization. A nonexistent, deleted or invisible notebook is then
        notebook.not_found; an unknown requested rule is wiki.lint_rule_not_found,
        without binding a shape-valid cursor. An LLM-only rule in a
        standard notebook is notebook.not_llm_wiki; a limit outside 1-100
        is validation_failed; an exhausted computation or waiting budget
        is server_busy, with Retry-After: 1. These checks occur in that order.
        The last four rules are LLM-only. The limit is 50 when absent.
        Use next_cursor to continue, including a start cursor returned by
        another client. Each item also carries its own continuation cursor.
        A capped count does not truncate this list. Pages may move between
        calls; use item_key to identify an item, not its displayed target.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          bad_request,
          notebook.not_found,
          wiki.lint_rule_not_found,
          notebook.not_llm_wiki,
          validation_failed,
          server_busy,
        ]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the requested rule, with null after its last item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintPage"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/upgrade:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: getUpgrade
      tags: [wiki]
      summary: The notebook's upgrade to an LLM Wiki under way, for its admins.
      description: >-
        The notebook's upgrade under way, upgrading, reviewing or rolling
        back, with who started it and when, the source root it proposes,
        the pages its start wrote and its baseline. Its admins can
        (forbidden). A notebook that does not exist, is deleted, or that
        the caller cannot see is notebook.not_found; one without an upgrade
        under way is wiki.upgrade_not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden, wiki.upgrade_not_found]
      responses:
        "200":
          description: The upgrade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startUpgrade
      tags: [wiki]
      summary: >-
        Starts upgrading a standard notebook to an LLM Wiki: records its
        baseline, writes the AGENTS and raw pages it lacks, and freezes its
        content but for its initiator's MCP writes.
      description: >-
        Its admins can (forbidden). The template's language is
        template_locale, en when absent. A notebook that does not exist, is
        deleted, or that the caller cannot see is notebook.not_found; an LLM
        Wiki is notebook.already_llm_wiki; one with an upgrade under way,
        another admin's start first among them, is notebook.upgrading; one
        with an import, a restore or an undo queued or running is
        transfer.busy; one with pages being edited is
        wiki.upgrade_pages_locked, naming them; one whose root holds an
        attachment titled raw or AGENTS is wiki.upgrade_title_taken. A start
        that finds no capacity to compute the baseline, or that runs out of
        time, is server_busy, with Retry-After: 1; one whose link index is
        out of date is wiki.upgrade_stale_index. These checks occur in that
        order. A page raw at the root becomes the proposed source root.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          validation_failed,
          notebook.not_found,
          forbidden,
          notebook.already_llm_wiki,
          notebook.upgrading,
          transfer.busy,
          wiki.upgrade_pages_locked,
          wiki.upgrade_title_taken,
          server_busy,
          wiki.upgrade_stale_index,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeStart"
      responses:
        "200":
          description: The upgrade started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/upgrade/abandon:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: abandonUpgrade
      tags: [wiki]
      summary: >-
        Abandons the upgrade, or continues its stopped rollback: puts the
        notebook back as the upgrade started, in a background job.
      description: >-
        An upgrade upgrading or reviewing rolls back, abandoned, its
        content frozen but for the rollback's job; one rolling back whose
        job stopped gets a new job. Its admins can (forbidden). A notebook
        that does not exist, is deleted, or that the caller cannot see is
        notebook.not_found; one without an upgrade under way is
        wiki.upgrade_state; one whose rollback's job is queued or running
        is transfer.busy; a full job queue is server_busy. These checks
        occur in that order. The answer is the upgrade, rolling back, with
        its rollback's job.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden, wiki.upgrade_state, transfer.busy, server_busy]
      responses:
        "200":
          description: The upgrade, rolling back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/upgrade/end-rollback:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: endUpgradeRollback
      tags: [wiki]
      summary: >-
        Ends a stopped rollback, keeping the notebook as it is: the
        upgrade's original pages and nodes are all there; some may not be
        back in place, and in pages not yet written back, links the system
        rewrote may lead nowhere.
      description: >-
        The upgrade ends, rolled back: its content is no longer frozen, and
        rollback_complete tells whether the rollback had put everything
        back, rollback_left what it had not. Its admins can (forbidden). A
        notebook that does not exist, is deleted, or that the caller cannot
        see is notebook.not_found; one whose upgrade is not rolling back is
        wiki.upgrade_state; one whose rollback's job is queued or running
        is transfer.busy. These checks occur in that order.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden, wiki.upgrade_state, transfer.busy]
      responses:
        "200":
          description: The upgrade, rolled back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/upgrade/check:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: checkUpgrade
      tags: [wiki]
      summary: Check the upgrade against an LLM Wiki's contract, for its admins.
      description: >-
        Every gate, the health checks of an LLM Wiki whose source root is the
        one the upgrade proposes, with their counts and first five items,
        and what the notebook holds, from one read snapshot; passed or not,
        200. Its admins can (forbidden). A notebook that does not exist, is
        deleted, or that the caller cannot see is notebook.not_found; one
        without an upgrade upgrading or reviewing is wiki.upgrade_state; an
        exhausted computation or waiting budget is server_busy, with
        Retry-After: 1. These checks occur in that order; the upgrade, read
        again in the check's snapshot once a computation slot is had, may
        still be wiki.upgrade_state then. Checks of one upgrade share a
        computation.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden, wiki.upgrade_state, server_busy]
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeCheck"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/upgrade/check/{rule}:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
      - $ref: "#/components/parameters/Rule"
    get:
      operationId: listUpgradeCheckItems
      tags: [wiki]
      summary: Read more items of a rule of the upgrade's check.
      description: >-
        One page of a rule in the upgrade's check's scope, an LLM Wiki whose
        source root is the one the upgrade proposes, from the current read
        snapshot. A malformed cursor is bad_request; then a notebook that
        does not exist, is deleted, or that the caller cannot see is
        notebook.not_found; a caller not its admin forbidden; an unknown
        rule wiki.lint_rule_not_found; an upgrade not upgrading or reviewing
        wiki.upgrade_state; a cursor bound to another notebook, rule or
        scope, including a lint's, bad_request; a limit outside 1-100
        validation_failed; an exhausted computation or waiting budget
        server_busy, with Retry-After: 1. These checks occur in that order;
        the upgrade, read again in the snapshot once a computation slot is
        had, may still be wiki.upgrade_state then. A cursor is bound to the
        proposed source root, not to the upgrade. The limit is 50 when
        absent. Continue with next_cursor.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          bad_request,
          notebook.not_found,
          forbidden,
          wiki.lint_rule_not_found,
          wiki.upgrade_state,
          validation_failed,
          server_busy,
        ]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the rule, with null after its last item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintPage"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/upgrade/submit:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: submitUpgrade
      tags: [wiki]
      summary: >-
        Submits the upgrade for its admins' review: freezes it for everyone,
        checks it again and keeps the report once every gate passes.
      description: >-
        The upgrade, upgrading, goes to reviewing, its content then frozen
        for everyone, the initiator's agent too; it is checked from a
        snapshot of that moment, apart from the request, and stays reviewing
        with its report kept once every gate passes. Otherwise it is
        upgrading again: wiki.upgrade_stale_index for an old link index,
        wiki.upgrade_not_ready for a gate that did not pass (detail names
        them), or the check's own error. Its admins can (forbidden). A
        notebook that does not exist, is deleted, or that the caller cannot
        see is notebook.not_found; one without an upgrade upgrading is
        wiki.upgrade_state, also while a previous submission is still
        checked (detail says so; a reviewing upgrade without a report may be
        submitted again once its check is surely over); an exhausted
        computation or waiting budget is server_busy. These checks occur in
        that order. Once the check is done, a submission taken over or an
        upgrade abandoned meanwhile is wiki.upgrade_state, before the
        check's own answer; the second step past its deadline, which is no
        later than the request's, is server_busy, with Retry-After: 1. Its
        admins are asked again before the answer, as the report is kept: a
        caller no longer one is notebook.not_found or forbidden then, the
        report kept all the same. The answer is the upgrade, reviewing,
        with its report.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          notebook.not_found,
          forbidden,
          wiki.upgrade_state,
          server_busy,
          wiki.upgrade_stale_index,
          wiki.upgrade_not_ready,
        ]
      responses:
        "200":
          description: The upgrade, reviewing, with its report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrade"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    NotebookID:
      name: notebook_id
      in: path
      required: true
      description: The notebook's id.
      schema:
        type: string
        format: uuid
    Rule:
      name: rule
      in: path
      required: true
      description: >-
        wanted, orphans, ambiguous, invalid_frontmatter, missing_type,
        missing_summary, undigested_sources or invalid_sources. An unknown
        value is checked by the use case after the cursor and notebook,
        not rejected while binding this path parameter.
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    LintRule:
      type: string
      enum:
        [
          wanted,
          orphans,
          ambiguous,
          invalid_frontmatter,
          missing_type,
          missing_summary,
          undigested_sources,
          invalid_sources,
        ]
    LintMode:
      type: string
      enum: [standard, llm_wiki]
    LintNodeKind:
      type: string
      enum: [page, asset]
    LintCount:
      description: >-
        The count capped at 10000. A count of 10000 always has count_capped
        true and is a lower bound; pagination still includes later items.
      type: integer
      format: int64
      minimum: 0
      maximum: 10000
    LintTarget:
      description: >-
        The displayed target, valid UTF-8 and at most 256 bytes, cut only
        between characters. target_cut says whether it was shortened.
        The character bound here does not replace the UTF-8 byte bound.
      type: string
      maxLength: 256
    LintCursor:
      description: An opaque canonical continuation after this exact item.
      type: string
      minLength: 1
      maxLength: 2048
    LintNextCursor:
      description: >-
        Continue after the last item actually returned; null when there
        are no more. A start cursor from another client is also accepted
        by listLintItems and begins before the true first item.
      type: [string, "null"]
      minLength: 1
      maxLength: 2048
    LintSummary:
      type: object
      additionalProperties: false
      required: [mode, computed_at, stale_pages, rules]
      properties:
        mode:
          $ref: "#/components/schemas/LintMode"
        computed_at:
          type: string
          format: date-time
        stale_pages:
          description: Pages with an old index; an administrator can reindex them.
          type: integer
          format: int64
          minimum: 0
        rules:
          description: The applicable rules in their fixed order, including zero counts.
          type: array
          minItems: 4
          maxItems: 8
          items:
            $ref: "#/components/schemas/LintRuleSummary"
    LintPage:
      type: object
      additionalProperties: false
      required: [mode, computed_at, stale_pages, data, next_cursor]
      properties:
        mode:
          $ref: "#/components/schemas/LintMode"
        computed_at:
          type: string
          format: date-time
        stale_pages:
          type: integer
          format: int64
          minimum: 0
        data:
          description: Items of the requested rule; an empty list is [].
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/LintItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    LintItem:
      oneOf:
        - $ref: "#/components/schemas/LintWantedItem"
        - $ref: "#/components/schemas/LintOrphansItem"
        - $ref: "#/components/schemas/LintAmbiguousItem"
        - $ref: "#/components/schemas/LintInvalidFrontmatterItem"
        - $ref: "#/components/schemas/LintMissingTypeItem"
        - $ref: "#/components/schemas/LintMissingSummaryItem"
        - $ref: "#/components/schemas/LintUndigestedSourcesItem"
        - $ref: "#/components/schemas/LintInvalidSourcesItem"
      discriminator:
        propertyName: rule
        mapping:
          wanted: "#/components/schemas/LintWantedItem"
          orphans: "#/components/schemas/LintOrphansItem"
          ambiguous: "#/components/schemas/LintAmbiguousItem"
          invalid_frontmatter: "#/components/schemas/LintInvalidFrontmatterItem"
          missing_type: "#/components/schemas/LintMissingTypeItem"
          missing_summary: "#/components/schemas/LintMissingSummaryItem"
          undigested_sources: "#/components/schemas/LintUndigestedSourcesItem"
          invalid_sources: "#/components/schemas/LintInvalidSourcesItem"
    LintWantedItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, cursor, target, target_cut, pages]
      properties:
        rule:
          type: string
          enum: [wanted]
        item_key:
          type: string
          maxLength: 140
          pattern: "^w:[0-9a-f]{64}$"
        cursor:
          $ref: "#/components/schemas/LintCursor"
        target:
          $ref: "#/components/schemas/LintTarget"
        target_cut:
          type: boolean
        pages:
          description: The number of distinct referring pages in this complete target group.
          type: integer
          format: int64
          minimum: 1
    LintOrphansItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, cursor, page_id]
      properties:
        rule:
          type: string
          enum: [orphans]
        item_key:
          type: string
          maxLength: 140
          pattern: "^p:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        cursor:
          $ref: "#/components/schemas/LintCursor"
        page_id:
          type: string
          format: uuid
    LintAmbiguousItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, cursor, page_id, target, target_cut]
      properties:
        rule:
          type: string
          enum: [ambiguous]
        item_key:
          type: string
          maxLength: 140
          pattern: "^a:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{64}$"
        cursor:
          $ref: "#/components/schemas/LintCursor"
        page_id:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/LintTarget"
        target_cut:
          type: boolean
    LintInvalidFrontmatterItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, cursor, page_id]
      properties:
        rule:
          type: string
          enum: [invalid_frontmatter]
        item_key:
          type: string
          maxLength: 140
          pattern: "^p:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        cursor:
          $ref: "#/components/schemas/LintCursor"
        page_id:
          type: string
          format: uuid
    LintMissingTypeItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, cursor, page_id]
      properties:
        rule:
          type: string
          enum: [missing_type]
        item_key:
          type: string
          maxLength: 140
          pattern: "^p:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        cursor:
          $ref: "#/components/schemas/LintCursor"
        page_id:
          type: string
          format: uuid
    LintMissingSummaryItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, cursor, page_id]
      properties:
        rule:
          type: string
          enum: [missing_summary]
        item_key:
          type: string
          maxLength: 140
          pattern: "^p:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        cursor:
          $ref: "#/components/schemas/LintCursor"
        page_id:
          type: string
          format: uuid
    LintUndigestedSourcesItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, cursor, node_id, kind, bytes, created_at]
      properties:
        rule:
          type: string
          enum: [undigested_sources]
        item_key:
          type: string
          maxLength: 140
          pattern: "^n:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        cursor:
          $ref: "#/components/schemas/LintCursor"
        node_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LintNodeKind"
        bytes:
          type: integer
          format: int64
          minimum: 0
        created_at:
          description: The source node's original creation time.
          type: string
          format: date-time
    LintInvalidSourcesItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, cursor, page_id, target, target_cut, not_link]
      properties:
        rule:
          type: string
          enum: [invalid_sources]
        item_key:
          type: string
          maxLength: 140
          pattern: "^s:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{64}$"
        cursor:
          $ref: "#/components/schemas/LintCursor"
        page_id:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/LintTarget"
        target_cut:
          type: boolean
        not_link:
          description: True for a non-link JSON value; false for a link that fails qualification.
          type: boolean
    LintRuleSummary:
      oneOf:
        - $ref: "#/components/schemas/LintWantedSummary"
        - $ref: "#/components/schemas/LintOrphansSummary"
        - $ref: "#/components/schemas/LintAmbiguousSummary"
        - $ref: "#/components/schemas/LintInvalidFrontmatterSummary"
        - $ref: "#/components/schemas/LintMissingTypeSummary"
        - $ref: "#/components/schemas/LintMissingSummarySummary"
        - $ref: "#/components/schemas/LintUndigestedSourcesSummary"
        - $ref: "#/components/schemas/LintInvalidSourcesSummary"
      discriminator:
        propertyName: rule
        mapping:
          wanted: "#/components/schemas/LintWantedSummary"
          orphans: "#/components/schemas/LintOrphansSummary"
          ambiguous: "#/components/schemas/LintAmbiguousSummary"
          invalid_frontmatter: "#/components/schemas/LintInvalidFrontmatterSummary"
          missing_type: "#/components/schemas/LintMissingTypeSummary"
          missing_summary: "#/components/schemas/LintMissingSummarySummary"
          undigested_sources: "#/components/schemas/LintUndigestedSourcesSummary"
          invalid_sources: "#/components/schemas/LintInvalidSourcesSummary"
    LintWantedSummary:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items, next_cursor]
      properties:
        rule:
          type: string
          enum: [wanted]
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LintWantedItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    LintOrphansSummary:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items, next_cursor]
      properties:
        rule:
          type: string
          enum: [orphans]
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LintOrphansItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    LintAmbiguousSummary:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items, next_cursor]
      properties:
        rule:
          type: string
          enum: [ambiguous]
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LintAmbiguousItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    LintInvalidFrontmatterSummary:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items, next_cursor]
      properties:
        rule:
          type: string
          enum: [invalid_frontmatter]
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LintInvalidFrontmatterItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    LintMissingTypeSummary:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items, next_cursor]
      properties:
        rule:
          type: string
          enum: [missing_type]
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LintMissingTypeItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    LintMissingSummarySummary:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items, next_cursor]
      properties:
        rule:
          type: string
          enum: [missing_summary]
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LintMissingSummaryItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    LintUndigestedSourcesSummary:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items, next_cursor]
      properties:
        rule:
          type: string
          enum: [undigested_sources]
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LintUndigestedSourcesItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    LintInvalidSourcesSummary:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items, next_cursor]
      properties:
        rule:
          type: string
          enum: [invalid_sources]
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LintInvalidSourcesItem"
        next_cursor:
          $ref: "#/components/schemas/LintNextCursor"
    UpgradeStart:
      type: object
      additionalProperties: false
      properties:
        template_locale:
          description: >-
            The language of the pages the start writes, AGENTS and raw, when
            the notebook lacks them; en when absent.
          type: string
          enum: [zh-CN, en]
    UpgradeState:
      description: >-
        Where an upgrade is: upgrading while its initiator's agent rearranges
        the notebook, reviewing once submitted, rolling_back while the
        notebook is put back as it was when it started; approved and
        rolled_back once it ended.
      type: string
      enum: [upgrading, reviewing, rolling_back, approved, rolled_back]
    UpgradeEnding:
      description: Why an upgrade rolls back, abandoned by an admin or rejected at its review.
      type: string
      enum: [abandoned, rejected]
    UpgradeBaseline:
      description: The notebook as the upgrade started, before the pages its start wrote.
      type: object
      additionalProperties: false
      required: [nodes, pages, wanted]
      properties:
        nodes:
          description: Its pages and attachments.
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        wanted:
          description: The distinct pages its links lead to that do not exist yet.
          allOf:
            - $ref: "#/components/schemas/LintCount"
    UpgradeRollbackLeft:
      description: >-
        Where a rollback ended short: the nodes not back in place, the pages
        not written back, the new nodes still there. In pages not yet
        written back, links the system rewrote may lead nowhere.
      type: object
      additionalProperties: false
      required: [nodes, pages, created]
      properties:
        nodes:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        created:
          type: integer
          minimum: 0
    Upgrade:
      description: A notebook's upgrade to an LLM Wiki, as its admins read it.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          state,
          started_by,
          started_at,
          source_root_id,
          seeded_page_ids,
          baseline,
          submitted_by,
          submitted_at,
          rollback_job_id,
          ending,
          rollback_complete,
          rollback_left,
          report,
        ]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/UpgradeState"
        started_by:
          $ref: "../common.yaml#/components/schemas/UserRef"
        started_at:
          type: string
          format: date-time
        source_root_id:
          description: The source root the upgrade proposes, a page at the root titled raw.
          type: string
          format: uuid
        seeded_page_ids:
          description: The pages the start wrote, raw then AGENTS, those the notebook lacked.
          type: array
          maxItems: 2
          items:
            type: string
            format: uuid
        baseline:
          $ref: "#/components/schemas/UpgradeBaseline"
        submitted_by:
          description: Who submitted it for review; null before.
          oneOf:
            - $ref: "../common.yaml#/components/schemas/UserRef"
            - type: "null"
        submitted_at:
          description: When it was submitted for review; null before.
          type: [string, "null"]
          format: date-time
        rollback_job_id:
          description: The job that rolls it back; null when it does not roll back.
          type: [string, "null"]
          format: uuid
        ending:
          description: Why it rolls back; null when it does not.
          anyOf:
            - $ref: "#/components/schemas/UpgradeEnding"
            - type: "null"
        rollback_complete:
          description: Whether its rollback put everything back, once the rollback ended; null before.
          type: [boolean, "null"]
        rollback_left:
          description: >-
            Where a rollback ended short: the nodes not back in place, the
            pages not written back, the new nodes still there. In pages not
            yet written back, links the system rewrote may lead nowhere.
            Rolling back with its job stopped: counted now. null otherwise.
          oneOf:
            - $ref: "#/components/schemas/UpgradeRollbackLeft"
            - type: "null"
        report:
          description: >-
            The report its submission kept once its check passed, kept after,
            through an abandonment too; null before, and while a submission is
            still checked.
          oneOf:
            - $ref: "#/components/schemas/UpgradeReport"
            - type: "null"
    UpgradeCheck:
      description: An upgrade's check, from one read snapshot.
      type: object
      additionalProperties: false
      required: [computed_at, stale_pages, passed, gates, rules, counts]
      properties:
        computed_at:
          type: string
          format: date-time
        stale_pages:
          description: Pages with an old link index; an administrator can reindex them.
          type: integer
          format: int64
          minimum: 0
        passed:
          description: Every gate passed.
          type: boolean
        gates:
          $ref: "#/components/schemas/UpgradeGates"
        rules:
          description: The eight health checks of an LLM Wiki, in their fixed order, including zero counts.
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: "#/components/schemas/LintRuleSummary"
        counts:
          $ref: "#/components/schemas/UpgradeCounts"
    UpgradeGates:
      type: object
      additionalProperties: false
      required: [agents, source_root, reserved_titles, frontmatter, sources, links, preserved, index]
      properties:
        agents:
          description: An AGENTS page at the root whose body is not empty.
          allOf:
            - $ref: "#/components/schemas/UpgradeGate"
        source_root:
          description: The proposed source root is a page, not the root's AGENTS.
          allOf:
            - $ref: "#/components/schemas/UpgradeGate"
        reserved_titles:
          $ref: "#/components/schemas/UpgradeTitlesGate"
        frontmatter:
          description: >-
            Each page outside the source area has frontmatter that parses,
            with type and summary but at the source root and the root's
            AGENTS.
          allOf:
            - $ref: "#/components/schemas/UpgradeGate"
        sources:
          description: Each sources reference leads to a node of the source area.
          allOf:
            - $ref: "#/components/schemas/UpgradeGate"
        links:
          $ref: "#/components/schemas/UpgradeLinksGate"
        preserved:
          $ref: "#/components/schemas/UpgradePreservedGate"
        index:
          description: The link index is fresh (stale_pages is 0).
          allOf:
            - $ref: "#/components/schemas/UpgradeGate"
    UpgradeGate:
      type: object
      additionalProperties: false
      required: [passed]
      properties:
        passed:
          type: boolean
    UpgradeTitlesGate:
      description: No node at the root holds a title an LLM Wiki keeps, index, log, index.md or log.md; those that do.
      type: object
      additionalProperties: false
      required: [passed, node_ids]
      properties:
        passed:
          type: boolean
        node_ids:
          type: array
          maxItems: 4
          items:
            type: string
            format: uuid
    UpgradeLinksGate:
      description: >-
        No page the upgrade started with, outside the source area now, leads
        to more distinct pages that do not exist than as it started; how many
        do, and the first five, by id.
      type: object
      additionalProperties: false
      required: [passed, pages_worse, node_ids]
      properties:
        passed:
          type: boolean
        pages_worse:
          type: integer
          minimum: 0
        node_ids:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
    UpgradePreservedGate:
      description: >-
        Each node the upgrade started with is alive, each page's content the
        one the guardrails let by; the nodes and pages, those kept, and the
        first five not, by id.
      type: object
      additionalProperties: false
      required: [passed, nodes, nodes_kept, pages, pages_kept, node_ids]
      properties:
        passed:
          type: boolean
        nodes:
          type: integer
          minimum: 0
        nodes_kept:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
        pages_kept:
          type: integer
          minimum: 0
        node_ids:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
    UpgradeCounts:
      type: object
      additionalProperties: false
      required: [sources, moved_into_sources, wiki_pages, new_pages, changesets, wanted_before, wanted_now]
      properties:
        sources:
          description: The nodes in the source area.
          type: integer
          minimum: 0
        moved_into_sources:
          description: The nodes the upgrade started with moved into the source area since.
          type: integer
          minimum: 0
        wiki_pages:
          description: The pages outside the source area, but the source root and the root's AGENTS.
          type: integer
          minimum: 0
        new_pages:
          description: The pages written since the upgrade started, the ones its start wrote included.
          type: integer
          minimum: 0
        changesets:
          description: The changes the upgrade wrote.
          type: integer
          minimum: 0
        wanted_before:
          $ref: "#/components/schemas/UpgradeWanted"
        wanted_now:
          $ref: "#/components/schemas/UpgradeWanted"
    UpgradeWanted:
      description: The distinct pages links lead to that do not exist yet, as the wanted health check counts them.
      type: object
      additionalProperties: false
      required: [count, count_capped]
      properties:
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
    UpgradeReport:
      description: The check a submission kept, its rules' first five items without cursors.
      type: object
      additionalProperties: false
      required: [computed_at, stale_pages, passed, gates, rules, counts]
      properties:
        computed_at:
          type: string
          format: date-time
        stale_pages:
          type: integer
          format: int64
          minimum: 0
        passed:
          type: boolean
        gates:
          $ref: "#/components/schemas/UpgradeGates"
        rules:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: "#/components/schemas/UpgradeReportRule"
        counts:
          $ref: "#/components/schemas/UpgradeCounts"
    UpgradeReportRule:
      type: object
      additionalProperties: false
      required: [rule, count, count_capped, items]
      properties:
        rule:
          $ref: "#/components/schemas/LintRule"
        count:
          $ref: "#/components/schemas/LintCount"
        count_capped:
          type: boolean
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/UpgradeReportItem"
    UpgradeReportItem:
      oneOf:
        - $ref: "#/components/schemas/UpgradeReportWantedItem"
        - $ref: "#/components/schemas/UpgradeReportOrphansItem"
        - $ref: "#/components/schemas/UpgradeReportAmbiguousItem"
        - $ref: "#/components/schemas/UpgradeReportInvalidFrontmatterItem"
        - $ref: "#/components/schemas/UpgradeReportMissingTypeItem"
        - $ref: "#/components/schemas/UpgradeReportMissingSummaryItem"
        - $ref: "#/components/schemas/UpgradeReportUndigestedSourcesItem"
        - $ref: "#/components/schemas/UpgradeReportInvalidSourcesItem"
      discriminator:
        propertyName: rule
        mapping:
          wanted: "#/components/schemas/UpgradeReportWantedItem"
          orphans: "#/components/schemas/UpgradeReportOrphansItem"
          ambiguous: "#/components/schemas/UpgradeReportAmbiguousItem"
          invalid_frontmatter: "#/components/schemas/UpgradeReportInvalidFrontmatterItem"
          missing_type: "#/components/schemas/UpgradeReportMissingTypeItem"
          missing_summary: "#/components/schemas/UpgradeReportMissingSummaryItem"
          undigested_sources: "#/components/schemas/UpgradeReportUndigestedSourcesItem"
          invalid_sources: "#/components/schemas/UpgradeReportInvalidSourcesItem"
    UpgradeReportWantedItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, target, target_cut, pages]
      properties:
        rule:
          type: string
          enum: [wanted]
        item_key:
          type: string
          maxLength: 140
          pattern: "^w:[0-9a-f]{64}$"
        target:
          $ref: "#/components/schemas/LintTarget"
        target_cut:
          type: boolean
        pages:
          description: The number of distinct referring pages in this complete target group.
          type: integer
          format: int64
          minimum: 1
    UpgradeReportOrphansItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, page_id]
      properties:
        rule:
          type: string
          enum: [orphans]
        item_key:
          type: string
          maxLength: 140
          pattern: "^p:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        page_id:
          type: string
          format: uuid
    UpgradeReportAmbiguousItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, page_id, target, target_cut]
      properties:
        rule:
          type: string
          enum: [ambiguous]
        item_key:
          type: string
          maxLength: 140
          pattern: "^a:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{64}$"
        page_id:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/LintTarget"
        target_cut:
          type: boolean
    UpgradeReportInvalidFrontmatterItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, page_id]
      properties:
        rule:
          type: string
          enum: [invalid_frontmatter]
        item_key:
          type: string
          maxLength: 140
          pattern: "^p:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        page_id:
          type: string
          format: uuid
    UpgradeReportMissingTypeItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, page_id]
      properties:
        rule:
          type: string
          enum: [missing_type]
        item_key:
          type: string
          maxLength: 140
          pattern: "^p:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        page_id:
          type: string
          format: uuid
    UpgradeReportMissingSummaryItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, page_id]
      properties:
        rule:
          type: string
          enum: [missing_summary]
        item_key:
          type: string
          maxLength: 140
          pattern: "^p:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        page_id:
          type: string
          format: uuid
    UpgradeReportUndigestedSourcesItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, node_id, kind, bytes, created_at]
      properties:
        rule:
          type: string
          enum: [undigested_sources]
        item_key:
          type: string
          maxLength: 140
          pattern: "^n:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        node_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LintNodeKind"
        bytes:
          type: integer
          format: int64
          minimum: 0
        created_at:
          description: The source node's original creation time.
          type: string
          format: date-time
    UpgradeReportInvalidSourcesItem:
      type: object
      additionalProperties: false
      required: [rule, item_key, page_id, target, target_cut, not_link]
      properties:
        rule:
          type: string
          enum: [invalid_sources]
        item_key:
          type: string
          maxLength: 140
          pattern: "^s:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{64}$"
        page_id:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/LintTarget"
        target_cut:
          type: boolean
        not_link:
          description: True for a non-link JSON value; false for a link that fails qualification.
          type: boolean
