# instance 模块的接口。生成的 Go 代码在
# server/internal/modules/instance/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve Wiki instance API
  version: v0
paths:
  /api/v0/instance:
    get:
      operationId: getInstance
      tags: [instance]
      summary: Describe this instance
      description: >-
        Reports the product, the build and the API version this instance
        runs, whether it is open for sign-up, whether accounts may create
        workspaces, and the largest attachment it takes. Public: needs no
        authentication.
      security: []
      x-problem-codes: []
      responses:
        "200":
          description: What this instance runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceInfo"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    InstanceInfo:
      type: object
      additionalProperties: false
      required:
        [
          product,
          version,
          commit,
          api_version,
          signup_enabled,
          workspace_creation_enabled,
          asset_max_bytes,
          export_ttl_seconds,
        ]
      properties:
        product:
          description: Product name.
          type: string
          examples: [Nerve Wiki]
        version:
          description: Product version of the running build.
          type: string
          examples: [0.1.0-dev]
        commit:
          description: Git revision of the running build; "unknown" when the build carries no VCS stamp.
          type: string
        api_version:
          description: Version of this HTTP API; every path starts with /api/{api_version}.
          type: string
          enum: [v0]
        signup_enabled:
          description: >-
            Whether anyone may register (auth.signup_enabled); when off, the
            server's administrator creates the accounts.
          type: boolean
        workspace_creation_enabled:
          description: >-
            Whether accounts may create workspaces
            (workspace.creation_enabled); when off, the server's administrator
            creates them.
          type: boolean
        asset_max_bytes:
          description: >-
            The largest attachment an upload may send, in bytes
            (asset.max_bytes); a larger one is payload_too_large.
          type: integer
          format: int64
          minimum: 1024
        export_ttl_seconds:
          description: >-
            How long an export's archive is kept once the export succeeded,
            in seconds (transfer.export_ttl); then it expires.
          type: integer
          format: int64
          minimum: 600
