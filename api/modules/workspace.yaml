# workspace 模块的接口：工作区、成员与邀请。生成的 Go 代码在
# server/internal/modules/workspace/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve Wiki workspace API
  version: v0
paths:
  /api/v0/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspace]
      summary: List the caller's workspaces
      description: >-
        The workspaces the caller is an active member of, with the caller's
        role in each, by name, case-insensitively. The list is not paged.
      security: [{ bearer: [] }]
      x-problem-codes: []
      responses:
        "200":
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWorkspace
      tags: [workspace]
      summary: Create a workspace
      description: >-
        Creates a workspace whose admin is the caller. While creating
        workspaces is off on the instance (GET /instance answers
        workspace_creation_enabled), it answers workspace.creation_disabled
        before the values are looked at; the server's administrator creates
        workspaces with nervewiki workspaces create. A slug another workspace
        has is workspace.slug_taken; a reserved one is a problem of the slug
        field (not_allowed).
      security: [{ bearer: [] }]
      x-problem-codes:
        [workspace.creation_disabled, validation_failed, workspace.slug_taken, identity.account_deactivated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: The workspace, with the caller as its admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/workspaces/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get a workspace
      description: >-
        The workspace, with the caller's role. A workspace that does not
        exist, is deleted, or that the caller is no active member of is
        workspace.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.not_found]
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Rename a workspace
      description: >-
        Gives the workspace a new name; only its admins can. A workspace that
        does not exist, is deleted, or that the caller is no active member of
        is workspace.not_found; a member or a guest gets forbidden; the name is
        checked after both.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.not_found, forbidden, validation_failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: The renamed workspace, with the caller's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWorkspace
      tags: [workspace]
      summary: Delete a workspace
      description: >-
        Deletes the workspace with every membership of it; only its admins
        can. No one sees it afterwards, and its slug can name a new workspace
        at once. A workspace that does not exist, is deleted, or that the
        caller is no active member of is workspace.not_found; a member or a
        guest gets forbidden.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.not_found, forbidden]
      responses:
        "204":
          description: The workspace is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/workspaces/{slug}/members:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listWorkspaceMembers
      tags: [workspace]
      summary: List a workspace's members
      description: >-
        The workspace's active members, by when they joined, each with the
        account's display name and, unless the caller is a guest, its email.
        The list is not paged.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.not_found]
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/workspaces/{slug}/leave:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: leaveWorkspace
      tags: [workspace]
      summary: Leave a workspace
      description: >-
        Ends the caller's membership of the workspace. The workspace's only
        active admin cannot leave it, even alone in it
        (workspace.sole_admin): another member is made an admin first, or the
        workspace is deleted.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.not_found, workspace.sole_admin]
      responses:
        "204":
          description: The caller is no longer a member.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/workspace-members/{workspace_member_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceMemberID"
    patch:
      operationId: updateWorkspaceMember
      tags: [workspace]
      summary: Change a member's role
      description: >-
        Gives the member a new role; only the workspace's admins can, and not
        their own (workspace.own_membership). A membership that does not
        exist, has ended, or whose workspace the caller cannot see is
        workspace.member_not_found; a member or a guest gets forbidden; the
        role is checked after both.
      security: [{ bearer: [] }]
      x-problem-codes: [validation_failed, workspace.member_not_found, forbidden, workspace.own_membership]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberUpdate"
      responses:
        "200":
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeWorkspaceMember
      tags: [workspace]
      summary: Remove a member
      description: >-
        Ends the member's membership; only the workspace's admins can, and
        not their own (workspace.own_membership: an admin leaves instead). A
        membership that does not exist, has ended, or whose workspace the
        caller cannot see is workspace.member_not_found; a member or a guest
        gets forbidden.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.member_not_found, forbidden, workspace.own_membership]
      responses:
        "204":
          description: The membership has ended.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/workspace-slugs/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: checkWorkspaceSlug
      tags: [workspace]
      summary: Tell whether a slug can name a new workspace
      description: >-
        Whether a new workspace can take the slug, and if not why: invalid
        (not 1–48 of a–z, 0–9, _ and -), reserved (a path of the site, or
        held for one), or taken (a workspace not deleted has it).
      security: [{ bearer: [] }]
      x-problem-codes: []
      responses:
        "200":
          description: Whether the slug is free.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlugAvailability"
        default:
          $ref: "#/components/responses/Problem"
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: >-
        The workspace's slug. It carries no pattern here: a slug spelled
        wrong names no workspace, which the operation answers itself.
      schema:
        type: string
    WorkspaceMemberID:
      name: workspace_member_id
      in: path
      required: true
      description: The id of a membership, as the member list answers it; not the account's id.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited and server_busy.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    WorkspaceRole:
      description: >-
        A member's role: admin manages the workspace and its members, member
        and guest take part. Rules compare roles by set, never by order.
      type: string
      enum: [admin, member, guest]
    Workspace:
      description: A workspace, with the caller's role in it.
      type: object
      additionalProperties: false
      required: [id, slug, name, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          description: The workspace's address segment, fixed once created.
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          description: 1–80 characters after the surrounding blanks are trimmed, without control characters.
          type: string
        slug:
          description: >-
            1–48 of a–z, 0–9, _ and -, not a reserved name; it cannot be
            changed later.
          type: string
    WorkspaceUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: 1–80 characters after the surrounding blanks are trimmed, without control characters.
          type: string
    WorkspaceMember:
      description: A membership, with what the caller may see of the account.
      type: object
      additionalProperties: false
      required: [id, user_id, role, display_name, email, created_at]
      properties:
        id:
          description: The membership's id, which the member operations take.
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        display_name:
          type: string
        email:
          description: The account's email; null when the caller is a guest.
          type: [string, "null"]
        created_at:
          description: When the account joined.
          type: string
          format: date-time
    WorkspaceMemberList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMember"
    WorkspaceMemberUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/WorkspaceRole"
    SlugAvailability:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          description: Why a new workspace cannot take the slug; absent when it can.
          type: string
          enum: [invalid, reserved, taken]
