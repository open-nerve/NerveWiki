# page 模块的接口：笔记本的页面树与页面。生成的 Go 代码在
# server/internal/modules/page/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve Wiki page API
  version: v0
paths:
  /api/v0/notebooks/{notebook_id}/nodes:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: listNodes
      tags: [page]
      summary: List a notebook's tree
      description: >-
        The notebook's nodes, its pages and their attachments, each parent
        before its children, siblings in their order; any role in the
        notebook can list them. A notebook that does not exist, is deleted,
        or that the caller has no role in is notebook.not_found. The list is
        not paged.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "200":
          description: The tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNodeList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/pages:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: createPage
      tags: [page]
      summary: Create a page
      description: >-
        Creates a page under a parent, or at the notebook's root, with the
        content given, empty when none is, at revision 1; its editors and
        admins can, a reader cannot (forbidden). A content of more than
        5 MiB (5,242,880 bytes) or with a NUL character is validation_failed
        first, whatever the notebook. Then a notebook that does not exist,
        is deleted, or that the caller has no role in is notebook.not_found;
        the other values are checked after both: the title's rules, a parent
        that is no page of the notebook and a page to follow that is no
        child of the parent are validation_failed; then a title a sibling
        has, compared by its key, is page.title_taken, and a page deeper
        than ten levels page.too_deep. When the server parses as much
        content as it can at once, a content waits a moment, then is
        server_busy. A body that has not all arrived within the server's
        read timeout (server.read_timeout, 30 seconds by default, in which
        5 MiB needs about 1.4 Mbit/s) is bad_request.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden, validation_failed, page.title_taken, page.too_deep, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageCreate"
      responses:
        "201":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getPage
      tags: [page]
      summary: Get a page
      description: >-
        The page, with its ancestors and what it tells of its content. A page
        that does not exist, is deleted, or whose notebook the caller has no
        role in is page.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found]
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/content:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getPageContent
      tags: [page]
      summary: Read a page's content
      description: >-
        The page's Markdown, byte for byte as written, with its revision and
        hash. Any role in its notebook can read it. A page that does not
        exist, is deleted, or whose notebook the caller has no role in is
        page.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found]
      responses:
        "200":
          description: The page's content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPageContent
      tags: [page]
      summary: Write a page's content
      description: >-
        Replaces the page's content, byte for byte, on the revision the
        writer read it at; its notebook's editors and admins can, a reader
        cannot (forbidden). A content of more than 5 MiB (5,242,880 bytes)
        or with a NUL character is validation_failed first, whatever the
        page. Then a page that does not exist, is deleted, or whose notebook
        the caller has no role in is page.not_found; an edit session that is
        not the caller's session of this page, opened from the same client
        (the web or a token), is page.edit_session_ended; then one taken
        over by the caller elsewhere is page.edit_session_taken_over, one
        whose lock an admin of the notebook released is
        page.edit_session_unlocked, naming them in ended_by, and one no
        longer alive is page.edit_session_ended; a base_revision that is not
        the page's revision is page.revision_mismatch: the page was written
        since, and the writer reads it again. A content the page holds
        already writes nothing, whatever the base. Then a page whose lock
        another edit session holds, the caller's elsewhere among them, is
        page.locked, naming the holder in lock: a write in no session too.
        The writes of one edit session are one changeset, with one version
        of the page, until another write of the page comes in between. When the server parses as much content as it can at
        once, a content waits a moment, then is server_busy. A body that has
        not all arrived within the server's read timeout
        (server.read_timeout, 30 seconds by default, in which 5 MiB needs
        about 1.4 Mbit/s) is bad_request.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          validation_failed,
          page.not_found,
          forbidden,
          page.edit_session_ended,
          page.edit_session_taken_over,
          page.edit_session_unlocked,
          page.revision_mismatch,
          page.locked,
          server_busy,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageContentWrite"
      responses:
        "200":
          description: The page, as the write leaves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/edit-sessions:
    parameters:
      - $ref: "#/components/parameters/PageID"
    post:
      operationId: openEditSession
      tags: [page]
      summary: Open an edit session
      description: >-
        Opens the caller's edit session of the page: a lease of 120 seconds,
        which a heartbeat every 20 seconds keeps alive. The content's writes
        that name it are one changeset. The page's alive session holds its
        edit lock: while one does, another opening is page.locked, naming
        the holder in lock, the caller among them when they hold it
        elsewhere. With take_over, the caller's own alive sessions of the
        page end first (their next heartbeat or write is
        page.edit_session_taken_over); someone else's lock it does not
        pass. Its notebook's editors and admins can, a reader cannot
        (forbidden). A page that does not exist, is deleted, or whose
        notebook the caller has no role in is page.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden, page.locked]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionOpening"
      responses:
        "201":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSession"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/edit-lock:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getEditLock
      tags: [page]
      summary: Read a page's edit lock
      description: >-
        Who holds the page's edit lock, and for how many seconds its lease
        lasts unless a heartbeat keeps it; no holder while no alive session
        holds it. Whoever may read the page may read it. A page that does
        not exist, is deleted, or whose notebook the caller has no role in
        is page.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found]
      responses:
        "200":
          description: The page's edit lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditLock"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: releaseEditLock
      tags: [page]
      summary: Release a page's edit lock
      description: >-
        Ends whichever edit session holds the page's lock: its next
        heartbeat or write is page.edit_session_unlocked, naming the caller.
        A page no session holds is released already. Its notebook's admins
        can, anyone else in it cannot (forbidden). A page that does not
        exist, is deleted, or whose notebook the caller has no role in is
        page.not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden]
      responses:
        "204":
          description: No session holds the page's lock.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/view:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getPageView
      tags: [page]
      summary: Read a page
      description: >-
        The page's reading view: its content rendered to HTML, its
        frontmatter's properties as a table first, and the revision it was
        rendered from. The HTML holds only what the renderer writes and a
        typographic allowlist of the content's own HTML, every address on
        this site, http(s) or mailto, and nothing loaded but an attachment's
        image, audio or video at a path of this site. In the content, a
        wikilink, an embed (nw-embed), and a Markdown link or image whose
        address is a path, from the root too, link to pages of the notebook
        and have no address, which the app gives: each carries the page it
        leads to as it reads now (data-nw-node) and its anchor's heading id
        (data-nw-anchor), or nw-unresolved and its target (data-nw-target).
        One that leads to an attachment (nw-asset) has its content's
        address, signed, which expires at assets_expire_at the earliest: an
        embed or an image of an image is its img, of the caption and the
        size written (|300, |300x200), or else of the image's own size; of
        an audio or a video, its element, the content's first 20 of them;
        any other is a link, data-nw-size its size in bytes, and download
        where the browser downloads the content (any type the server does
        not show: its mime is application/octet-stream), showing the others
        itself. Past the content's first 2000 addresses of attachments, in
        a link's text but for an image, and for an attachment deleted, it is
        text.
        A tag (nw-tag) of a name tag lists count links to its pages and has
        no address either: it carries the tag as this page writes it, but for
        its '#' and a last '/', which getTag takes (data-nw-tag); a tag the
        index does not keep of the page, its key longer than 1024 bytes or
        past the page's first 1000 tags, links still, though getTag does not
        list the page for it. A tag of a name the lists do
        not count (#1/) is a span, as are the tag "/" (#//), which getTag's
        path cannot name, and a tag in a link's text.
        A wikilink in a link's text is a span, as is one written with a
        block's anchor alone ([[#^b]]); one written with a heading's anchor
        alone ([[#h]]) has the heading's id as its address, as has a
        Markdown link to an anchor alone (#h), which is its text alone for a
        block's anchor or an empty one; an image of a page in a link's text
        has no link of its own. A table, the properties' table and a block formula
        are each in a div of class nw-scroll, a region of their own that
        may scroll sideways. In the properties' table, a string written on
        one line that is one link to a page or an attachment and nothing
        else, a wikilink
        with a target (not an anchor alone) or a Markdown link whose address
        is a path, is a link as in the
        content, without a title, showing the text the link shows; a value
        a YAML alias repeats, and every other value, is text. Once
        the page is in the link index (nervewiki reindex after an upgrade),
        a links event tells when where its links lead changes. A page that
        does not exist, is deleted, or whose notebook the caller has no role
        in is page.not_found alike. When the server parses as much content as
        it can at once, the page waits a moment, then is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, server_busy]
      responses:
        "200":
          description: The page's reading view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageView"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/toggle-task:
    parameters:
      - $ref: "#/components/parameters/PageID"
    post:
      operationId: toggleTask
      tags: [page]
      summary: Tick or clear a task item
      description: >-
        Ticks the page's task item at offset (checked true) or clears it
        (false): the character between its brackets, at the byte offset in
        the content that the reading view's checkbox carries in data-task,
        becomes x or a space, and no other byte changes. Its notebook's
        editors and admins can, a reader cannot (forbidden). A page that
        does not exist, is deleted, or whose notebook the caller has no
        role in is page.not_found; a base_revision that is not the page's
        revision is page.revision_mismatch: an offset means something in
        that revision only. Then an offset that is no task item's, of that
        content, is validation_failed (out_of_range on offset), and a tick
        or a clear that would leave none there is too (not_allowed: ticking
        "- [ ]: /u" makes a link reference definition). A task item in that
        state already writes nothing: the page is answered as it is, or
        page.revision_mismatch if a write came since.
        Then a page whose lock an edit session holds, the caller's
        elsewhere among them, is page.locked, naming the holder in lock.
        When the server parses as much content as it can at once, a toggle
        waits a moment, then is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden, page.revision_mismatch, validation_failed, page.locked, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskToggle"
      responses:
        "200":
          description: The page, as the toggle leaves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/edit-sessions/{edit_session_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/EditSessionID"
    post:
      operationId: heartbeatEditSession
      tags: [page]
      summary: Keep an edit session alive
      description: >-
        Keeps the caller's session alive for 120 seconds from now. The
        caller's session, alive or ended by a take-over or an unlock, is
        page.edit_session_not_found when the caller has no role in its
        notebook any more, and forbidden when they may only read its page
        now. Otherwise the caller's session taken over elsewhere is
        page.edit_session_taken_over; one whose lock an admin of the
        notebook released is page.edit_session_unlocked, naming them in
        ended_by: the editor does not open another. Either answers so until
        its record is cleaned up, at least 120 seconds after the end. A
        session that does not exist, has expired, or is someone else's is
        page.edit_session_not_found alike: the editor opens a new one.
      security: [{ bearer: [] }]
      x-problem-codes:
        [page.edit_session_not_found, forbidden, page.edit_session_taken_over, page.edit_session_unlocked]
      responses:
        "200":
          description: The session, kept alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSession"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/edit-sessions/{edit_session_id}:
    parameters:
      - $ref: "#/components/parameters/EditSessionID"
    delete:
      operationId: endEditSession
      tags: [page]
      summary: End an edit session
      description: >-
        Ends the caller's session: it asks only that the session is the
        caller's, and alive, or taken over or unlocked, expired or not until
        its record is cleaned up (its record goes). A session that does not
        exist, has expired otherwise, or is someone else's is
        page.edit_session_not_found alike, which the editor takes for ended.
      security: [{ bearer: [] }]
      x-problem-codes: [page.edit_session_not_found]
      responses:
        "204":
          description: The session is ended.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/nodes/{node_id}:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    patch:
      operationId: renameNode
      tags: [page]
      summary: Rename a page or an attachment
      description: >-
        Renames the node, a page or an attachment; its notebook's editors
        and admins can, a reader cannot (forbidden). A node that does not
        exist, is deleted, or whose notebook the caller has no role in is
        page.not_found; the name is checked after both: its rules are
        validation_failed, a name a sibling has, compared by its key, is
        page.title_taken. An attachment's name does not end with ".md", in
        any case, and keeps an extension when it had one (the extension may
        change): either is not_allowed on name. The node's own name writes
        nothing; one that differs from it in case alone is written. The
        links that led to the node, the attachment or the page and those
        under it, by a path that changes, and those the new name would lead
        elsewhere, are written again in the pages they are in, so that each
        leads where it did; when one of these pages is being edited, its own
        included, the rename is refused as a whole, linking.pages_locked
        naming each of them and its editor, and when their parse finds the
        server busy it is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes:
        [page.not_found, forbidden, validation_failed, page.title_taken, linking.pages_locked, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRename"
      responses:
        "200":
          description: The node, renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNode"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteNode
      tags: [page]
      summary: Delete a page or an attachment
      description: >-
        Deletes the node: a page with every node under it, its attachments
        among them, or an attachment, at one time: they go to the trash
        together. Its notebook's editors and admins can, a reader
        cannot (forbidden). A node that does not exist, is deleted, or whose
        notebook the caller has no role in is page.not_found. While another
        account's edit session holds the lock of the page or of one under
        it, the deletion is page.locked, naming the first such page, level
        by level, and its holder in lock; the caller's own sessions end with
        their pages.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden, page.locked]
      responses:
        "204":
          description: The node and the nodes under it are deleted.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/nodes/{node_id}/move:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: moveNode
      tags: [page]
      summary: Move a page or an attachment
      description: >-
        Moves the node, a page with every node under it or an attachment:
        under another parent page, to the notebook's root, or among its
        siblings. Its notebook's editors and admins can, a reader cannot
        (forbidden). A node that does not exist, is deleted, or whose
        notebook the caller has no role in is page.not_found; the
        destination is checked after both: a parent that is no page of the
        notebook and a node to follow that is no other child of the parent
        are validation_failed; then a parent that is the node itself or
        under it is page.cycle, a title a new sibling
        has, compared by its key, page.title_taken, and a page under it
        that would be deeper than ten levels page.too_deep: an attachment
        is no level, and a page of the tenth holds them. A move to where
        the node is writes nothing. The links that led to the node, the
        attachment or the page and those under it, by a path that changes,
        the links in the moved pages that the move would lead elsewhere, and
        the links the moved nodes would take from other nodes, are written
        again in the pages they are in, so that each leads where it did;
        when one of these pages is being edited, one of the moved included,
        the move is refused as a whole, linking.pages_locked naming each of
        them and its editor, and when their parse finds the server busy it
        is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          page.not_found,
          forbidden,
          validation_failed,
          page.cycle,
          page.title_taken,
          page.too_deep,
          linking.pages_locked,
          server_busy,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeMove"
      responses:
        "200":
          description: The node, moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNode"
        default:
          $ref: "#/components/responses/Problem"
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    NotebookID:
      name: notebook_id
      in: path
      required: true
      description: The notebook's id.
      schema:
        type: string
        format: uuid
    PageID:
      name: page_id
      in: path
      required: true
      description: The page's id.
      schema:
        type: string
        format: uuid
    EditSessionID:
      name: edit_session_id
      in: path
      required: true
      description: The edit session's id.
      schema:
        type: string
        format: uuid
    NodeID:
      name: node_id
      in: path
      required: true
      description: The id of a node of a notebook's tree.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    NodeKind:
      description: >-
        What a node of the tree is: a page, or an attachment, a file at the
        root or under a page, which no node is under.
      type: string
      enum: [page, asset]
    TreeNode:
      description: A node of a notebook's tree, a page or an attachment.
      type: object
      additionalProperties: false
      required: [id, notebook_id, parent_id, kind, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        parent_id:
          description: The parent page; null at the notebook's root.
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          description: The page's title, or the attachment's file name.
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When the node was last created, renamed or moved; its content's writes do not change it.
          type: string
          format: date-time
    TreeNodeList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
    Ancestor:
      description: A page above another, on the way from the root.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Page:
      description: >-
        A page: its node, its ancestors and what it tells of its content.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          parent_id,
          kind,
          name,
          created_at,
          updated_at,
          ancestors,
          revision,
          byte_size,
          content_updated_at,
          content_updated_by,
        ]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        parent_id:
          description: The parent page; null at the notebook's root.
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          description: The page's title.
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When the page was last created, renamed or moved; its content's writes do not change it.
          type: string
          format: date-time
        ancestors:
          description: The pages above it, from the root down to its parent; none at the root.
          type: array
          items:
            $ref: "#/components/schemas/Ancestor"
        revision:
          description: The content's version, 1 for a new page; each write of the content adds one.
          type: integer
        byte_size:
          description: The content's size in bytes.
          type: integer
        content_updated_at:
          description: When the content was last written.
          type: string
          format: date-time
        content_updated_by:
          description: The account that last wrote the content.
          type: string
          format: uuid
    PageView:
      description: A page's reading view.
      type: object
      additionalProperties: false
      required: [html, revision, assets_expire_at]
      properties:
        html:
          description: >-
            The content rendered to HTML. The attachments its links lead to are shown at their contents' addresses,
            signed, each a path of this site, as getPageView tells: an image, an audio or a video embedded, a link to
            any other; text past the first addresses, and in a link's text but for an image.
          type: string
        revision:
          description: The content's version the HTML was rendered from.
          type: integer
        assets_expire_at:
          description: >-
            When the earliest of the attachments' addresses in the HTML expires, after which the view is to be read
            again; null for a view with none.
          type: [string, "null"]
          format: date-time
    PageCreate:
      description: A new page.
      type: object
      additionalProperties: false
      required: [parent_id, title]
      properties:
        parent_id:
          description: The parent page; null for the notebook's root.
          type: [string, "null"]
          format: uuid
        title:
          $ref: "#/components/schemas/Title"
        after_id:
          description: >-
            The sibling the page goes right after; null puts it first,
            absent last.
          type: [string, "null"]
          format: uuid
        content:
          $ref: "#/components/schemas/Content"
    PageContent:
      description: A page's content.
      type: object
      additionalProperties: false
      required: [content, revision, content_hash]
      properties:
        content:
          $ref: "#/components/schemas/Content"
        revision:
          description: The content's version.
          type: integer
        content_hash:
          description: The SHA-256 of the content's bytes, in lower-case hexadecimal.
          type: string
          pattern: "^[0-9a-f]{64}$"
    PageContentWrite:
      description: A page's new content.
      type: object
      additionalProperties: false
      required: [content, base_revision]
      properties:
        content:
          $ref: "#/components/schemas/Content"
        base_revision:
          description: The revision the content was read at.
          type: integer
        edit_session_id:
          description: The caller's edit session of the page the write is made in.
          type: string
          format: uuid
    EditSession:
      description: An edit session of a page, while its lease lasts.
      type: object
      additionalProperties: false
      required: [id, page_id, expires_at]
      properties:
        id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        expires_at:
          description: When the session ends unless a heartbeat keeps it alive.
          type: string
          format: date-time
    EditSessionOpening:
      description: How an edit session opens.
      type: object
      additionalProperties: false
      properties:
        take_over:
          description: >-
            End the caller's own alive sessions of the page first, wherever
            they were opened.
          type: boolean
          default: false
    TaskToggle:
      description: A tick or a clear of a task item.
      type: object
      additionalProperties: false
      required: [base_revision, offset, checked]
      properties:
        base_revision:
          description: The revision the offset was read at, the reading view's.
          type: integer
        offset:
          description: >-
            The byte offset in the content of the character between the
            item's brackets: its checkbox's data-task.
          type: integer
        checked:
          description: Tick the item (true) or clear it (false).
          type: boolean
    EditLock:
      description: A page's edit lock.
      type: object
      additionalProperties: false
      required: [holder, expires_in]
      properties:
        holder:
          description: Who holds the lock; null while no one does.
          anyOf:
            - $ref: "#/components/schemas/EditLockHolder"
            - type: "null"
        expires_in:
          description: >-
            Whole seconds, rounded up, until the holder's lease ends unless a
            heartbeat keeps it; null while no one holds the lock. A span, not
            a time: the client's clock may be wrong.
          type: [integer, "null"]
          minimum: 1
    EditLockHolder:
      description: The account whose alive edit session holds a page's lock.
      type: object
      additionalProperties: false
      required: [user_id, display_name]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
    Content:
      description: >-
        A page's Markdown, byte for byte: at most 5 MiB (5,242,880 bytes)
        of UTF-8, without NUL characters. Its line breaks, byte order mark
        and blanks are kept as they are.
      type: string
    NodeMove:
      description: Where a page goes.
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id:
          description: The new parent page; null for the notebook's root.
          type: [string, "null"]
          format: uuid
        after_id:
          description: >-
            The sibling the page goes right after; null puts it first,
            absent last.
          type: [string, "null"]
          format: uuid
    NodeRename:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Title"
    Title:
      description: >-
        1–255 bytes after the surrounding blanks are trimmed and the text is
        in NFC; none of / \ : * ? " < > | # ^ [ ] nor control characters; not
        starting or ending with a dot; no name Windows reserves (CON, COM1, …).
        It is the file's name when the notebook is exported. Siblings' titles
        differ in more than case: they compare by Unicode case folding.
      type: string
