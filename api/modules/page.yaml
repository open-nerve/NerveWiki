# page 模块的接口：笔记本的页面树与页面。生成的 Go 代码在
# server/internal/modules/page/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve Wiki page API
  version: v0
paths:
  /api/v0/notebooks/{notebook_id}/nodes:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: listNodes
      tags: [page]
      summary: List a notebook's tree
      description: >-
        The notebook's nodes, its pages and their attachments, each parent
        before its children, siblings in their order; any role in the
        notebook can list them. A notebook that does not exist, is deleted,
        or that the caller has no role in is notebook.not_found. The list is
        not paged.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "200":
          description: The tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNodeList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/pages:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: createPage
      tags: [page]
      summary: Create a page
      description: >-
        Creates a page under a parent, or at the notebook's root, with the
        content given, empty when none is, at revision 1; its editors and
        admins can, a reader cannot (forbidden). A content of more than
        5 MiB (5,242,880 bytes) or with a NUL character is validation_failed
        first, whatever the notebook. Then a notebook that does not exist,
        is deleted, or that the caller has no role in is notebook.not_found;
        the other values are checked after both: the title's rules, a parent
        that is no page of the notebook and a page to follow that is no
        child of the parent are validation_failed; then a title a sibling
        has, compared by its key, is page.title_taken, and a page deeper
        than ten levels page.too_deep. When the server parses as much
        content as it can at once, a content waits a moment, then is
        server_busy. A body that has not all arrived within the server's
        read timeout (server.read_timeout, 30 seconds by default, in which
        5 MiB needs about 1.4 Mbit/s) is bad_request.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden, validation_failed, page.title_taken, page.too_deep, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageCreate"
      responses:
        "201":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getPage
      tags: [page]
      summary: Get a page
      description: >-
        The page, with its ancestors and what it tells of its content. A page
        that does not exist, is deleted, or whose notebook the caller has no
        role in is page.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found]
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/content:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getPageContent
      tags: [page]
      summary: Read a page's content
      description: >-
        The page's Markdown, byte for byte as written, with its revision and
        hash. Any role in its notebook can read it. A page that does not
        exist, is deleted, or whose notebook the caller has no role in is
        page.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found]
      responses:
        "200":
          description: The page's content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPageContent
      tags: [page]
      summary: Write a page's content
      description: >-
        Replaces the page's content, byte for byte, on the revision the
        writer read it at; its notebook's editors and admins can, a reader
        cannot (forbidden). A content of more than 5 MiB (5,242,880 bytes)
        or with a NUL character is validation_failed first, whatever the
        page. Then a page that does not exist, is deleted, or whose notebook
        the caller has no role in is page.not_found; an edit session that is
        not the caller's session of this page, opened from the same client
        (the web or a token), is page.edit_session_ended; then one taken
        over by the caller elsewhere is page.edit_session_taken_over, one
        whose lock an admin of the notebook released is
        page.edit_session_unlocked, naming them in ended_by, and one no
        longer alive is page.edit_session_ended; a base_revision that is not
        the page's revision is page.revision_mismatch: the page was written
        since, and the writer reads it again. A content the page holds
        already writes nothing, whatever the base. Then a page whose lock
        another edit session holds, the caller's elsewhere among them, is
        page.locked, naming the holder in lock: a write in no session too.
        The writes of one edit session are one changeset, with one version
        of the page, until another write of the page comes in between. When the server parses as much content as it can at
        once, a content waits a moment, then is server_busy. A body that has
        not all arrived within the server's read timeout
        (server.read_timeout, 30 seconds by default, in which 5 MiB needs
        about 1.4 Mbit/s) is bad_request.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          validation_failed,
          page.not_found,
          forbidden,
          page.edit_session_ended,
          page.edit_session_taken_over,
          page.edit_session_unlocked,
          page.revision_mismatch,
          page.locked,
          server_busy,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageContentWrite"
      responses:
        "200":
          description: The page, as the write leaves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/edit-sessions:
    parameters:
      - $ref: "#/components/parameters/PageID"
    post:
      operationId: openEditSession
      tags: [page]
      summary: Open an edit session
      description: >-
        Opens the caller's edit session of the page: a lease of 120 seconds,
        which a heartbeat every 20 seconds keeps alive. The content's writes
        that name it are one changeset. The page's alive session holds its
        edit lock: while one does, another opening is page.locked, naming
        the holder in lock, the caller among them when they hold it
        elsewhere. With take_over, the caller's own alive sessions of the
        page end first (their next heartbeat or write is
        page.edit_session_taken_over); someone else's lock it does not
        pass. Its notebook's editors and admins can, a reader cannot
        (forbidden). A page that does not exist, is deleted, or whose
        notebook the caller has no role in is page.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden, page.locked]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSessionOpening"
      responses:
        "201":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSession"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/edit-lock:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getEditLock
      tags: [page]
      summary: Read a page's edit lock
      description: >-
        Who holds the page's edit lock, and for how many seconds its lease
        lasts unless a heartbeat keeps it; no holder while no alive session
        holds it. Whoever may read the page may read it. A page that does
        not exist, is deleted, or whose notebook the caller has no role in
        is page.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found]
      responses:
        "200":
          description: The page's edit lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditLock"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: releaseEditLock
      tags: [page]
      summary: Release a page's edit lock
      description: >-
        Ends whichever edit session holds the page's lock: its next
        heartbeat or write is page.edit_session_unlocked, naming the caller.
        A page no session holds is released already. Its notebook's admins
        can, anyone else in it cannot (forbidden). A page that does not
        exist, is deleted, or whose notebook the caller has no role in is
        page.not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden]
      responses:
        "204":
          description: No session holds the page's lock.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/view:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: getPageView
      tags: [page]
      summary: Read a page
      description: >-
        The page's reading view: its content rendered to HTML, its
        frontmatter's properties as a table first, and the revision it was
        rendered from. The HTML holds only what the renderer writes and a
        typographic allowlist of the content's own HTML, every address on
        this site, http(s) or mailto, and nothing loaded but an attachment's
        image, audio or video at a path of this site. In the content, a
        wikilink, an embed (nw-embed), and a Markdown link or image whose
        address is a path, from the root too, link to pages of the notebook
        and have no address, which the app gives: each carries the page it
        leads to as it reads now (data-nw-node) and its anchor's heading id
        (data-nw-anchor), or nw-unresolved and its target (data-nw-target).
        One that leads to an attachment (nw-asset) has its content's
        address, signed, which expires at assets_expire_at the earliest: an
        embed or an image of an image is its img, of the caption and the
        size written (|300, |300x200), or else of the image's own size; of
        an audio or a video, its element, the content's first 20 of them;
        any other is a link, data-nw-size its size in bytes, and download
        where the browser downloads the content (any type the server does
        not show: its mime is application/octet-stream), showing the others
        itself. Past the content's first 2000 addresses of attachments, in
        a link's text but for an image, and for an attachment deleted, it is
        text.
        A tag (nw-tag) of a name tag lists count links to its pages and has
        no address either: it carries the tag as this page writes it, but for
        its '#' and a last '/', which getTag takes (data-nw-tag); a tag the
        index does not keep of the page, its key longer than 1024 bytes or
        past the page's first 1000 tags, links still, though getTag does not
        list the page for it. A tag of a name the lists do
        not count (#1/) is a span, as are the tag "/" (#//), which getTag's
        path cannot name, and a tag in a link's text.
        A wikilink in a link's text is a span, as is one written with a
        block's anchor alone ([[#^b]]); one written with a heading's anchor
        alone ([[#h]]) has the heading's id as its address, as has a
        Markdown link to an anchor alone (#h), which is its text alone for a
        block's anchor or an empty one; an image of a page in a link's text
        has no link of its own. A table, the properties' table and a block formula
        are each in a div of class nw-scroll, a region of their own that
        may scroll sideways. In the properties' table, a string written on
        one line that is one link to a page or an attachment and nothing
        else, a wikilink
        with a target (not an anchor alone) or a Markdown link whose address
        is a path, is a link as in the
        content, without a title, showing the text the link shows; a value
        a YAML alias repeats, and every other value, is text. Once
        the page is in the link index (nervewiki reindex after an upgrade),
        a links event tells when where its links lead changes. A page that
        does not exist, is deleted, or whose notebook the caller has no role
        in is page.not_found alike. When the server parses as much content as
        it can at once, the page waits a moment, then is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, server_busy]
      responses:
        "200":
          description: The page's reading view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageView"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/versions:
    parameters:
      - $ref: "#/components/parameters/PageID"
    get:
      operationId: listPageVersions
      tags: [page]
      summary: List a page's versions
      description: >-
        The page's versions, newer first, a page at a time: each the content
        a changeset left, which it holds from after its base_revision to its
        revision, without the content. An edit session's saves are one
        version, whose revision moves on with each; the newest is editing
        while that session is alive. Renames and moves are not versions. A
        page in the trash has its versions too. Any role in the page's
        notebook can read them. A cursor the list cannot read is
        bad_request, before anything else; a page that does not exist,
        whose notebook is deleted, or whose notebook the caller has no role
        in is page.not_found; a limit outside 1–100 is validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, page.not_found, validation_failed]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the page's versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageVersionPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/versions/{revision}:
    parameters:
      - $ref: "#/components/parameters/PageID"
      - $ref: "#/components/parameters/Revision"
    get:
      operationId: getPageVersion
      tags: [page]
      summary: Read a version of a page
      description: >-
        The version of the page that holds the revision, with its content
        byte for byte as written, read at once. It is answered with its own
        revision, which differs from the one asked for when that is one of
        the earlier revisions an edit session's saves made it hold. A page
        in the trash has its versions too. Any role in
        the page's notebook can read them. A page that does not exist, whose
        notebook is deleted, or whose notebook the caller has no role in is
        page.not_found; a revision no version of the page holds, 0 and below
        among them, is page.version_not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, page.version_not_found]
      responses:
        "200":
          description: The version and its content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageVersionContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/versions/{revision}/view:
    parameters:
      - $ref: "#/components/parameters/PageID"
      - $ref: "#/components/parameters/Revision"
    get:
      operationId: getPageVersionView
      tags: [page]
      summary: Read a version of a page as a page
      description: >-
        The reading view of the version of the page that holds the revision,
        as getPageView renders a page's content: its links lead where they
        lead now, and revision is the version's own. A page in the trash has
        its versions too; its links lead where they would from where the
        page was, among the pages not deleted. Any role in the page's
        notebook can read them. A page that does not exist, whose notebook
        is deleted, or whose notebook the caller has no role in is
        page.not_found; a revision no version of the page holds, 0 and below
        among them, is page.version_not_found. When the server
        parses as much content as it can at once, the version waits a
        moment, then is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, page.version_not_found, server_busy]
      responses:
        "200":
          description: The version's reading view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageView"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/versions/{revision}/restore:
    parameters:
      - $ref: "#/components/parameters/PageID"
      - $ref: "#/components/parameters/Revision"
    post:
      operationId: restorePageVersion
      tags: [page]
      summary: Restore a version of a page
      description: >-
        Writes the content of the version that holds the revision as the
        page's, on base_revision, the revision the caller read the page at:
        a new version, in a changeset of its own, a version_restore. Its
        notebook's editors and admins can. A page that does not exist, is in
        the trash (restore it first), whose notebook is deleted, or whose
        notebook the caller has no role in is page.not_found; a revision no
        version of the page holds, 0 and below among them, is
        page.version_not_found; then a reader is forbidden; when the
        server parses as much content as it can at once, the content waits a
        moment, then is server_busy. A content the page holds already writes
        nothing, whatever the base: changed is false. Then a base_revision
        that is not the page's revision is page.revision_mismatch: the page
        was written since; then a page whose lock an edit session holds, the
        caller's elsewhere among them, is page.locked, naming the holder in
        lock.
      security: [{ bearer: [] }]
      x-problem-codes:
        [page.not_found, page.version_not_found, forbidden, server_busy, page.revision_mismatch, page.locked]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRestore"
      responses:
        "200":
          description: What the restore did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionRestored"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/pages/{page_id}/toggle-task:
    parameters:
      - $ref: "#/components/parameters/PageID"
    post:
      operationId: toggleTask
      tags: [page]
      summary: Tick or clear a task item
      description: >-
        Ticks the page's task item at offset (checked true) or clears it
        (false): the character between its brackets, at the byte offset in
        the content that the reading view's checkbox carries in data-task,
        becomes x or a space, and no other byte changes. Its notebook's
        editors and admins can, a reader cannot (forbidden). A page that
        does not exist, is deleted, or whose notebook the caller has no
        role in is page.not_found; a base_revision that is not the page's
        revision is page.revision_mismatch: an offset means something in
        that revision only. Then an offset that is no task item's, of that
        content, is validation_failed (out_of_range on offset), and a tick
        or a clear that would leave none there is too (not_allowed: ticking
        "- [ ]: /u" makes a link reference definition). A task item in that
        state already writes nothing: the page is answered as it is, or
        page.revision_mismatch if a write came since.
        Then a page whose lock an edit session holds, the caller's
        elsewhere among them, is page.locked, naming the holder in lock.
        When the server parses as much content as it can at once, a toggle
        waits a moment, then is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden, page.revision_mismatch, validation_failed, page.locked, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskToggle"
      responses:
        "200":
          description: The page, as the toggle leaves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/edit-sessions/{edit_session_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/EditSessionID"
    post:
      operationId: heartbeatEditSession
      tags: [page]
      summary: Keep an edit session alive
      description: >-
        Keeps the caller's session alive for 120 seconds from now. The
        caller's session, alive or ended by a take-over or an unlock, is
        page.edit_session_not_found when the caller has no role in its
        notebook any more, and forbidden when they may only read its page
        now. Otherwise the caller's session taken over elsewhere is
        page.edit_session_taken_over; one whose lock an admin of the
        notebook released is page.edit_session_unlocked, naming them in
        ended_by: the editor does not open another. Either answers so until
        its record is cleaned up, at least 120 seconds after the end. A
        session that does not exist, has expired, or is someone else's is
        page.edit_session_not_found alike: the editor opens a new one.
      security: [{ bearer: [] }]
      x-problem-codes:
        [page.edit_session_not_found, forbidden, page.edit_session_taken_over, page.edit_session_unlocked]
      responses:
        "200":
          description: The session, kept alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditSession"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/edit-sessions/{edit_session_id}:
    parameters:
      - $ref: "#/components/parameters/EditSessionID"
    delete:
      operationId: endEditSession
      tags: [page]
      summary: End an edit session
      description: >-
        Ends the caller's session: it asks only that the session is the
        caller's, and alive, or taken over or unlocked, expired or not until
        its record is cleaned up (its record goes). A session that does not
        exist, has expired otherwise, or is someone else's is
        page.edit_session_not_found alike, which the editor takes for ended.
      security: [{ bearer: [] }]
      x-problem-codes: [page.edit_session_not_found]
      responses:
        "204":
          description: The session is ended.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/nodes/{node_id}:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    patch:
      operationId: renameNode
      tags: [page]
      summary: Rename a page or an attachment
      description: >-
        Renames the node, a page or an attachment; its notebook's editors
        and admins can, a reader cannot (forbidden). A node that does not
        exist, is deleted, or whose notebook the caller has no role in is
        page.not_found; the name is checked after both: its rules are
        validation_failed, a name a sibling has, compared by its key, is
        page.title_taken. An attachment's name does not end with ".md", in
        any case, and keeps an extension when it had one (the extension may
        change): either is not_allowed on name. The node's own name writes
        nothing; one that differs from it in case alone is written. The
        links that led to the node, the attachment or the page and those
        under it, by a path that changes, and those the new name would lead
        elsewhere, are written again in the pages they are in, so that each
        leads where it did; when one of these pages is being edited, its own
        included, the rename is refused as a whole, linking.pages_locked
        naming each of them and its editor, and when their parse finds the
        server busy it is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes:
        [page.not_found, forbidden, validation_failed, page.title_taken, linking.pages_locked, server_busy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRename"
      responses:
        "200":
          description: The node, renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNode"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteNode
      tags: [page]
      summary: Delete a page or an attachment
      description: >-
        Deletes the node: a page with every node under it, its attachments
        among them, or an attachment, at one time: they go to the trash
        together, one item that restoreNode brings back until its
        restorable_until. Its notebook's editors and admins can, a reader
        cannot (forbidden). A node that does not exist, is deleted, or whose
        notebook the caller has no role in is page.not_found. While another
        account's edit session holds the lock of the page or of one under
        it, the deletion is page.locked, naming the first such page, level
        by level, and its holder in lock; the caller's own sessions end with
        their pages.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, forbidden, page.locked]
      responses:
        "204":
          description: The node and the nodes under it are deleted.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/nodes/{node_id}/move:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: moveNode
      tags: [page]
      summary: Move a page or an attachment
      description: >-
        Moves the node, a page with every node under it or an attachment:
        under another parent page, to the notebook's root, or among its
        siblings. Its notebook's editors and admins can, a reader cannot
        (forbidden). A node that does not exist, is deleted, or whose
        notebook the caller has no role in is page.not_found; the
        destination is checked after both: a parent that is no page of the
        notebook and a node to follow that is no other child of the parent
        are validation_failed; then a parent that is the node itself or
        under it is page.cycle, a title a new sibling
        has, compared by its key, page.title_taken, and a page under it
        that would be deeper than ten levels page.too_deep: an attachment
        is no level, and a page of the tenth holds them. A move to where
        the node is writes nothing. The links that led to the node, the
        attachment or the page and those under it, by a path that changes,
        the links in the moved pages that the move would lead elsewhere, and
        the links the moved nodes would take from other nodes, are written
        again in the pages they are in, so that each leads where it did;
        when one of these pages is being edited, one of the moved included,
        the move is refused as a whole, linking.pages_locked naming each of
        them and its editor, and when their parse finds the server busy it
        is server_busy.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          page.not_found,
          forbidden,
          validation_failed,
          page.cycle,
          page.title_taken,
          page.too_deep,
          linking.pages_locked,
          server_busy,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeMove"
      responses:
        "200":
          description: The node, moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeNode"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/trash:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: listTrash
      tags: [page]
      summary: List a notebook's trash
      description: >-
        The notebook's trash, newer first, a page at a time: each item a
        node deleted with the nodes under it at one time, by its root, while
        it can be restored, until restorable_until, the instance's
        trash_retention_seconds after its deletion. A node deleted with a
        page above it is no item of its own. Any role in the notebook can
        read it. A cursor the list cannot read is bad_request, before
        anything else; a notebook that does not exist, is deleted, or that
        the caller has no role in is notebook.not_found; a limit outside
        1–100 is validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, notebook.not_found, validation_failed]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the notebook's trash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashItemPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/nodes/{node_id}/trash-item:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      operationId: getTrashItem
      tags: [page]
      summary: Read a trash item
      description: >-
        The trash item whose root is the node, as listTrash lists it. Any
        role in the node's notebook can read it. A node that does not
        exist, whose notebook is deleted, or whose notebook the caller has no
        role in is page.not_found; then a node not deleted is
        page.not_in_trash; a node deleted with a page above it is
        page.not_trash_root, naming the root of its item in root_id; an item
        past its restorable_until is page.restore_expired.
      security: [{ bearer: [] }]
      x-problem-codes: [page.not_found, page.not_in_trash, page.not_trash_root, page.restore_expired]
      responses:
        "200":
          description: The trash item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashItem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/nodes/{node_id}/restore:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: restoreNode
      tags: [page]
      summary: Restore a trash item
      description: >-
        Brings back the trash item whose root is the node: the nodes deleted
        with it at one time, their contents, versions and attachments'
        files, in a changeset of its own, a trash_restore. Its notebook's
        editors and admins can. It goes back where it was, under its parent
        at its place among its siblings, or at the notebook's root where it
        was there; last at the notebook's root when its parent is in the
        trash (parent_in_trash) or when its pages would be deeper than ten
        levels under it (too_deep). When a sibling there has its name,
        compared by its key, it is numbered, "Name 2", an attachment's
        number before its extension, and renamed tells. It can be restored
        until its restorable_until. One restore brings back at most 10,000
        pages and attachments, whose versions and records in changesets are
        400,000 at most, and, of more than one page, at most 100 pages, 8
        MiB of content and 20,000 links. A node that does not exist, whose
        notebook is deleted, or whose notebook the caller has no role in is
        page.not_found; then a reader is forbidden; then a node not deleted
        is page.not_in_trash, a node deleted with a page above it
        page.not_trash_root naming the root of its item in root_id, an item
        past its restorable_until page.restore_expired; then an item past
        the bounds is page.restore_too_large; then an item one of whose
        pages' content the purge took is page.trash_changed, before any is
        parsed; when the server parses as much content as it can at once,
        the restore waits a moment, then is server_busy: the links are
        counted as the contents are parsed, so that their
        page.restore_too_large may come after it. An item restored, deleted
        again or purged in part since it was read is page.trash_changed, one
        past its restorable_until by the time it is restored
        page.restore_expired: read the trash again.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          page.not_found,
          forbidden,
          page.not_in_trash,
          page.not_trash_root,
          page.restore_expired,
          page.restore_too_large,
          server_busy,
          page.trash_changed,
        ]
      responses:
        "200":
          description: The item's root, restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeRestored"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/changesets:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: listChangesets
      tags: [page]
      summary: List a notebook's history
      description: >-
        The notebook's changesets, newer first by when each was first
        written, a page at a time: what each write of the notebook's tree
        and contents changed, by whom and from where, with its counts, the
        changesets that reverted it and its first three changes. A filter
        narrows it: actor, one account's; client, one client's (web, api,
        cli or mcp:<name>), or mcp, every MCP client's; page_id, those that
        changed the node, a page or an attachment, alive or in the trash.
        Any role in the notebook can read it. A cursor the list cannot read
        is bad_request, before anything else; a notebook that does not
        exist, is deleted, or that the caller has no role in is
        notebook.not_found; a page_id that is no node of the notebook, one
        the purge took among them, is page.not_found; a client that is none
        of those, or a limit outside 1–100, is validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, notebook.not_found, page.not_found, validation_failed]
      parameters:
        - name: actor
          in: query
          description: The account whose changesets to list.
          schema:
            type: string
            format: uuid
        - name: client
          in: query
          description: >-
            The client whose changesets to list: web, api, cli, mcp:<name>
            for one MCP client, or mcp for every one.
          schema:
            type: string
        - name: page_id
          in: query
          description: The node, a page or an attachment, whose changesets to list.
          schema:
            type: string
            format: uuid
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the notebook's history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesetPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/changesets/{changeset_id}:
    parameters:
      - $ref: "#/components/parameters/ChangesetID"
    get:
      operationId: getChangeset
      tags: [page]
      summary: Read a changeset
      description: >-
        The changeset as listChangesets lists it, and whether its first
        1,000 changes rename or move a node, whose revert leaves the links
        written to the new names and places as they are. Any role in its
        notebook can read it. A changeset that does not exist, whose
        notebook is deleted, or whose notebook the caller has no role in is
        page.changeset_not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [page.changeset_not_found]
      responses:
        "200":
          description: The changeset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesetDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/changesets/{changeset_id}/changes:
    parameters:
      - $ref: "#/components/parameters/ChangesetID"
    get:
      operationId: listChangesetChanges
      tags: [page]
      summary: List a changeset's changes
      description: >-
        What the changeset did to each node it changed, by node id, a page
        at a time: where the node was before and after it in the tree, and
        the version of its content it wrote. Any role in its notebook can
        read them. A cursor the list cannot read is bad_request, before
        anything else; a changeset that does not exist, whose notebook is
        deleted, or whose notebook the caller has no role in is
        page.changeset_not_found; a limit outside 1–100 is
        validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, page.changeset_not_found, validation_failed]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the changeset's changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesetChangePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/changesets/{changeset_id}/revert:
    parameters:
      - $ref: "#/components/parameters/ChangesetID"
    post:
      operationId: revertChangeset
      tags: [page]
      summary: Revert a changeset
      description: >-
        Puts every node the changeset changed back as it was before it, in a
        changeset of its own, a revert, whose message is the request's,
        whole or not at all. Its notebook's editors and admins can, whoever
        made the changeset. Each node is compared by its state, not by when
        it changed: it must be as the changeset left it, where it put it
        and with the content it wrote, a node it deleted still in its trash
        item where and as it deleted it, else it is changed; a node another
        changeset put back as it was before is changed too. A trash item
        that the revert of its restore, by a trash restore or by a revert,
        deleted again, wherever the restore had put it, is compared by its
        nodes alone. Nodes it created or restored go to the trash, at the
        revert's time; nodes it deleted come back where they were, with the
        names they had, their trash item whole, at its time; nodes it
        renamed or moved go back where they were, under the same name and
        order; pages whose content it wrote get back the content they had,
        as a new version. The links
        written by a rename or a move stay as they are. What stops a revert
        is a conflict, listed in conflicts, the first 100 of
        conflict_count: a node changed since, a trash item past its
        restorable_until (expired), a node that would go back under a
        parent no longer there (parent_gone) or into a cycle (cycle) or
        deeper than ten levels of pages (too_deep), a node another
        changeset put under one the revert deletes (children_added), a name
        another node took where one would go back (title_taken, naming the
        holder in holder_id). One revert puts back at most 10,000 nodes,
        in at most 1,500 steps, each a node put back where it was, a
        subtree deleted or a trash item restored; restores trash items
        whose versions and records in changesets are 400,000 at most; and,
        of more than one page, writes back or restores at most 100 pages,
        8 MiB of content and 20,000 links. A message that is empty, longer
        than 4,096 bytes, not UTF-8 or with a NUL is validation_failed;
        then a changeset that does not exist, whose notebook is deleted, or
        whose notebook the caller has no role in is
        page.changeset_not_found; a reader is forbidden; then a changeset
        part or all of which the purge took is page.changeset_trimmed; then
        one past the bounds of its nodes, its pages and bytes, or its
        history is page.revert_too_large; then the conflicts,
        page.revert_conflict; then a version to compare or write back that
        the purge took is page.changeset_trimmed; then one of more steps
        than 1,500 is page.revert_too_large, known once the revert is
        planned; then a content to write back or restore that the purge
        took is page.changeset_trimmed, before any content is parsed; when
        the server parses as much content as it can at once, the revert
        waits a moment, then is server_busy: the links are counted as the
        contents are parsed, so that their page.revert_too_large may come
        after it. The revert reads and checks it all again as it writes:
        page.changeset_trimmed, page.revert_too_large and
        page.revert_conflict for what changed meanwhile; then a page whose
        lock an edit session holds, the caller's elsewhere among them, is
        page.locked, naming the holder in lock. A changeset that, as it
        left its nodes, changed nothing, as an edit session that wrote its
        bytes back, writes nothing: changed is false.
      security: [{ bearer: [] }]
      x-problem-codes:
        [
          validation_failed,
          page.changeset_not_found,
          forbidden,
          page.changeset_trimmed,
          page.revert_too_large,
          page.revert_conflict,
          server_busy,
          page.locked,
        ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangesetRevert"
      responses:
        "200":
          description: What the revert did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesetReverted"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/workspaces/{slug}/search:
    parameters:
      - $ref: "#/components/parameters/WorkspaceSlug"
    get:
      operationId: searchWorkspace
      tags: [page]
      summary: Search a workspace
      description: >-
        The pages and attachments of the workspace's notebooks the caller
        sees, or of the one notebook_id names, whose name or content holds
        every term of q, newest change first, a page at a time. Any member
        can search; a guest sees the notebooks they were added to. Two
        tiers: the nodes whose name holds every term, then the pages whose
        name misses one and whose name or content holds each. Folded case
        matches alike, as do the characters of one simple case folding (ß
        and ẞ, σ, ς and Σ), but not a folding's expansion (strasse does not
        find straße), accents, full and half width, nor simplified and
        traditional Chinese; terms that fold alike are one, the first as
        written (ß ss is ß). A term of a single CJK character is found in
        names alone; so is one of single CJK characters apart (中·国) in a q
        no term of which holds a key of the content (a letter, digit or
        mark, or two CJK characters in a row), and anywhere in another; one
        of two CJK characters or more, or of three letters or digits or
        more, anywhere, as a substring (api finds rapid); one of one or two
        letters or digits as a whole word, CJK characters bounding it (go
        finds Go语言, 20 does not find 2020年); a term of letters and CJK
        characters as a whole, its short runs of letters at its ends whole
        words (A股). Signs and punctuation match as written. Each write a
        user makes through a request is found at once, as committed; nodes
        an import, a background restore or revert, an upgrade or nervewiki
        reindex wrote are found once the server's job built their index,
        until when building is true and the hits may be missing some. A page
        of the content tier checks at most 500 pages' contents: a page may
        hold fewer hits than limit, or none, with a next_cursor to search
        on. q travels in the request line, which a reverse proxy may log. A
        cursor the search cannot read is bad_request, before anything else;
        then a q missing or blank (required), longer than 256 bytes, of more
        than 8 terms or of more than 64 ASCII letters and digits in a row
        (too_long), not UTF-8 or holding NUL (invalid_format), or of no
        letter, digit or CJK character (not_allowed) is validation_failed;
        then a workspace that does not exist, is deleted, or that the caller
        is no active member of is workspace.not_found; a notebook_id the
        caller does not see, notebook.not_found; a limit outside 1–50 is
        validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, validation_failed, workspace.not_found, notebook.not_found]
      parameters:
        - name: q
          in: query
          description: >-
            The terms, parted by white space, each found in a node's name or
            a page's content. Absent or blank is validation_failed on q
            (required).
          schema:
            type: string
        - name: notebook_id
          in: query
          description: The one notebook to search; every notebook the caller sees when absent.
          schema:
            type: string
            format: uuid
        - $ref: "../common.yaml#/components/parameters/Cursor"
        - $ref: "#/components/parameters/SearchLimit"
      responses:
        "200":
          description: A page of the search's hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        default:
          $ref: "#/components/responses/Problem"
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    WorkspaceSlug:
      name: slug
      in: path
      required: true
      description: >-
        The workspace's slug. It carries no pattern here: a slug spelled
        wrong names no workspace, which the operation answers itself.
      schema:
        type: string
    SearchLimit:
      name: limit
      in: query
      description: >-
        The page size, 1–50; 20 when absent: each hit of the content tier is
        checked in its content. Outside that range the answer is 422
        validation_failed on limit.
      schema:
        type: integer
    NotebookID:
      name: notebook_id
      in: path
      required: true
      description: The notebook's id.
      schema:
        type: string
        format: uuid
    PageID:
      name: page_id
      in: path
      required: true
      description: The page's id.
      schema:
        type: string
        format: uuid
    Revision:
      name: revision
      in: path
      required: true
      description: A revision the version holds.
      schema:
        type: integer
    EditSessionID:
      name: edit_session_id
      in: path
      required: true
      description: The edit session's id.
      schema:
        type: string
        format: uuid
    NodeID:
      name: node_id
      in: path
      required: true
      description: The id of a node of a notebook's tree.
      schema:
        type: string
        format: uuid
    ChangesetID:
      name: changeset_id
      in: path
      required: true
      description: The changeset's id.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    NodeKind:
      description: >-
        What a node of the tree is: a page, or an attachment, a file at the
        root or under a page, which no node is under.
      type: string
      enum: [page, asset]
    TreeNode:
      description: A node of a notebook's tree, a page or an attachment.
      type: object
      additionalProperties: false
      required: [id, notebook_id, parent_id, kind, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        parent_id:
          description: The parent page; null at the notebook's root.
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          description: The page's title, or the attachment's file name.
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          description: >-
            When the node was last created, renamed, moved or restored from the trash; its content's writes do not
            change it.
          type: string
          format: date-time
    TreeNodeList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
    Ancestor:
      description: A page above another, on the way from the root.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Page:
      description: >-
        A page: its node, its ancestors and what it tells of its content.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          parent_id,
          kind,
          name,
          created_at,
          updated_at,
          ancestors,
          revision,
          byte_size,
          content_updated_at,
          content_updated_by,
        ]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        parent_id:
          description: The parent page; null at the notebook's root.
          type: [string, "null"]
          format: uuid
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          description: The page's title.
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          description: >-
            When the page was last created, renamed, moved or restored from the trash; its content's writes do not
            change it.
          type: string
          format: date-time
        ancestors:
          description: The pages above it, from the root down to its parent; none at the root.
          type: array
          items:
            $ref: "#/components/schemas/Ancestor"
        revision:
          description: The content's version, 1 for a new page; each write of the content adds one.
          type: integer
        byte_size:
          description: The content's size in bytes.
          type: integer
        content_updated_at:
          description: When the content was last written.
          type: string
          format: date-time
        content_updated_by:
          description: The account that last wrote the content.
          type: string
          format: uuid
    PageView:
      description: A page's reading view.
      type: object
      additionalProperties: false
      required: [html, revision, assets_expire_at]
      properties:
        html:
          description: >-
            The content rendered to HTML. The attachments its links lead to are shown at their contents' addresses,
            signed, each a path of this site, as getPageView tells: an image, an audio or a video embedded, a link to
            any other; text past the first addresses, and in a link's text but for an image.
          type: string
        revision:
          description: The content's version the HTML was rendered from.
          type: integer
        assets_expire_at:
          description: >-
            When the earliest of the attachments' addresses in the HTML expires, after which the view is to be read
            again; null for a view with none.
          type: [string, "null"]
          format: date-time
    PageVersionPage:
      description: A page of a page's versions, newer first.
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PageVersion"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
    PageVersion:
      description: >-
        A version of a page: the content a changeset left, which it holds from after base_revision to revision.
      type: object
      additionalProperties: false
      required: [id, revision, base_revision, byte_size, created_at, updated_at, editing, changeset]
      properties:
        id:
          description: The version's own id, which stays as an edit session's saves move its revision on.
          type: string
          format: uuid
        revision:
          description: The revision the version wrote, the last it holds.
          type: integer
        base_revision:
          description: The revision the version was written on; null for the version that created the page.
          type: [integer, "null"]
        byte_size:
          description: The content's size in bytes.
          type: integer
        created_at:
          description: When the version was first written; an edit session's, at its first save.
          type: string
          format: date-time
        updated_at:
          description: When the version was last written.
          type: string
          format: date-time
        editing:
          description: >-
            The page's newest version, while the edit session whose changeset it is is alive: its revision may move
            on.
          type: boolean
        changeset:
          $ref: "#/components/schemas/VersionChangeset"
    PageVersionContent:
      description: A version of a page, with its content.
      type: object
      additionalProperties: false
      required: [id, revision, base_revision, byte_size, created_at, updated_at, editing, changeset, content]
      properties:
        id:
          description: The version's own id, which stays as an edit session's saves move its revision on.
          type: string
          format: uuid
        revision:
          description: The revision the version wrote, the last it holds.
          type: integer
        base_revision:
          description: The revision the version was written on; null for the version that created the page.
          type: [integer, "null"]
        byte_size:
          description: The content's size in bytes.
          type: integer
        created_at:
          description: When the version was first written; an edit session's, at its first save.
          type: string
          format: date-time
        updated_at:
          description: When the version was last written.
          type: string
          format: date-time
        editing:
          description: >-
            The page's newest version, while the edit session whose changeset it is is alive: its revision may move
            on.
          type: boolean
        changeset:
          $ref: "#/components/schemas/VersionChangeset"
        content:
          $ref: "#/components/schemas/Content"
    VersionChangeset:
      description: The changeset a version is of, and the account it is by.
      type: object
      additionalProperties: false
      required: [id, kind, client, created_at, created_by]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChangesetKind"
        client:
          description: Where the changeset's writes came from, web, api, cli, or mcp:<name> for an MCP client.
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: "../common.yaml#/components/schemas/UserRef"
    ChangesetKind:
      description: >-
        What a changeset records: an edit, an import, a version restored, a node restored from the trash, or the
        revert of another changeset.
      type: string
      enum: [edit, import, version_restore, trash_restore, revert]
    VersionRestore:
      description: A restore of a version.
      type: object
      additionalProperties: false
      required: [base_revision]
      properties:
        base_revision:
          description: The revision the page was read at.
          type: integer
    VersionRestored:
      description: >-
        What a restore did: the page's revision as it leaves it, and its changeset, null when the page held the
        version's content already and nothing was written.
      type: object
      additionalProperties: false
      required: [revision, changeset_id, changed]
      properties:
        revision:
          description: The page's revision as the restore leaves it.
          type: integer
        changeset_id:
          type: [string, "null"]
          format: uuid
        changed:
          description: Whether the restore wrote the page.
          type: boolean
    TrashItemPage:
      description: A page of a notebook's trash, newer first.
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TrashItem"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
    TrashItem:
      description: >-
        A trash item: a node deleted with the nodes under it at one time, by its root, as it was deleted, and who
        deleted it, deleted_by.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          kind,
          name,
          ancestors,
          deleted_at,
          deleted_by,
          restorable_until,
          pages,
          assets,
          restore_to,
          revision,
          asset,
        ]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          description: The page's title, or the attachment's file name.
          type: string
        ancestors:
          description: >-
            The pages it was under, from the root down to its parent, those in the trash among them; none at the root.
          type: array
          items:
            $ref: "#/components/schemas/Ancestor"
        deleted_at:
          type: string
          format: date-time
        deleted_by:
          $ref: "../common.yaml#/components/schemas/UserRef"
        restorable_until:
          description: Until when it can be restored, the instance's trash_retention_seconds after its deletion.
          type: string
          format: date-time
        pages:
          description: The pages deleted with it, itself among them when it is a page.
          type: integer
          minimum: 0
        assets:
          description: The attachments deleted with it, itself among them when it is an attachment.
          type: integer
          minimum: 0
        restore_to:
          $ref: "../common.yaml#/components/schemas/TrashPlacement"
        revision:
          description: >-
            A page's content's revision as it was deleted, whose version getPageVersionView shows; null for an
            attachment, and for a page whose content the purge took.
          type: [integer, "null"]
        asset:
          description: An attachment's type and size; null for a page, and for an attachment whose file the purge took.
          anyOf:
            - $ref: "#/components/schemas/AttachmentInfo"
            - type: "null"
    AttachmentInfo:
      description: An attachment's file's type and size.
      type: object
      additionalProperties: false
      required: [mime, byte_size]
      properties:
        mime:
          description: The file's media type.
          type: string
        byte_size:
          description: The file's size in bytes.
          type: integer
          format: int64
    SearchPage:
      description: >-
        A page of a search's hits, the title tier's first, then the content
        tier's, each newest change first.
      type: object
      additionalProperties: false
      required: [data, next_cursor, count, building]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
        count:
          description: >-
            How many hits there are, on the first page alone; null on the
            later pages, and when none was found yet while the search has
            more to check.
          anyOf:
            - $ref: "#/components/schemas/SearchCount"
            - type: "null"
        building:
          description: >-
            The notebooks hold nodes the server's job has not indexed yet,
            after an import, a background restore or revert, an upgrade or
            nervewiki reindex: the hits may be missing some.
          type: boolean
    SearchCount:
      description: >-
        A search's count: exact when the first page held every hit, or when
        q is found in names alone; about, estimated from the hits checked so
        far, to two significant digits; at_least, a lower bound: 1000
        always; the hits seen when too few of the contents checked so far
        held the terms; the estimate, rounded down, when the candidates were
        too many to count.
      type: object
      additionalProperties: false
      required: [value, kind]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 1000
        kind:
          type: string
          enum: [exact, about, at_least]
    SearchHit:
      description: >-
        A node a search found: where it is, its name's hits, a page's
        content around its first hit, and when it last changed.
      type: object
      additionalProperties: false
      required: [node, ancestors, title_hits, excerpt, changed_at, attachment]
      properties:
        node:
          $ref: "#/components/schemas/SearchNode"
        ancestors:
          description: The pages it is under, from the root down to its parent; none at the root.
          type: array
          items:
            $ref: "#/components/schemas/Ancestor"
        title_hits:
          description: The terms' hits in its name.
          type: array
          items:
            $ref: "#/components/schemas/TextRange"
        excerpt:
          description: A page's content around its first hit; null for an attachment, and when the content holds none.
          anyOf:
            - $ref: "#/components/schemas/SearchExcerpt"
            - type: "null"
        changed_at:
          description: >-
            When its name, its place or its content last changed: a
            TreeNode's updated_at leaves out the content's writes.
          type: string
          format: date-time
        attachment:
          description: An attachment's type and size; null for a page, and for an attachment whose file is not there.
          anyOf:
            - $ref: "#/components/schemas/AttachmentInfo"
            - type: "null"
    SearchNode:
      description: A page or an attachment a search found.
      type: object
      additionalProperties: false
      required: [id, notebook_id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          description: The page's title, or the attachment's file name.
          type: string
    SearchExcerpt:
      description: >-
        Some 160 characters of a page's content as written, composed into
        Unicode's NFC where it was not (the editor writes NFC), its Markdown
        left in, its white space collapsed to single spaces, from a little
        before its first hit; the hits in it.
      type: object
      additionalProperties: false
      required: [text, hits, cut_start, cut_end]
      properties:
        text:
          type: string
        hits:
          description: The terms' hits in text.
          type: array
          items:
            $ref: "#/components/schemas/TextRange"
        cut_start:
          description: The content goes on before text.
          type: boolean
        cut_end:
          description: The content goes on after text.
          type: boolean
    TextRange:
      description: >-
        A hit in a text, from start up to end, which it does not hold, in
        UTF-16 code units, as JavaScript's strings count them. A list's
        ranges are sorted and do not overlap.
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
    NodeRestored:
      description: What a restore did.
      type: object
      additionalProperties: false
      required: [id, kind, name, renamed, placed, changeset_id]
      properties:
        id:
          description: The item's root.
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          description: Its name as the restore leaves it.
          type: string
        renamed:
          description: Whether it was numbered, a sibling where it went back having its name.
          type: boolean
        placed:
          $ref: "../common.yaml#/components/schemas/TrashPlacement"
        changeset_id:
          description: The restore's changeset, a trash_restore.
          type: string
          format: uuid
    ChangesetPage:
      description: A page of a notebook's history, newer first.
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Changeset"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
    Changeset:
      description: >-
        A changeset of a notebook's history: the writes one action made, by whom and from where, and what they
        changed.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          kind,
          client,
          message,
          created_by,
          created_at,
          updated_at,
          reverts,
          reverted_by,
          trimmed,
          node_count,
          content_count,
          changes,
        ]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChangesetKind"
        client:
          description: Where the changeset's writes came from, web, api, cli, or mcp:<name> for an MCP client.
          type: string
        message:
          description: Why it was made, as a revert's request said; null for none.
          type: [string, "null"]
        created_by:
          $ref: "../common.yaml#/components/schemas/UserRef"
        created_at:
          description: When it was first written, which the history is ordered by.
          type: string
          format: date-time
        updated_at:
          description: When it was last written; an edit session's, at its last save.
          type: string
          format: date-time
        reverts:
          description: >-
            The changeset a revert reverts; null for any other, and for a revert whose changeset the purge took.
          anyOf:
            - $ref: "#/components/schemas/ChangesetBrief"
            - type: "null"
        reverted_by:
          description: The reverts of it, newer first, the newest 100.
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        trimmed:
          description: >-
            Whether the purge took part of what it changed, its nodes long in the trash: it can no longer be
            reverted.
          type: boolean
        node_count:
          description: >-
            How many nodes it changed in the tree, counted up to 1000: 1000 is as many or more.
          type: integer
          minimum: 0
          maximum: 1000
        content_count:
          description: >-
            How many pages' contents it wrote, counted up to 1000: 1000 is as many or more.
          type: integer
          minimum: 0
          maximum: 1000
        changes:
          description: Its first three changes, by node id.
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ChangesetChange"
    # Changeset 的每个属性加上 renames、moves 两项，与 Changeset 同步改：不用 allOf，Changeset 的
    # additionalProperties: false 会拒绝多出的两项。
    ChangesetDetail:
      description: >-
        A changeset, as Changeset, and whether its first 1,000 changes rename or move a node.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          kind,
          client,
          message,
          created_by,
          created_at,
          updated_at,
          reverts,
          reverted_by,
          trimmed,
          node_count,
          content_count,
          changes,
          renames,
          moves,
        ]
      properties:
        id:
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChangesetKind"
        client:
          description: Where the changeset's writes came from, web, api, cli, or mcp:<name> for an MCP client.
          type: string
        message:
          description: Why it was made, as a revert's request said; null for none.
          type: [string, "null"]
        created_by:
          $ref: "../common.yaml#/components/schemas/UserRef"
        created_at:
          description: When it was first written, which the history is ordered by.
          type: string
          format: date-time
        updated_at:
          description: When it was last written; an edit session's, at its last save.
          type: string
          format: date-time
        reverts:
          description: >-
            The changeset a revert reverts; null for any other, and for a revert whose changeset the purge took.
          anyOf:
            - $ref: "#/components/schemas/ChangesetBrief"
            - type: "null"
        reverted_by:
          description: The reverts of it, newer first, the newest 100.
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        trimmed:
          description: >-
            Whether the purge took part of what it changed, its nodes long in the trash: it can no longer be
            reverted.
          type: boolean
        node_count:
          description: >-
            How many nodes it changed in the tree, counted up to 1000: 1000 is as many or more.
          type: integer
          minimum: 0
          maximum: 1000
        content_count:
          description: >-
            How many pages' contents it wrote, counted up to 1000: 1000 is as many or more.
          type: integer
          minimum: 0
          maximum: 1000
        changes:
          description: Its first three changes, by node id.
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ChangesetChange"
        renames:
          description: Whether its first 1,000 changes rename a node.
          type: boolean
        moves:
          description: Whether its first 1,000 changes move a node under another parent.
          type: boolean
    ChangesetBrief:
      description: A changeset, by its id, kind, author and time.
      type: object
      additionalProperties: false
      required: [id, kind, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChangesetKind"
        created_by:
          $ref: "../common.yaml#/components/schemas/UserRef"
        created_at:
          type: string
          format: date-time
    ChangesetChangePage:
      description: A page of a changeset's changes, by node id.
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChangesetChange"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
    ChangesetChange:
      description: >-
        What a changeset did to a node: kind, created, restored from the trash, deleted, moved under another
        parent, renamed, reordered among its siblings, or its content written; where it was before and after in
        the tree, and the version of its content it wrote.
      type: object
      additionalProperties: false
      required: [node, kind, before, after, content]
      properties:
        node:
          $ref: "#/components/schemas/ChangeNode"
        kind:
          type: string
          enum: [created, restored, deleted, moved, renamed, reordered, content]
        before:
          description: Where the node was before; null for a node created or restored, and for a content's write alone.
          anyOf:
            - $ref: "#/components/schemas/ChangeState"
            - type: "null"
        after:
          description: Where the node was after; null for a node deleted, and for a content's write alone.
          anyOf:
            - $ref: "#/components/schemas/ChangeState"
            - type: "null"
        content:
          description: The version of the page's content it wrote; null for none.
          anyOf:
            - $ref: "#/components/schemas/ChangeContent"
            - type: "null"
    ChangeNode:
      description: A node a changeset changed, as it is now.
      type: object
      additionalProperties: false
      required: [id, kind, name, alive]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          description: Its name now.
          type: string
        alive:
          description: Whether it is alive; false in the trash.
          type: boolean
    ChangeState:
      description: Where a node was in the tree.
      type: object
      additionalProperties: false
      required: [parent_id, parent_name, name]
      properties:
        parent_id:
          description: The parent page; null at the notebook's root.
          type: [string, "null"]
          format: uuid
        parent_name:
          description: The parent's name now; null at the root, and for a parent the purge took.
          type: [string, "null"]
        name:
          description: The node's name there.
          type: string
    ChangeContent:
      description: A version of a page's content a changeset wrote.
      type: object
      additionalProperties: false
      required: [base_revision, revision]
      properties:
        base_revision:
          description: The revision it was written on; null for the version that created the page.
          type: [integer, "null"]
        revision:
          description: The revision it wrote.
          type: integer
    ChangesetRevert:
      description: A revert of a changeset; an empty request has no message.
      type: object
      additionalProperties: false
      properties:
        message:
          description: >-
            Why, kept with the revert's changeset: 1–4,096 bytes of UTF-8, without NUL characters.
          type: string
    ChangesetReverted:
      description: >-
        What a revert did: its changeset, null when the changeset, as it left its nodes, changed nothing (an edit
        session that wrote its bytes back) and nothing was written.
      type: object
      additionalProperties: false
      required: [changeset_id, changed]
      properties:
        changeset_id:
          type: [string, "null"]
          format: uuid
        changed:
          description: Whether the revert wrote anything.
          type: boolean
    PageCreate:
      description: A new page.
      type: object
      additionalProperties: false
      required: [parent_id, title]
      properties:
        parent_id:
          description: The parent page; null for the notebook's root.
          type: [string, "null"]
          format: uuid
        title:
          $ref: "#/components/schemas/Title"
        after_id:
          description: >-
            The sibling the page goes right after; null puts it first,
            absent last.
          type: [string, "null"]
          format: uuid
        content:
          $ref: "#/components/schemas/Content"
    PageContent:
      description: A page's content.
      type: object
      additionalProperties: false
      required: [content, revision, content_hash]
      properties:
        content:
          $ref: "#/components/schemas/Content"
        revision:
          description: The content's version.
          type: integer
        content_hash:
          description: The SHA-256 of the content's bytes, in lower-case hexadecimal.
          type: string
          pattern: "^[0-9a-f]{64}$"
    PageContentWrite:
      description: A page's new content.
      type: object
      additionalProperties: false
      required: [content, base_revision]
      properties:
        content:
          $ref: "#/components/schemas/Content"
        base_revision:
          description: The revision the content was read at.
          type: integer
        edit_session_id:
          description: The caller's edit session of the page the write is made in.
          type: string
          format: uuid
    EditSession:
      description: An edit session of a page, while its lease lasts.
      type: object
      additionalProperties: false
      required: [id, page_id, expires_at]
      properties:
        id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        expires_at:
          description: When the session ends unless a heartbeat keeps it alive.
          type: string
          format: date-time
    EditSessionOpening:
      description: How an edit session opens.
      type: object
      additionalProperties: false
      properties:
        take_over:
          description: >-
            End the caller's own alive sessions of the page first, wherever
            they were opened.
          type: boolean
          default: false
    TaskToggle:
      description: A tick or a clear of a task item.
      type: object
      additionalProperties: false
      required: [base_revision, offset, checked]
      properties:
        base_revision:
          description: The revision the offset was read at, the reading view's.
          type: integer
        offset:
          description: >-
            The byte offset in the content of the character between the
            item's brackets: its checkbox's data-task.
          type: integer
        checked:
          description: Tick the item (true) or clear it (false).
          type: boolean
    EditLock:
      description: A page's edit lock.
      type: object
      additionalProperties: false
      required: [holder, expires_in]
      properties:
        holder:
          description: The account whose alive edit session holds the lock; null while no one does.
          anyOf:
            - $ref: "../common.yaml#/components/schemas/UserRef"
            - type: "null"
        expires_in:
          description: >-
            Whole seconds, rounded up, until the holder's lease ends unless a
            heartbeat keeps it; null while no one holds the lock. A span, not
            a time: the client's clock may be wrong.
          type: [integer, "null"]
          minimum: 1
    Content:
      description: >-
        A page's Markdown, byte for byte: at most 5 MiB (5,242,880 bytes)
        of UTF-8, without NUL characters. Its line breaks, byte order mark
        and blanks are kept as they are.
      type: string
    NodeMove:
      description: Where a page goes.
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id:
          description: The new parent page; null for the notebook's root.
          type: [string, "null"]
          format: uuid
        after_id:
          description: >-
            The sibling the page goes right after; null puts it first,
            absent last.
          type: [string, "null"]
          format: uuid
    NodeRename:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Title"
    Title:
      description: >-
        1–255 bytes after the surrounding blanks are trimmed and the text is
        in NFC; none of / \ : * ? " < > | # ^ [ ] nor control characters; not
        starting or ending with a dot; no name Windows reserves (CON, COM1, …).
        It is the file's name when the notebook is exported. Siblings' titles
        differ in more than case: they compare by Unicode case folding.
      type: string
