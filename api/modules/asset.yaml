# asset 模块的接口：附件的上传、元数据、列表与下载（M7/P2）。上传与下载是原样的操作（x-raw）：处理器是模块手写的，逐字节读写，
# 不进代码生成（oapi-codegen.yaml 的 exclude-operation-ids）；其余的生成在
# server/internal/modules/asset/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve Wiki asset API
  version: v0
paths:
  /api/v0/notebooks/{notebook_id}/assets:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: uploadAsset
      tags: [asset]
      summary: Upload an attachment
      description: >-
        Uploads a file as an attachment of the notebook, under a page or at
        its root, last among its siblings; its notebook's editors and admins
        can, a reader cannot (forbidden). The body is multipart/form-data
        whose parts are parent_id, name and file, in that order, the first
        two optional: an unknown part, one twice, one out of order, a part
        after the file, a parent_id that is no id, a name of more than 1 KiB
        or not UTF-8, more than 4 KiB read before the file's bytes, no file,
        and a body that goes on after the form past the limit are
        bad_request.
        Each part is read as sent: a Content-Transfer-Encoding is not
        decoded. Without a name, or with one empty or of blanks, the file
        part's file name is taken.
        Before the file is read, a notebook that does not exist, is deleted,
        or that the caller has no role in is notebook.not_found; the name
        follows a page's title's rules and does not end with ".md", in any
        case, and the parent is a page of the notebook (validation_failed);
        a name a sibling has, compared by its key, is page.title_taken; and
        a server whose storage keeps no more room is storage_full: a client
        answered before it sent its file may see the connection reset, and
        checks these first. A file larger than the instance's
        asset_max_bytes is payload_too_large; one that does not arrive at
        the instance's lowest rate is cut off, as is one still arriving when
        the server shuts down. A file the storage runs out of room for is
        storage_full. The checks are made again as the attachment is
        created. The server tells the file's type from its name's
        extension and its first bytes, and reads an image's size.
      security: [{ bearer: [] }]
      x-raw: true
      x-problem-codes: [notebook.not_found, forbidden, validation_failed, page.title_taken, storage_full]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                parent_id:
                  description: The page to put the attachment under; none puts it at the notebook's root.
                  type: string
                  format: uuid
                name:
                  description: The attachment's name; none, or one empty or of blanks, takes the file part's file name.
                  type: string
                file:
                  description: The file, the last part.
                  type: string
                  format: binary
      responses:
        "201":
          description: The attachment, uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listAssets
      tags: [asset]
      summary: List the attachments under a page
      description: >-
        The attachments under a page of the notebook, or at its root without
        parent_id, by name, compared by its key, then id, a page at a time,
        each with its addresses signed. Any role in the notebook can list
        them. A cursor the list cannot read is bad_request, before anything
        else; a notebook that does not exist, is deleted, or that the caller
        has no role in is notebook.not_found; a parent_id that is no page of
        the notebook, or a deleted one, is page.not_found; a limit outside
        1–100 is validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, notebook.not_found, page.not_found, validation_failed]
      parameters:
        - name: parent_id
          in: query
          description: The page whose attachments to list; absent for the notebook's root.
          schema:
            type: string
            format: uuid
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/assets/{node_id}:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      operationId: getAsset
      tags: [asset]
      summary: Read an attachment
      description: >-
        The attachment, its addresses signed. Any role in its notebook can
        read it. A node that does not exist, is deleted, is no attachment, or
        whose notebook the caller has no role in is asset.not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [asset.not_found]
      responses:
        "200":
          description: The attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/assets/{node_id}/content:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      operationId: getAssetContent
      tags: [asset]
      summary: Download an attachment's content
      description: >-
        The attachment's file, at the address getAsset, listAssets,
        uploadAsset, getPageView (in its HTML) and getPageProperties (a
        link's url) sign: anyone who has the address can open it, without a
        token, until it expires. The address is read as the server writes
        it: the path's id, then the query b, e, s and, to download whatever
        the type, d=1, in this order, each once, nothing escaped; anything
        else, a signature that does not match, an address expired, and an
        attachment deleted since are not_found, alike. An image, an audio, a
        video or a PDF is shown, any other file downloaded, under its name;
        every answer is sandboxed (Content-Security-Policy) and readable by
        no other site, and a file's is cached privately until the address
        expires. A range and the conditions on a copy the client holds are
        answered (206, 304, 416); a Range of several ranges is passed by, the
        whole file sent (200). What an address serves never changes, so a
        condition on a change (If-Match, If-Unmodified-Since) is passed by.
        The addresses share a bucket of their own, by client IP
        (rate_limited). A download still sending when the server shuts down
        is cut off; one asked for then is server_busy.
      security: []
      x-raw: true
      x-problem-codes: [not_found, server_busy]
      parameters:
        - name: b
          in: query
          required: true
          description: The file's id, as the signed address has it.
          schema:
            type: string
        - name: e
          in: query
          required: true
          description: When the address expires, in Unix seconds, as the signed address has it.
          schema:
            type: string
        - name: s
          in: query
          required: true
          description: The address's signature.
          schema:
            type: string
        - name: d
          in: query
          description: 1 to download the file whatever its type, as the download address has it.
          schema:
            type: string
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/CrossOriginResourcePolicy"
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          description: The range of the file asked for.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/CrossOriginResourcePolicy"
            Content-Range:
              description: The range sent, and the file's size.
              required: true
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "304":
          description: The file has not changed since the copy the request names.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
        "416":
          description: No range asked for is in the file; Content-Range tells its size.
          headers:
            Content-Security-Policy:
              $ref: "#/components/headers/ContentSecurityPolicy"
            Content-Range:
              description: The file's size, as bytes */<size>.
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    NotebookID:
      name: notebook_id
      in: path
      required: true
      description: The notebook's id.
      schema:
        type: string
        format: uuid
    NodeID:
      name: node_id
      in: path
      required: true
      description: The id of a node of a notebook's tree.
      schema:
        type: string
        format: uuid
  headers:
    ContentDisposition:
      description: >-
        inline for a file shown, attachment for one downloaded, with its
        name (RFC 6266: filename in ASCII, filename* in UTF-8).
      required: true
      schema:
        type: string
    ETag:
      description: The file's SHA-256, in lower-case hexadecimal, quoted.
      required: true
      schema:
        type: string
    CacheControl:
      description: private, max-age of the seconds the address has left, immutable.
      required: true
      schema:
        type: string
    ContentSecurityPolicy:
      description: >-
        The sandbox every answer of a content runs in: no script, an opaque
        origin, nothing asked of another server, images and media of this
        one alone.
      required: true
      schema:
        type: string
    CrossOriginResourcePolicy:
      description: same-origin, that no other site reads the content.
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    AssetPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
    Asset:
      description: >-
        An attachment: its node in the notebook's tree, its file, and the
        addresses of its content, signed for anyone who has them.
      type: object
      additionalProperties: false
      required:
        [
          id,
          notebook_id,
          parent_id,
          name,
          link,
          mime,
          byte_size,
          sha256,
          width,
          height,
          created_by,
          created_at,
          content_url,
          download_url,
          expires_at,
        ]
      properties:
        id:
          description: The attachment's node.
          type: string
          format: uuid
        notebook_id:
          type: string
          format: uuid
        parent_id:
          description: The page it is under; null at the notebook's root.
          type: [string, "null"]
          format: uuid
        name:
          description: The attachment's file name.
          type: string
        link:
          description: >-
            How a wikilink, ![[link]] to embed it, is written to lead to the
            attachment alone from anywhere in the notebook, as the link
            targets write it: its name, or its path from the root where
            another attachment has its name's title key. It is as of the
            answer: another attachment given that title key later may make
            the name lead elsewhere. Null for an attachment without an
            extension, which no link leads to.
          type: [string, "null"]
        mime:
          description: >-
            The type the server told from the name's extension and the
            file's first bytes, which it serves the content as: an image, an
            audio, a video or a PDF it shows; application/octet-stream for
            any other file, which is downloaded.
          type: string
        byte_size:
          description: The file's size in bytes.
          type: integer
          format: int64
        sha256:
          description: The file's SHA-256, in lower-case hexadecimal.
          type: string
        width:
          description: An image's width in pixels (PNG, JPEG, GIF), when the server read it; null otherwise.
          type: [integer, "null"]
        height:
          description: An image's height in pixels, as width.
          type: [integer, "null"]
        created_by:
          description: Who uploaded it.
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        content_url:
          description: >-
            The address of the content, on this server, which a browser opens
            without a token until expires_at: an image, an audio, a video or
            a PDF is shown, any other file downloaded.
          type: string
        download_url:
          description: The address of the content to download, whatever its type, until expires_at.
          type: string
        expires_at:
          description: >-
            When the addresses stop working, one to two hours after they
            were signed; reading the attachment again signs new ones.
          type: string
          format: date-time
