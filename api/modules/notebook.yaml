# notebook 模块的接口：笔记本、成员与无主笔记本。生成的 Go 代码在
# server/internal/modules/notebook/adapter/http/gen（make gen-go）。
openapi: 3.1.0
info:
  title: Nerve Wiki notebook API
  version: v0
paths:
  /api/v0/workspaces/{slug}/notebooks:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listNotebooks
      tags: [notebook]
      summary: List the notebooks the caller sees in a workspace
      description: >-
        The workspace's notebooks the caller has a role in: those it is a
        member of, and, for the workspace's admins and members, those open to
        the workspace; each with the caller's role in it, by name,
        case-insensitively. A private notebook the caller is no member of is
        not listed, to the workspace's admins neither. A workspace that does
        not exist, is deleted, or that the caller is no active member of is
        workspace.not_found. The list is not paged.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.not_found]
      responses:
        "200":
          description: The notebooks the caller sees.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createNotebook
      tags: [notebook]
      summary: Create a notebook
      description: >-
        Creates a notebook in the workspace whose admin is the caller; the
        workspace's admins and members can, its guests cannot (forbidden). A
        workspace that does not exist, is deleted, or that the caller is no
        active member of is workspace.not_found; the values are checked after
        both.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.not_found, forbidden, validation_failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookCreate"
      responses:
        "201":
          description: The notebook, with the caller as its admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: getNotebook
      tags: [notebook]
      summary: Get a notebook
      description: >-
        The notebook, with the caller's role in it. A notebook that does not
        exist, is deleted, or that the caller has no role in is
        notebook.not_found alike.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "200":
          description: The notebook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateNotebook
      tags: [notebook]
      summary: Change a notebook's name or workspace access
      description: >-
        Changes the fields sent and answers the notebook; only its admins
        can. A body without any field changes nothing. A notebook that does
        not exist, is deleted, or that the caller has no role in is
        notebook.not_found; an editor or a reader gets forbidden; the values
        are checked after both.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden, validation_failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookUpdate"
      responses:
        "200":
          description: The notebook, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteNotebook
      tags: [notebook]
      summary: Delete a notebook
      description: >-
        Deletes the notebook with every membership of it; only its admins
        can. No one sees it afterwards. A notebook that does not exist, is
        deleted, or that the caller has no role in is notebook.not_found; an
        editor or a reader gets forbidden.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden]
      responses:
        "204":
          description: The notebook is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/members:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    get:
      operationId: listNotebookMembers
      tags: [notebook]
      summary: List a notebook's members
      description: >-
        The notebook's active members, by when they joined; any role in the
        notebook can list them. Those who use it by its workspace access
        alone are no members and are not listed. The emails go to the
        workspace's admins and members; a guest sees null. A notebook that
        does not exist, is deleted, or that the caller has no role in is
        notebook.not_found. The list is not paged.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "200":
          description: The notebook's members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookMemberList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addNotebookMember
      tags: [notebook]
      summary: Add a member to a notebook
      description: >-
        Gives an active member of the notebook's workspace, a guest
        included, a role in the notebook; only its admins can. One whose
        membership of the notebook ended gets it back, with this role and
        the time it first joined. A notebook that does not exist, is
        deleted, or that the caller has no role in is notebook.not_found; an
        editor or a reader gets forbidden; the values are checked after
        both: user_id not_allowed when the account is no active member of
        the workspace, duplicate when it is a member of the notebook
        already.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, forbidden, validation_failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookMemberCreate"
      responses:
        "201":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookMember"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebook-members/{notebook_member_id}:
    parameters:
      - $ref: "#/components/parameters/NotebookMemberID"
    patch:
      operationId: updateNotebookMember
      tags: [notebook]
      summary: Change a notebook member's role
      description: >-
        Gives the member a new role; only the notebook's admins can, and not
        their own (notebook.own_membership). A membership that does not
        exist, has ended, or whose notebook the caller has no role in is
        notebook.member_not_found; an editor or a reader gets forbidden; the
        role is checked after both.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.member_not_found, forbidden, validation_failed, notebook.own_membership]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookMemberUpdate"
      responses:
        "200":
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookMember"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeNotebookMember
      tags: [notebook]
      summary: Remove a member from a notebook
      description: >-
        Ends the member's membership of the notebook; only its admins can,
        and not their own (notebook.own_membership: an admin leaves
        instead). A membership that does not exist, has ended, or whose
        notebook the caller has no role in is notebook.member_not_found; an
        editor or a reader gets forbidden.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.member_not_found, forbidden, notebook.own_membership]
      responses:
        "204":
          description: The membership has ended.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/notebooks/{notebook_id}/leave:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: leaveNotebook
      tags: [notebook]
      summary: Leave a notebook
      description: >-
        Ends the caller's membership of the notebook. Its only admin cannot,
        even alone in it (notebook.sole_admin): another member becomes an
        admin first, or the admin deletes the notebook. A notebook that does
        not exist, is deleted, or that the caller has no role in is
        notebook.not_found; a caller who uses it by its workspace access
        alone, no member of it, is notebook.member_not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found, notebook.member_not_found, notebook.sole_admin]
      responses:
        "204":
          description: The caller's membership has ended.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/workspaces/{slug}/ownerless-notebooks:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listOwnerlessNotebooks
      tags: [notebook]
      summary: List a workspace's ownerless notebooks
      description: >-
        The workspace's notebooks that have no active admin, the earliest to
        become ownerless first: their names, private ones included, go to
        the workspace's admins alone, who take them over or delete them. A
        member or a guest of the workspace is forbidden; a workspace that does
        not exist, is deleted, or that the caller is no active member of is
        workspace.not_found. The list is not paged.
      security: [{ bearer: [] }]
      x-problem-codes: [workspace.not_found, forbidden]
      responses:
        "200":
          description: The ownerless notebooks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerlessNotebookList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/ownerless-notebooks/{notebook_id}/take-over:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    post:
      operationId: takeOverNotebook
      tags: [notebook]
      summary: Take over an ownerless notebook
      description: >-
        Makes the caller, an admin of the notebook's workspace, the notebook's
        admin: a membership it had ended is restored, a lower role it has is
        raised; the workspace access stays. The take-over is recorded in the
        workspace's audit events. A notebook that does not exist, is deleted
        or is not ownerless, and any caller but the workspace's admins, is
        notebook.not_found: no one else learns whether it is there.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "200":
          description: The notebook, the caller its admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/ownerless-notebooks/{notebook_id}:
    parameters:
      - $ref: "#/components/parameters/NotebookID"
    delete:
      operationId: deleteOwnerlessNotebook
      tags: [notebook]
      summary: Delete an ownerless notebook
      description: >-
        Deletes the notebook softly, with its members, as deleteNotebook does;
        the purge removes it after the retention. The deletion is recorded in
        the workspace's audit events. A notebook that does not exist, is
        deleted or is not ownerless, and any caller but the workspace's
        admins, is notebook.not_found.
      security: [{ bearer: [] }]
      x-problem-codes: [notebook.not_found]
      responses:
        "204":
          description: The notebook is deleted.
        default:
          $ref: "#/components/responses/Problem"
  /api/v0/workspaces/{slug}/notebook-audit-events:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listNotebookAuditEvents
      tags: [notebook]
      summary: List the audit events of a workspace's ownerless notebooks
      description: >-
        What was done with the workspace's ownerless notebooks, newest first,
        a page at a time: taken over or deleted by a workspace admin, returned
        to their former owner. The workspace's admins alone read them; a
        member or a guest is forbidden, and a workspace that does not exist,
        is deleted, or that the caller is no active member of is
        workspace.not_found. A cursor the list cannot read is bad_request,
        before anything else; a limit outside 1–100 is validation_failed.
      security: [{ bearer: [] }]
      x-problem-codes: [bad_request, workspace.not_found, forbidden, validation_failed]
      parameters:
        - $ref: "../common.yaml#/components/parameters/Limit"
        - $ref: "../common.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookAuditEventPage"
        default:
          $ref: "#/components/responses/Problem"
components:
  # 与 api/openapi.yaml 的相同：打包时丢掉模块文件的 securitySchemes，oapi-codegen 读这一份
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: >-
        The workspace's slug. It carries no pattern here: a slug spelled
        wrong names no workspace, which the operation answers itself.
      schema:
        type: string
    NotebookID:
      name: notebook_id
      in: path
      required: true
      description: The notebook's id.
      schema:
        type: string
        format: uuid
    NotebookMemberID:
      name: notebook_member_id
      in: path
      required: true
      description: The id of a membership, as the member list answers it; not the account's id.
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before trying again, rounded up; sent with
            rate_limited, server_busy and not_ready.
          schema:
            type: integer
            minimum: 1
        WWW-Authenticate:
          description: >-
            Sent with every 401 (RFC 9110 15.5.2): Bearer error="invalid_token"
            (RFC 6750 3) when the bearer token sent is refused before the
            operation runs, being invalid or expired; plain Bearer for every
            other 401, including a credential that the operation finds revoked
            while it runs.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "../common.yaml#/components/schemas/Problem"
  schemas:
    NotebookRole:
      description: >-
        A role in a notebook: admin manages the notebook and its members,
        editor writes, reader reads. Rules compare roles by set; which of two
        is higher only the order reader < editor < admin says.
      type: string
      enum: [admin, editor, reader]
    WorkspaceAccess:
      description: >-
        How open a notebook is to its workspace: the role it gives the
        workspace's admins and members who are not its members (viewer gives
        reader, editor gives editor; none gives nothing). Guests have their
        own membership's role alone.
      type: string
      enum: [none, viewer, editor]
    Notebook:
      description: >-
        A notebook, with the caller's effective role in it: the higher of its
        membership's role and the one the workspace access gives it.
      type: object
      additionalProperties: false
      required: [id, workspace_id, name, workspace_access, role, member_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        workspace_access:
          $ref: "#/components/schemas/WorkspaceAccess"
        role:
          $ref: "#/components/schemas/NotebookRole"
        member_count:
          description: >-
            How many active members the notebook has. A private notebook
            with one member is the caller's own ("My notebooks").
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotebookList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notebook"
    NotebookCreate:
      description: A new notebook; its workspace access is none when absent.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/NotebookName"
        workspace_access:
          $ref: "#/components/schemas/WorkspaceAccess"
    NotebookUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/NotebookName"
        workspace_access:
          $ref: "#/components/schemas/WorkspaceAccess"
    NotebookName:
      description: >-
        1–255 bytes after the surrounding blanks are trimmed and the text is
        in NFC; none of / \ : * ? " < > | # ^ [ ] nor control characters; not
        starting or ending with a dot; no name Windows reserves (CON, COM1, …).
        It is the folder's name when the notebook is exported.
      type: string
    NotebookMember:
      description: A membership of a notebook, with what the caller may see of the account.
      type: object
      additionalProperties: false
      required: [id, user_id, role, display_name, email, created_at]
      properties:
        id:
          description: The membership's id, which the member operations take.
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/NotebookRole"
        display_name:
          type: string
        email:
          description: The account's email; null when the caller is a guest of the workspace.
          type: [string, "null"]
        created_at:
          description: When the account first joined; a membership given back keeps it.
          type: string
          format: date-time
    NotebookMemberList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotebookMember"
    NotebookMemberCreate:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id:
          description: The account's id, an active member of the notebook's workspace.
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/NotebookRole"
    NotebookMemberUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/NotebookRole"
    AccountProfile:
      description: >-
        What a workspace's admins see of an account in the ownerless list and
        the audit events.
      type: object
      additionalProperties: false
      required: [user_id, display_name, email]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
    OwnerlessNotebook:
      description: A notebook without an active admin, as its workspace's admins see it.
      type: object
      additionalProperties: false
      required: [id, name, workspace_access, member_count, former_owner, ownerless_since, last_activity_at, size_bytes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        workspace_access:
          $ref: "#/components/schemas/WorkspaceAccess"
        member_count:
          description: How many active members the notebook has left.
          type: integer
        former_owner:
          $ref: "#/components/schemas/AccountProfile"
        ownerless_since:
          description: When its last active admin's membership ended.
          type: string
          format: date-time
        last_activity_at:
          description: The last write to the notebook or to what it holds.
          type: string
          format: date-time
        size_bytes:
          description: What the notebook holds, in bytes.
          type: integer
          format: int64
    OwnerlessNotebookList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OwnerlessNotebook"
    NotebookAuditAction:
      description: >-
        What was done: taken_over and deleted by a workspace admin, returned
        to the former owner when it came back to the workspace.
      type: string
      enum: [taken_over, deleted, returned]
    NotebookAuditEvent:
      description: >-
        What was done with an ownerless notebook. It names the notebook as it
        was then, and outlives it.
      type: object
      additionalProperties: false
      required: [id, action, notebook_id, notebook_name, former_owner, actor, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/NotebookAuditAction"
        notebook_id:
          type: string
          format: uuid
        notebook_name:
          type: string
        former_owner:
          $ref: "#/components/schemas/AccountProfile"
        actor:
          $ref: "#/components/schemas/AccountProfile"
        created_at:
          type: string
          format: date-time
    NotebookAuditEventPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NotebookAuditEvent"
        next_cursor:
          $ref: "../common.yaml#/components/schemas/NextCursor"
