# Nerve Wiki 接口描述的入口：列出所有路径，指向各模块的描述文件，是整个接口的目录。
# make gen-web 用 Redocly 把它打包成 dist/openapi.yaml。写法约定由 server/internal/platform/httpserver/apitest/rules_test.go 检查。
openapi: 3.1.0
info:
  title: Nerve Wiki API
  version: v0
  description: >-
    The HTTP API of Nerve Wiki. The web app is one client of it; every account
    can use every endpoint the same way. Every operation lists the problem
    codes it can answer in x-problem-codes; the top-level x-problem-codes can
    come from every operation, and an operation that needs a bearer token can
    also answer unauthorized.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
# 每个操作都可能返回的平台错误码，只写在这里。rate_limited：平台的桶（公开操作按客户端 IP，其余按凭证）
x-problem-codes: [bad_request, payload_too_large, rate_limited, internal_error]
tags:
  - name: identity
    description: Accounts, sign-in, sessions and personal access tokens.
  - name: instance
    description: What this instance runs.
  - name: workspace
    description: Workspaces, their members and invitations.
  - name: notebook
    description: Notebooks and their members.
paths:
  /api/v0/auth/register:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1auth~1register"
  /api/v0/auth/login:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1auth~1login"
  /api/v0/auth/refresh:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1auth~1refresh"
  /api/v0/auth/logout:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1auth~1logout"
  /api/v0/me:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1me"
  /api/v0/me/onboarding-steps:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1me~1onboarding-steps"
  /api/v0/me/change-password:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1me~1change-password"
  /api/v0/me/deactivate:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1me~1deactivate"
  /api/v0/me/api-tokens:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1me~1api-tokens"
  /api/v0/api-tokens/{token_id}:
    $ref: "modules/identity.yaml#/paths/~1api~1v0~1api-tokens~1{token_id}"
  /api/v0/instance:
    $ref: "modules/instance.yaml#/paths/~1api~1v0~1instance"
  /api/v0/workspaces:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspaces"
  /api/v0/workspaces/{slug}:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspaces~1{slug}"
  /api/v0/workspaces/{slug}/members:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspaces~1{slug}~1members"
  /api/v0/workspaces/{slug}/leave:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspaces~1{slug}~1leave"
  /api/v0/workspaces/{slug}/invitations:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspaces~1{slug}~1invitations"
  /api/v0/workspace-members/{workspace_member_id}:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspace-members~1{workspace_member_id}"
  /api/v0/workspace-invitations/{workspace_invitation_id}:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspace-invitations~1{workspace_invitation_id}"
  /api/v0/workspace-invitations/{workspace_invitation_id}/preview:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspace-invitations~1{workspace_invitation_id}~1preview"
  /api/v0/workspace-invitations/{workspace_invitation_id}/accept:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspace-invitations~1{workspace_invitation_id}~1accept"
  /api/v0/workspace-slugs/{slug}:
    $ref: "modules/workspace.yaml#/paths/~1api~1v0~1workspace-slugs~1{slug}"
  /api/v0/workspaces/{slug}/notebooks:
    $ref: "modules/notebook.yaml#/paths/~1api~1v0~1workspaces~1{slug}~1notebooks"
  /api/v0/notebooks/{notebook_id}:
    $ref: "modules/notebook.yaml#/paths/~1api~1v0~1notebooks~1{notebook_id}"
components:
  # 模块文件的 securitySchemes 在打包时被丢掉，操作引用的 scheme 写在这里
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        An access token (JWT) from register, login or refresh, or a personal
        access token (nwk_pat_) from createApiToken.
